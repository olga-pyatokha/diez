<style>
:root{
  --bg:#12100e; --panel:#1b1815; --panel2:#231f1b; --line:#332d27;
  --ink:#ece6df; --dim:#9b9186; --amber:#e8a33d; --green:#7fc08a;
  --red:#d9736b; --blue:#8fb3d9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{
  font:17px/1.62 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:max(14px,env(safe-area-inset-top)) 14px calc(84px + env(safe-area-inset-bottom));
  max-width:680px;margin:0 auto;overscroll-behavior-y:contain;
}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:-.01em;margin:0}
h1{font-size:25px}
h2{font-size:20px;margin:0 0 4px}
.sub{color:var(--dim);font-size:13.5px;line-height:1.5}
.tw{color:var(--amber);font-weight:600}
.rw{color:var(--green);font-style:normal;border-bottom:1px dotted var(--green)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;margin:11px 0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.btn{display:block;width:100%;padding:14px;border-radius:12px;background:var(--amber);color:#1a1200;
  font-weight:700;font-size:16.5px;text-align:center;margin-top:12px}
.btn:disabled{opacity:.32}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line);font-weight:600}
.row{display:flex;gap:9px}.row>*{flex:1}
input[type=text],input[type=time]{width:100%;padding:13px 12px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel2);color:var(--ink);font:inherit;-webkit-appearance:none}
input:focus{outline:2px solid var(--amber);outline-offset:-1px}

/* header + streak */
header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.stat{display:flex;gap:16px;margin:12px 0 4px}
.stat div{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font:600 22px/1.2 Georgia,serif;color:var(--amber)}
.stat span{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}

/* lesson list */
.lesson{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;
  background:var(--panel);border:1px solid var(--line);border-radius:13px;margin:9px 0}
.lesson .num{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;
  font:600 14px Georgia,serif;background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
.lesson.done .num{background:var(--green);color:#10200f;border-color:var(--green)}
.lesson.part .num{border-color:var(--amber);color:var(--amber)}
.lesson .t{flex:1;min-width:0}
.lesson .t b{display:block;font-weight:600;font-size:16px}
.lesson .t span{font-size:12.5px;color:var(--dim)}
.lesson .chev{color:var(--dim)}

/* steps */
.steps{display:flex;gap:6px;margin:12px 0 4px}
.steps button{flex:1;padding:9px 4px;border-radius:10px;background:var(--panel);border:1px solid var(--line);
  font-size:13px;color:var(--dim)}
.steps button.on{background:var(--amber);color:#1a1200;border-color:var(--amber);font-weight:700}
.steps button.ok{color:var(--green);border-color:#33452f}

/* reading */
.passage p{margin:0 0 13px}
.gloss{background:var(--panel2);border-left:3px solid var(--line);border-radius:0 10px 10px 0;
  padding:11px 13px;font-size:14px;color:var(--dim)}
details{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
summary{cursor:pointer;color:var(--blue);font-size:14.5px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";}
details[open] summary::before{content:"▾ ";}

/* cards */
.prog{height:3px;background:var(--panel2);border-radius:2px;overflow:hidden;margin:2px 0 14px}
.prog i{display:block;height:100%;background:var(--amber);transition:width .25s}
.qes{font:19px/1.62 Georgia,serif;margin:6px 0 14px}
.gap{display:inline-block;min-width:70px;border-bottom:2px solid var(--amber);vertical-align:baseline}
.reveal{margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.reveal .mean{font:600 20px Georgia,serif;color:var(--amber);margin-bottom:2px}
.reveal .tr{color:var(--dim);font-size:14.5px;margin-bottom:10px}
.hook{background:var(--panel2);border-radius:10px;padding:11px 12px;font-size:14px;color:#cfc6bb}
.wline{display:flex;align-items:center;gap:9px;justify-content:space-between}
.wline b{font:600 21px Georgia,serif}
.wmean{color:var(--ink);font-size:15.5px;margin-top:2px}
.yours{font-size:13.5px;color:var(--dim);margin-top:10px}
.yours b{color:var(--ink);font-weight:600}
.mark{display:flex;gap:9px;margin-top:12px}
.mark button{flex:1;padding:12px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);font-weight:600}
.mark button.si{color:var(--green)}.mark button.no{color:var(--red)}
.ok{color:var(--green)}.bad{color:var(--red)}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.tag.new{color:var(--amber);border-color:#5a4423}
.tag.rev{color:var(--green);border-color:#33452f}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(18,16,14,.94);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:9px 14px calc(9px + env(safe-area-inset-bottom));
  display:flex;gap:9px;max-width:680px;margin:0 auto}
.bar button{flex:1;padding:12px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);
  font-size:14px;font-weight:600}
.bar button.primary{background:var(--amber);color:#1a1200}
.hide{display:none}
.note{font-size:13px;color:var(--dim);line-height:1.55}
.note b{color:var(--ink)}
.dots{display:flex;gap:5px;margin-top:8px}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--panel2);border:1px solid var(--line)}
.dots i.on{background:var(--green);border-color:var(--green)}
</style>
</head>

const KEY = "diez.v1";
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const today = () => new Date().toLocaleDateString('en-CA');
const hasNotif = () => typeof Notification !== 'undefined' && typeof Notification.requestPermission === 'function';

/* ---------- state ---------- */
const blank = () => ({lessons:{}, days:[], reminder:null, notified:null});
let S;
try { S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY)||"{}")); }
catch(e){ S = blank(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function L(n){ return S.lessons[n] || (S.lessons[n] = {words:false, read:false, cards:{}, cloze:{}, doneAt:null}); }
function touchDay(){ const d=today(); if(!S.days.includes(d)){ S.days.push(d); S.days=S.days.slice(-120); } save(); }

function cardsOf(l){
  return l.new_words.map((c,j)=>({...c,kind:'new',k:'n'+j}))
    .concat(l.review_cards.map((c,j)=>({...c,k:'r'+j})));
}
function lessonDone(n){
  const st=L(n), l=PKG.lessons[n-1];
  return st.words && st.read && Object.keys(st.cards).length>=cardsOf(l).length
      && Object.keys(st.cloze).length>=l.cloze.length;
}
function lessonStarted(n){
  const st=L(n);
  return st.words || st.read || Object.keys(st.cards).length || Object.keys(st.cloze).length;
}
function streak(){
  let n=0, d=new Date();
  for(;;){ const k=d.toLocaleDateString('en-CA');
    if(S.days.includes(k)){ n++; d.setDate(d.getDate()-1); }
    else if(n===0 && k===today()){ d.setDate(d.getDate()-1); }
    else break;
    if(n>200) break; }
  return n;
}
function wordsSeen(){
  let n=0;
  PKG.lessons.forEach((l,i)=>{ const st=L(i+1);
    l.new_words.forEach((c,j)=>{ if(st.cards['n'+j]) n++; }); });
  return n;
}

/* ---------- router ---------- */
let view = {name:'home'};
function go(v){ view=v; window.scrollTo(0,0); render(); }

function render(){
  const a=$('#app'), b=$('#bar');
  if(view.name==='home') { a.innerHTML=homeHTML(); b.innerHTML=homeBar(); }
  else if(view.name==='lesson'){ a.innerHTML=lessonHTML(); b.innerHTML=lessonBar(); }
  else if(view.name==='remind'){ a.innerHTML=remindHTML(); b.innerHTML=backBar(); }
  wire();
}

/* ---------- home ---------- */
function homeHTML(){
  const done = PKG.lessons.filter((l,i)=>lessonDone(i+1)).length;
  const week = [...Array(7)].map((_,i)=>{
    const d=new Date(); d.setDate(d.getDate()-(6-i));
    return S.days.includes(d.toLocaleDateString('en-CA'));
  });
  return `
  <header><h1>${esc(PKG.package)}</h1></header>
  <p class="sub">${esc(PKG.subtitle)} · banda ${esc(PKG.band)} · ${PKG.minutes_each} min cada una</p>
  <div class="stat">
    <div><b>${done}<span style="font-size:13px;color:var(--dim)">/10</span></b><span>lecciones</span></div>
    <div><b>${wordsSeen()}</b><span>palabras nuevas</span></div>
    <div><b>${streak()}</b><span>días seguidos</span></div>
  </div>
  <div class="dots">${week.map(x=>`<i class="${x?'on':''}"></i>`).join('')}</div>
  ${PKG.lessons.map((l,i)=>{
    const n=i+1, d=lessonDone(n), p=!d&&lessonStarted(n);
    const st=L(n);
    const bits=[st.words?'palabras':null, st.read?'lectura':null,
      Object.keys(st.cards).length?`${Object.keys(st.cards).length}/${cardsOf(l).length} tarjetas`:null,
      Object.keys(st.cloze).length?`${Object.keys(st.cloze).length}/${l.cloze.length} huecos`:null
    ].filter(Boolean);
    return `<button class="lesson ${d?'done':p?'part':''}" data-go="${n}">
      <span class="num">${d?'✓':n}</span>
      <span class="t"><b>${esc(l.title)}</b>
        <span>${bits.length?bits.join(' · '):`${l.new_words.length} palabras nuevas · ${l.review_cards.length} de repaso`}</span></span>
      <span class="chev">›</span></button>`;
  }).join('')}
  <div class="card">
    <h2>Recordatorio diario</h2>
    <p class="note">${S.reminder ? `Programado a las <b>${S.reminder}</b>.` : 'Sin programar.'}
    Toca abajo para ponerlo, o para bajar el recordatorio de calendario que sí suena con la app cerrada.</p>
  </div>`;
}
function homeBar(){
  const next = PKG.lessons.findIndex((l,i)=>!lessonDone(i+1));
  const n = next<0 ? 1 : next+1;
  return `<button data-nav="remind">Recordatorio</button>
          <button class="primary" data-go="${n}">${next<0?'Repasar':'Continuar · '+n}</button>`;
}

/* ---------- lesson ---------- */
function lessonHTML(){
  const l=PKG.lessons[view.n-1], st=L(view.n), step=view.step||'words';
  const cs=cardsOf(l);
  const head=`
  <header><h1>${view.n}. ${esc(l.title)}</h1><button data-nav="home" class="sub">cerrar ✕</button></header>
  <div class="steps">
    <button data-step="words" class="${step==='words'?'on':''} ${st.words?'ok':''}">Palabras</button>
    <button data-step="read"  class="${step==='read'?'on':''} ${st.read?'ok':''}">Leer</button>
    <button data-step="cards" class="${step==='cards'?'on':''} ${Object.keys(st.cards).length>=cs.length?'ok':''}">Tarjetas ${Object.keys(st.cards).length}/${cs.length}</button>
    <button data-step="cloze" class="${step==='cloze'?'on':''} ${Object.keys(st.cloze).length>=l.cloze.length?'ok':''}">Huecos ${Object.keys(st.cloze).length}/${l.cloze.length}</button>
  </div>`;
  if(step==='words') return head+wordsHTML(l);
  if(step==='read')  return head+readHTML(l);
  if(step==='cards') return head+cardHTML(l,cs);
  return head+clozeHTML(l);
}

// Study step. Deliberately no input: meeting the word correctly comes first,
// retrieval comes later in Tarjetas, where a wrong answer gets corrected.
function wordsHTML(l){
  return `<p class="sub">Léelas antes del texto. Sin escribir nada — solo para
  encontrarlas ya sabidas cuando aparezcan.</p>
  ${l.new_words.map(w=>`<div class="card">
    <div class="wline"><b class="tw">${esc(w.word)}</b><span class="tag new">nueva</span></div>
    <div class="wmean">${esc(w.en)}</div>
    <p class="qes" style="font-size:17px;margin:10px 0 8px">${w.es_html}</p>
    <p class="sub">${esc(w.en_sentence)}</p>
    <div class="hook" style="margin-top:10px">${esc(w.hook)}</div>
  </div>`).join('')}
  ${l.review_cards.length?`<div class="card">
    <h2>Y vuelven</h2>
    <p class="note">${l.review_cards.map(c=>`<b class="rw">${esc(c.word)}</b>`).join(' · ')}</p>
  </div>`:''}`;
}
function readHTML(l){
  return `<div class="card passage">
    ${l.passage_html.map(p=>`<p>${p}</p>`).join('')}
  </div>
  <div class="gloss"><b>Apoyo, no se registra:</b> ${l.glosses.map(esc).join(' · ')}</div>
  <details><summary>Traducción</summary>
    ${l.translation.map(p=>`<p class="sub" style="font-size:15px">${esc(p)}</p>`).join('')}</details>
  <details><summary>Recordar las palabras</summary>
    ${l.new_words.map(w=>`<p class="sub" style="font-size:15px"><b class="tw">${esc(w.word)}</b> — ${esc(w.en)}</p>`).join('')}</details>`;
}
function cardHTML(l,cs){
  const st=L(view.n);
  let i = cs.findIndex((c,j)=>!st.cards[c.k]);
  if(view.forceCard!=null) i=view.forceCard;
  if(i<0){
    return `<div class="card"><h2>Tarjetas completas</h2>
      <p class="note">${cs.length} de ${cs.length}. Pasa a los huecos, o repite cualquiera desde la lista.</p>
      <button class="btn" data-step="cloze">Ir a los huecos</button>
      <button class="btn ghost" data-recard="0">Repetir desde el principio</button></div>
      ${cs.map((c,j)=>{const a=st.cards[c.k]||{};
        return `<button class="lesson" data-recard="${j}"><span class="num">${a.rating==='si'?'✓':'·'}</span>
        <span class="t"><b>${esc(c.word)}</b><span>${esc(a.en||'—')}</span></span><span class="chev">›</span></button>`;}).join('')}`;
  }
  const c=cs[i], k=c.k, prev=st.cards[k]||{};
  return `<div class="prog"><i style="width:${Math.round(i/cs.length*100)}%"></i></div>
  <div class="card" id="cardbox" data-k="${k}" data-i="${i}">
    <span class="tag ${c.kind==='new'?'new':'rev'}">${c.kind==='new'?'nueva':'repaso'} · ${i+1}/${cs.length}</span>
    ${c.kind==='new'
      ? `<p class="qes">${c.es_html}</p>`
      : `<p class="qes" style="font-size:24px"><b class="tw">${esc(c.word)}</b></p>
         <p class="sub" style="font-size:15px;margin:-6px 0 14px">${c.es_html}</p>`}
    <input type="text" id="ans" placeholder="En inglés…" autocomplete="off"
      autocorrect="off" autocapitalize="none" spellcheck="false" value="${esc(prev.en||'')}">
    <button class="btn" id="show" disabled>Ver respuesta</button>
    <div id="rev" class="reveal hide">
      <div class="mean">${esc(c.word)} — ${esc(c.en)}</div>
      <div class="tr">${esc(c.en_sentence)}</div>
      <div class="hook">${esc(c.hook)}</div>
      <div class="yours">Escribiste: <b id="yours"></b></div>
      <div class="mark">
        <button class="si" data-rate="si">Lo tenía</button>
        <button class="no" data-rate="no">No lo tenía</button>
      </div>
    </div>
  </div>`;
}
function clozeHTML(l){
  const st=L(view.n);
  let i=l.cloze.findIndex((g,j)=>!st.cloze['c'+j]);
  if(view.forceGap!=null) i=view.forceGap;
  if(i<0){
    const right=l.cloze.filter((g,j)=>(st.cloze['c'+j]||{}).ok).length;
    const done=lessonDone(view.n);
    if(done && L(view.n).doneAt!==today()){ L(view.n).doneAt=today(); touchDay(); }
    return `<div class="card"><h2>Huecos completos</h2>
      <p class="note"><b>${right}/${l.cloze.length}</b> a la primera.</p>
      ${done?`<p class="note">Lección ${view.n} cerrada. ${view.n<10?'La siguiente te espera.':'Paquete terminado.'}</p>`:''}
      ${view.n<10?`<button class="btn" data-go="${view.n+1}">Lección ${view.n+1}</button>`:''}
      <button class="btn ghost" data-nav="home">Volver al índice</button></div>
      ${l.cloze.map((g,j)=>{const a=st.cloze['c'+j]||{};
        return `<div class="card"><p class="qes" style="font-size:16px">${g.es_html.replace('<span class="gap">&nbsp;&nbsp;&nbsp;&nbsp;</span>','<b class="tw">'+esc(g.answer)+'</b>')}</p>
        <p class="sub">${esc(g.en)}</p>
        <p class="sub">Tu respuesta: <b class="${a.ok?'ok':'bad'}">${esc(a.en||'—')}</b></p></div>`;}).join('')}`;
  }
  const g=l.cloze[i];
  return `<div class="prog"><i style="width:${Math.round(i/l.cloze.length*100)}%"></i></div>
  <div class="card" id="gapbox" data-i="${i}">
    <span class="tag">hueco ${i+1}/${l.cloze.length}</span>
    <p class="qes">${g.es_html}</p>
    ${g.support?`<p class="sub">${esc(g.support)}</p>`:''}
    <input type="text" id="gap" placeholder="La palabra que falta…" autocomplete="off"
      autocorrect="off" autocapitalize="none" spellcheck="false">
    <button class="btn" id="check" disabled>Comprobar</button>
    <div id="grev" class="reveal hide">
      <div class="mean" id="verdict"></div>
      <div class="tr">${esc(g.en)}</div>
      <button class="btn ghost" id="nextgap">Siguiente</button>
    </div>
  </div>`;
}
function lessonBar(){
  const st=L(view.n), step=view.step||'words';
  if(step==='words') return `<button data-nav="home">Índice</button>
    <button class="primary" data-wordsdone="1">${st.words?'Seguir al texto':'Ya las vi · al texto'}</button>`;
  if(step==='read') return `<button data-step="words">Palabras</button>
    <button class="primary" data-readdone="1">${st.read?'Seguir con las tarjetas':'Leído · a las tarjetas'}</button>`;
  return `<button data-nav="home">Índice</button><button data-step="read">Volver al texto</button>`;
}
function backBar(){ return `<button class="primary" data-nav="home">Volver</button>`; }

/* ---------- reminders ---------- */
function remindHTML(){
  const perm = hasNotif() ? Notification.permission : 'unsupported';
  const state = {granted:'concedido', denied:'bloqueado', default:'sin pedir', unsupported:'no disponible'}[perm];
  return `<header><h1>Recordatorio</h1><button data-nav="home" class="sub">cerrar ✕</button></header>
  <div class="card">
    <h2>Hora</h2>
    <p class="note">A qué hora quieres el aviso.</p>
    <input type="time" id="rtime" value="${S.reminder||'08:00'}">
    <button class="btn" id="setr">Guardar hora</button>
  </div>
  <div class="card">
    <h2>Aviso en la app</h2>
    <p class="note">Permiso: <b>${state}</b>. Esto funciona <b>mientras la app está abierta o en segundo plano</b>.
    Si la cierras del todo, el sistema la congela y no salta nada.</p>
    <button class="btn ghost" id="askn">Permitir notificaciones</button>
    <button class="btn ghost" id="testn">Probar ahora</button>
  </div>
  <div class="card">
    <h2>Aviso de calendario</h2>
    <p class="note">Este es el que <b>sí suena con la app cerrada</b>. Baja el archivo, ábrelo y el móvil crea
    un evento diario de ${PKG.minutes_each} minutos con alarma a la hora que guardaste. Sin servidor, sin cuenta, sin caducidad.</p>
    <button class="btn" id="ics">Bajar recordatorio diario (.ics)</button>
  </div>
  <div class="card">
    <h2>Instalar en el móvil</h2>
    <p class="note"><b>iPhone:</b> Compartir → Añadir a pantalla de inicio.<br>
    <b>Android:</b> menú ⋮ → Instalar aplicación.<br>
    Queda como icono propio, a pantalla completa, y <b>funciona sin señal</b>: las diez
    lecciones se guardan en el móvil la primera vez que abres la página.</p>
    <p class="note" id="offl"></p>
  </div>
  <div class="card">
    <h2>Tus respuestas</h2>
    <p class="note">Baja lo que has escrito para que se corrija y entre en <b>vocab.json</b>.</p>
    <button class="btn ghost" id="exp">Exportar respuestas (.json)</button>
    <button class="btn ghost" id="reset" style="color:var(--red)">Borrar todo el progreso</button>
  </div>`;
}
function icsFile(){
  const t=(S.reminder||'08:00').split(':');
  const d=new Date(); d.setHours(+t[0],+t[1],0,0);
  const p=n=>String(n).padStart(2,'0');
  const fmt=x=>`${x.getFullYear()}${p(x.getMonth()+1)}${p(x.getDate())}T${p(x.getHours())}${p(x.getMinutes())}00`;
  const end=new Date(d.getTime()+PKG.minutes_each*60000);
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//diez//spanish//ES","CALSCALE:GREGORIAN",
    "BEGIN:VEVENT","UID:diez-spanish-daily@local","DTSTAMP:"+fmt(new Date()),
    "DTSTART:"+fmt(d),"DTEND:"+fmt(end),"RRULE:FREQ=DAILY",
    "SUMMARY:Español · 10 minutos","DESCRIPTION:Una lección del paquete de diez.",
    "BEGIN:VALARM","TRIGGER:PT0M","ACTION:DISPLAY","DESCRIPTION:Español · 10 minutos","END:VALARM",
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
}
function download(name, text, type){
  const b=new Blob([text],{type:type||'text/plain;charset=utf-8'});
  const u=URL.createObjectURL(b), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},1500);
}
function exportAnswers(){
  const out={package:PKG.package, exported:new Date().toISOString(), lessons:[]};
  PKG.lessons.forEach((l,i)=>{
    const st=L(i+1), cs=cardsOf(l);
    out.lessons.push({n:i+1, title:l.title,
      cards: cs.map((c,j)=>{const a=st.cards[c.k]||{};
        return {word:c.word, kind:c.kind, en:a.en||null, rating:a.rating||null};}),
      cloze: l.cloze.map((g,j)=>{const a=st.cloze['c'+j]||{};
        return {answer:g.answer, wrote:a.en||null, ok:a.ok??null};})});
  });
  download(`diez_respuestas_${today()}.json`, JSON.stringify(out,null,2), 'application/json');
}
let timer=null;
function scheduleLocal(){
  if(timer) clearInterval(timer);
  timer=setInterval(()=>{
    if(!S.reminder || !hasNotif() || Notification.permission!=='granted') return;
    const now=new Date(), k=today();
    if(S.notified===k) return;
    const [h,m]=S.reminder.split(':').map(Number);
    if(now.getHours()>h || (now.getHours()===h && now.getMinutes()>=m)){
      if(S.days.includes(k)) return;
      S.notified=k; save();
      const n=PKG.lessons.findIndex((l,i)=>!lessonDone(i+1));
      try{ new Notification("Español · 10 minutos", {
        body: n<0?"Repaso libre.":`Lección ${n+1}: ${PKG.lessons[n].title}`,
        tag:"diez-daily"}); }catch(e){}
    }
  }, 30000);
}

/* ---------- events ---------- */
function wire(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go({name:'lesson',n:+b.dataset.go,step:'words'}));
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go({name:b.dataset.nav}));
  document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>go({name:'lesson',n:view.n,step:b.dataset.step}));
  document.querySelectorAll('[data-recard]').forEach(b=>b.onclick=()=>go({name:'lesson',n:view.n,step:'cards',forceCard:+b.dataset.recard}));
  const wd=$('[data-wordsdone]');
  if(wd) wd.onclick=()=>{ L(view.n).words=true; touchDay(); go({name:'lesson',n:view.n,step:'read'}); };
  const rd=$('[data-readdone]');
  if(rd) rd.onclick=()=>{ L(view.n).read=true; touchDay(); go({name:'lesson',n:view.n,step:'cards'}); };

  const box=$('#cardbox');
  if(box){
    const ans=$('#ans'), show=$('#show'), rev=$('#rev');
    const sync=()=>{ show.disabled = ans.value.trim().length===0; };
    ans.oninput=sync; sync(); setTimeout(()=>ans.focus(),80);
    ans.onkeydown=e=>{ if(e.key==='Enter' && !show.disabled) show.click(); };
    show.onclick=()=>{ show.classList.add('hide'); rev.classList.remove('hide');
      $('#yours').textContent=ans.value.trim(); ans.blur();
      rev.scrollIntoView({behavior:'smooth',block:'nearest'}); };
    document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{
      L(view.n).cards[box.dataset.k]={en:ans.value.trim(), rating:b.dataset.rate, at:today()};
      touchDay(); go({name:'lesson',n:view.n,step:'cards'}); });
  }
  const gbox=$('#gapbox');
  if(gbox){
    const g=PKG.lessons[view.n-1].cloze[+gbox.dataset.i];
    const inp=$('#gap'), chk=$('#check'), rev=$('#grev');
    const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim()
                   .replace(/^(el|la|los|las|un|una)\s+/,'');
    const sync=()=>{ chk.disabled=inp.value.trim().length===0; };
    inp.oninput=sync; sync(); setTimeout(()=>inp.focus(),80);
    inp.onkeydown=e=>{ if(e.key==='Enter' && !chk.disabled) chk.click(); };
    chk.onclick=()=>{
      const ok = norm(inp.value)===norm(g.answer);
      chk.classList.add('hide'); rev.classList.remove('hide'); inp.blur();
      $('#verdict').innerHTML = ok
        ? `<span class="ok">✓ ${esc(g.answer)}</span>`
        : `<span class="bad">✗ ${esc(inp.value.trim())}</span> → <span class="ok">${esc(g.answer)}</span>`;
      L(view.n).cloze['c'+gbox.dataset.i]={en:inp.value.trim(), ok, at:today()};
      touchDay();
      $('#nextgap').onclick=()=>go({name:'lesson',n:view.n,step:'cloze'});
      rev.scrollIntoView({behavior:'smooth',block:'nearest'});
    };
  }
  const setr=$('#setr');
  if(setr){
    setr.onclick=()=>{ S.reminder=$('#rtime').value; S.notified=null; save(); scheduleLocal();
      setr.textContent='Guardado ✓'; setTimeout(()=>setr.textContent='Guardar hora',1400); };
    $('#askn').onclick=async()=>{
      if(!hasNotif()){ alert("Este navegador no ofrece notificaciones aquí. Usa el recordatorio de calendario."); return; }
      try{ await Notification.requestPermission(); }catch(e){} render(); };
    $('#testn').onclick=()=>{ if(hasNotif() && Notification.permission==='granted')
        new Notification("Español · 10 minutos",{body:"Así se va a ver.",tag:"diez-test"});
      else alert("Primero permite las notificaciones."); };
    $('#ics').onclick=()=>download('espanol_diario.ics', icsFile(), 'text/calendar;charset=utf-8');
    const off=$('#offl');
    if(off) off.innerHTML = ('serviceWorker' in navigator && location.protocol.startsWith('http'))
      ? (navigator.serviceWorker.controller ? 'Sin conexión: <b>listo</b>.' : 'Sin conexión: preparando…')
      : 'Sin conexión: <b>no disponible desde un archivo local</b>, abre la versión publicada.';
    $('#exp').onclick=exportAnswers;
    $('#reset').onclick=()=>{ if(confirm("¿Borrar todo el progreso?")){ S=blank(); save(); go({name:'home'}); } };
  }
}

/* ---------- offline ---------- */
// Only meaningful when served over http(s); from file:// this is a no-op.
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js", {scope: "./"}).catch(()=>{});
  });
}

render();
scheduleLocal();
</script>
</body>
</html>
