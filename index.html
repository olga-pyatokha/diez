function icsFile(){
  const t=(S.reminder||'08:00').split(':');
  const d=new Date(); d.setHours(+t[0],+t[1],0,0);
  const p=n=>String(n).padStart(2,'0');
  const fmt=x=>`${x.getFullYear()}${p(x.getMonth()+1)}${p(x.getDate())}T${p(x.getHours())}${p(x.getMinutes())}00`;
  const end=new Date(d.getTime()+PKG.minutes_each*60000);
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//diez//spanish//ES","CALSCALE:GREGORIAN",
    "BEGIN:VEVENT","UID:diez-spanish-daily@local","DTSTAMP:"+fmt(new Date()),
    "DTSTART:"+fmt(d),"DTEND:"+fmt(end),"RRULE:FREQ=DAILY",
    "SUMMARY:Español · 10 minutos","DESCRIPTION:Una lección de diez minutos.",
    "BEGIN:VALARM","TRIGGER:PT0M","ACTION:DISPLAY","DESCRIPTION:Español · 10 minutos","END:VALARM",
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
}
async function download(name, text, type){
  if(DLS){   /* the artifact viewer blocks page-started downloads; ask through the runtime */
    try{ await DLS.save({filename:name, data:text}); toast('Guardado'); }
    catch(e){ if(!(e && e.code==='declined')) toast('No se pudo guardar desde aquí'); }
    return;
  }
  const b=new Blob([text],{type:type||'text/plain;charset=utf-8'});
  const u=URL.createObjectURL(b), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},1500);
}
function exportPayload(){
  const out={package:PKG.package, exported:new Date().toISOString(), lessons:[]};
  PKG.lessons.forEach((l,i)=>{
    const st=L(i+1), cs=cardsOf(l);
    out.lessons.push({n:i+1, title:l.title, done:lessonDone(i+1), doneAt:st.doneAt||null,
      words:!!st.words, read:!!st.read,
      cards: cs.map((c,j)=>{const a=st.cards[c.k]||{};
        return {word:c.word, kind:c.kind, en:a.en||null, rating:a.rating||null, at:a.at||null};}),
      cloze: l.cloze.map((g,j)=>{const a=st.cloze['c'+j]||{};
        return {answer:g.answer, lemma:g.lemma, wrote:a.en||null, ok:a.ok??null,
                assisted:a.assisted??null, at:a.at||null};})});
  });
  const dk=S.deck, dcs=PKG.deck.cards;
  out.deck={pass:dk.pass, seed:dk.seed,
    cards: dcs.map(c=>{const a=dk.cards[c.k]||{}; return {word:c.word, lesson:c.lesson, en:a.en||null, rating:a.rating||null, at:a.at||null};}),
    history: dk.history};
  return out;
}
function exportAnswers(){
  download(`diez_respuestas_${today()}.json`, JSON.stringify(exportPayload(),null,2), 'application/json');
}
/* What the phone pushes: the graded answers plus the raw state, so a restore
   is possible from the same file the importer reads. */
function snapshot(){
  return {package:PKG.package, built:PKG.built, device:DEV, via:backend()||"none",
          pushed:new Date().toISOString(),
          days:S.days, streak:streak(), words_seen:wordsSeen(),
          answers:exportPayload(), state:S, legacy_v1:S.legacy_v1||null};
}
let timer=null;
function scheduleLocal(){
  if(timer) clearInterval(timer);
  timer=setInterval(()=>{
    if(!S.reminder || !hasNotif() || Notification.permission!=='granted') return;
    const now=new Date(), k=today();
    if(S.notified===k) return;
    const [h,m]=S.reminder.split(':').map(Number);
    if(now.getHours()>h || (now.getHours()===h && now.getMinutes()>=m)){
      if(S.days.includes(k)) return;
      S.notified=k; save();
      const n=PKG.lessons.findIndex((l,i)=>!lessonDone(i+1));
      try{ new Notification("Español · 10 minutos", {
        body: n<0?"Repaso libre.":`Lección ${n+1}: ${PKG.lessons[n].title}`,
        tag:"diez-daily"}); }catch(e){}
    }
  }, 30000);
}

/* ---------- events ---------- */
function wire(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go({name:'lesson',n:+b.dataset.go,step:'words'}));
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go({name:b.dataset.nav}));
  document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>go({name:'lesson',n:view.n,step:b.dataset.step}));
  document.querySelectorAll('[data-recard]').forEach(b=>b.onclick=()=> view.name==='deck'
    ? go({name:'deck',forceCard:+b.dataset.recard})
    : go({name:'lesson',n:view.n,step:'cards',forceCard:+b.dataset.recard}));
  const da=$('#deckagain');
  if(da) da.onclick=()=>armed(da, 'Toca otra vez para empezar una vuelta nueva', ()=>{ deckArchive(); syNow(); go({name:'deck'}); });
  const wd=$('[data-wordsdone]');
  if(wd) wd.onclick=()=>{ L(view.n).words=true; touchDay(); syNow(); go({name:'lesson',n:view.n,step:'read'}); };
  const rd=$('[data-readdone]');
  if(rd) rd.onclick=()=>{ L(view.n).read=true; touchDay(); syNow(); go({name:'lesson',n:view.n,step:'cards'}); };

  const box=$('#cardbox');
  if(box){
    const show=$('#show'), rev=$('#rev');
    const flip=()=>{ if(!show.classList.contains('hide')){ show.classList.add('hide'); rev.classList.remove('hide');
      rev.scrollIntoView({behavior:'smooth',block:'nearest'}); } };
    show.onclick=flip;
    // The whole front of the card flips it, so a tap anywhere works on the phone.
    box.onclick=e=>{ if(!e.target.closest('[data-rate]') && !e.target.closest('#rev')) flip(); };
    document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{
      const k=box.dataset.k, a={en:null, rating:b.dataset.rate, at:today()};
      if(view.name==='deck'){ const c=deckCard(k); if(c) a.lesson=c.lesson; S.deck.cards[k]=a; touchDay(); go({name:'deck'}); }
      else { L(view.n).cards[k]=a; touchDay(); go({name:'lesson',n:view.n,step:'cards'}); } });
  }
  const gbox=$('#gapbox');
  if(gbox){
    const g=PKG.lessons[view.n-1].cloze[+gbox.dataset.i];
    const inp=$('#gap'), chk=$('#check'), rev=$('#grev');
    const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim()
                   .replace(/^(el|la|los|las|un|una)\s+/,'');
    const sync=()=>{ chk.disabled=inp.value.trim().length===0; };
    inp.oninput=sync; sync(); setTimeout(()=>inp.focus(),80);
    inp.onkeydown=e=>{ if(e.key==='Enter' && !chk.disabled) chk.click(); };
    let assisted=false;
    const optsBtn=$('#opts'), optBox=$('#optbox');
    optsBtn.onclick=()=>{
      assisted=true; optsBtn.classList.add('hide'); optBox.classList.remove('hide');
      optBox.scrollIntoView({behavior:'smooth',block:'nearest'});
      document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{
        inp.value=b.dataset.opt; sync(); chk.click(); });
    };
    chk.onclick=()=>{
      const ok = [g.answer, ...(g.alt||[])].some(a=>norm(inp.value)===norm(a));
      chk.classList.add('hide'); optsBtn.classList.add('hide'); optBox.classList.add('hide');
      rev.classList.remove('hide'); inp.blur();
      $('#verdict').innerHTML = ok
        ? `<span class="ok">✓ ${esc(g.answer)}</span>${assisted?' <span class="sub">con opciones</span>':''}`
        : `<span class="bad">✗ ${esc(inp.value.trim())}</span> → <span class="ok">${esc(g.answer)}</span>`;
      L(view.n).cloze['c'+gbox.dataset.i]={en:inp.value.trim(), ok, assisted, at:today()};
      touchDay();
      $('#nextgap').onclick=()=>go({name:'lesson',n:view.n,step:'cloze'});
      rev.scrollIntoView({behavior:'smooth',block:'nearest'});
    };
  }
  const setr=$('#setr');
  if(setr){
    setr.onclick=()=>{ S.reminder=$('#rtime').value; S.notified=null; save(); scheduleLocal();
      setr.textContent='Guardado ✓'; setTimeout(()=>setr.textContent='Guardar hora',1400); };
    $('#askn').onclick=async()=>{
      if(!hasNotif()){ toast("Este navegador no ofrece notificaciones aquí. Usa el recordatorio de calendario."); return; }
      try{ await Notification.requestPermission(); }catch(e){} render(); };
    $('#testn').onclick=()=>{ if(hasNotif() && Notification.permission==='granted')
        new Notification("Español · 10 minutos",{body:"Así se va a ver.",tag:"diez-test"});
      else toast("Primero permite las notificaciones."); };
    const ics=$('#ics');
    if(ics) ics.onclick=()=>download('espanol_diario.ics', icsFile(), 'text/calendar;charset=utf-8');
    const off=$('#offl');
    if(off) off.innerHTML = ART ? 'Sin conexión: <b>no en esta versión</b>; la copia de GitHub sí funciona sin señal.'
      : ('serviceWorker' in navigator && location.protocol.startsWith('http'))
      ? (navigator.serviceWorker.controller ? 'Sin conexión: <b>listo</b>.' : 'Sin conexión: preparando…')
      : 'Sin conexión: <b>no disponible desde un archivo local</b>, abre la versión publicada.';
    $('#exp').onclick=exportAnswers;
    const rs=$('#reset');
    rs.onclick=()=>armed(rs, '¿Seguro? Toca otra vez para borrar', ()=>{ S=blank(); save(); go({name:'home'}); });

    const st=$('#savetok');
    if(st) st.onclick=async()=>{
      const v=$('#ghtok').value.trim();
      if(!v){ toast("Pega el token primero."); return; }
      SY.token=v; SY.sha=null; SY.err=null; SY.dirty=true; sySave();
      st.textContent='Comprobando…';
      await syNow();
      st.textContent = syPhase==='error' ? 'Falló · reintentar' : 'Guardado ✓';
      setTimeout(()=>render(), 900);
    };
    const sn=$('#synow');
    if(sn) sn.onclick=async()=>{
      if(!backend()){ toast(ART ? "Todavía conectando con Claude…" : "Guarda un token primero."); return; }
      SY.dirty=true; sySave(); await syNow(); syPaint();
    };
    const ft=$('#forgettok');
    if(ft) ft.onclick=()=>armed(ft, '¿Olvidar el token? Toca otra vez', ()=>{ SY=syBlank(); sySave(); render(); });
  }
  syPaint();
}

/* ---------- offline ---------- */
// Only meaningful when served over http(s); from file:// this is a no-op.
if (!ART && "serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js", {scope: "./"}).catch(()=>{});
  });
}

/* ---------- sync lifecycle ---------- */
/* Anything left dirty by a failed or interrupted push goes out on the next
   open, when the app is backgrounded, and whenever the phone regains signal. */
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) syPush(true); });
window.addEventListener("pagehide", ()=>syPush(true));
window.addEventListener("online", ()=>syPush());
setInterval(()=>{ if(SY.dirty && !syBusy) syPush(); }, 60000);

render();
scheduleLocal();
if(SY.dirty) syPush();
</script>
