del pasillo, a la izquierda."}, {"es": "No lo hagas de ese ___; se va a romper.", "answer": "modo", "en": "Don't do it that way; it's going to break.", "cue": "way, manner, mode", "lemma": "el modo", "options": ["aprovechar", "fondo", "pena", "modo"], "es_html": "No lo hagas de ese <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span>; se va a romper."}], "review_cards": [{"word": "el recurso", "en": "resource, recourse, last resort", "rank": 1300, "es": "El único **recurso** que le quedaba era la gasolinera.", "en_sentence": "The only resource he had left was the gas station.", "hook": "Abstract per rule 2. Plural for means/assets, singular for a fallback option. 0014: 'recourse' — correct on first graded review. · los recursos — resources · como último recurso — as a last resort", "kind": "review", "box": 2, "es_html": "El único <b class=\"tw\">recurso</b> que le quedaba era la gasolinera."}, {"word": "la ventaja", "en": "advantage", "rank": 1200, "es": "La única **ventaja** del pueblo es que nadie te molesta.", "en_sentence": "The town's only advantage is that nobody bothers you.", "hook": "Sweep 0012: 'advantage'. Verified known. · llevar ventaja — to have the edge · la desventaja — disadvantage", "kind": "review", "box": 5, "es_html": "La única <b class=\"tw\">ventaja</b> del pueblo es que nadie te molesta."}, {"word": "el propósito", "en": "purpose, intention", "rank": 1400, "es": "Vino con el **propósito** de vender la casa.", "en_sentence": "He came with the purpose of selling the house.", "hook": "Sweep 0012 miss: answered 'proposition'. Cognate shape misfired — proposition is 'la propuesta'. 0014 miss: 'proposition' again. Same error as the sweep, word for word. Needs 'la propuesta' shown next to it. 0016 MISS: 'expectation'. Fourth failure BUT the shape guess is dead — 'proposition' did not appear even with 'la propuesta' in the same sentence. Error moved from form to sense. Next hook: purpose = the why, not the what-is-expected. 0017 HIT: 'purpose', clean, only hover was «con qué». Fifth attempt and the first landing — after 'proposition' ×3 and 'expectation' ×1. La expectativa being named as the other word is what closed it. · a propósito — on purpose; by the way · con el propósito de — with the aim of", "kind": "review", "box": 2, "es_html": "Vino con el <b class=\"tw\">propósito</b> de vender la casa."}, {"word": "la mejora", "en": "improvement", "rank": 1600, "es": "No se vio ninguna **mejora** en dos años.", "en_sentence": "No improvement was seen in two years.", "hook": "Sweep 0012 PARTIAL: answered 'best'. She has the root 'mejor' but not the derived noun. Third instance today of root-held / form-missed, after fracaso-for-fracasó and la-falta-for-señaló. Teach as mejor -> mejorar -> la mejora. 0014: 'improvement' — correct. The derived noun landed after 'best' on the sweep. · mejorar — to improve · mejor — better (the root she had)", "kind": "review", "box": 2, "es_html": "No se vio ninguna <b class=\"tw\">mejora</b> en dos años."}], "passage_html": ["Tomás tiene veintitrés años y arregla teléfonos en el antiguo local del sindicato, que nadie usa desde el cierre. Su único <i class=\"rw\">recurso</i> es una mesa, un soldador y una conexión a internet que se cae dos veces al día.", "—Aquí no <b class=\"tw\">vale</b> la <b class=\"tw\">pena</b> poner un negocio —le dijo su padre. Él lo puso de todos <b class=\"tw\">modos</b>. La <i class=\"rw\">ventaja</i>, dice, es que no tiene competencia. Y el <i class=\"rw\">propósito</i> no es hacerse rico: es no tener que irse.", "<b class=\"tw\">Aprovecha</b> todo: las piezas de los teléfonos viejos, las horas sin clientes para estudiar, el local vacío que el sindicato le deja gratis. —Este pueblo no <b class=\"tw\">merece</b> que lo dejen morir —dice—. Pero tampoco merece que lo salven por lástima.", "Le pregunto si nota alguna <i class=\"rw\">mejora</i>. Se ríe. —En el <b class=\"tw\">fondo</b> del cajón hay teléfonos de gente que ya no vive aquí. Los arreglé y no volvieron a buscarlos. Eso te dice cómo van las cosas."]}, {"n": 10, "title": "Ni siquiera", "passage": ["Es mi última noche. Ramón cierra la estación y nos sentamos fuera, con el termo. Le digo que en la capital hablan del pueblo como de un *fracaso*. Él niega con la cabeza.", "—No es que el pueblo se vacíe, **sino** que se va gastando. **O sea**, no es un golpe: es un desgaste. **Incluso** los que se quedan, como yo, estamos un poco menos cada año.", "Le pregunto por el *riesgo* de quedarse solo. —**Ni siquiera** lo pienso. Delia, **en cambio**, lo piensa por los dos. Me llama todos los domingos, **a pesar de** que no tengo nada nuevo que contarle. Ese es el *vínculo*: llamar aunque no haya noticias.", "Antes de dormir reviso la grabadora. Tengo doce horas de voces. Ramón me pregunta cuál va a ser el *enfoque* de la historia. Le digo que todavía no lo sé. —Mejor —dice—. Los que llegan sabiendo ya el enfoque son los que más daño hacen. El *alcance* de lo que pasó aquí no cabe en una hora de radio."], "glosses": ["negar con la cabeza = to shake one's head", "gastarse = to wear out, to get used up", "el golpe = blow", "el desgaste = wearing down", "el daño = harm"], "translation": ["It's my last night. Ramón closes the station and we sit outside with the thermos. I tell him that in the capital they talk about the town as a failure. He shakes his head.", "\"It's not that the town is emptying, it's that it's wearing away. I mean, it's not a blow: it's a wearing down. Even those of us who stay, like me, are a little less every year.\"", "I ask him about the risk of ending up alone. \"I don't even think about it. Delia, on the other hand, thinks about it for both of us. She calls me every Sunday, even though I have nothing new to tell her. That's the bond: calling even when there's no news.\"", "Before sleeping I check the recorder. I have twelve hours of voices. Ramón asks me what the angle of the story is going to be. I tell him I don't know yet. \"Good,\" he says. \"The ones who arrive already knowing the angle are the ones who do the most harm. The scale of what happened here doesn't fit in an hour of radio.\""], "new_words": [{"word": "incluso", "en": "even; including", "rank": 500, "es": "**Incluso** los que se quedan estamos un poco menos cada año.", "en_sentence": "Even those of us who stay are a little less every year.", "hook": "The 'even' of surprise: incluso los niños lo saben = even the children know it. From incluir, so also 'including'. Aun (no accent) is the same 'even' in a more formal register.", "es_html": "<b class=\"tw\">Incluso</b> los que se quedan estamos un poco menos cada año."}, {"word": "ni siquiera", "en": "not even", "rank": 900, "es": "**Ni siquiera** lo pienso.", "en_sentence": "I don't even think about it.", "hook": "Siquiera alone = at least, in a wish (siquiera una vez). With ni it flips to not even. Ni siquiera me miró = he didn't even look at me. Keep the ni.", "es_html": "<b class=\"tw\">Ni siquiera</b> lo pienso."}, {"word": "sino", "en": "but rather, but (correcting a negative)", "rank": 300, "es": "No es que se vacíe, **sino** que se va gastando.", "en_sentence": "It's not that it's emptying, but that it's wearing away.", "hook": "Sino corrects a negative: no es rojo, sino verde. Pero adds; sino replaces. One word. Si no, two words, means if not. Before a conjugated verb it becomes sino que.", "es_html": "No es que se vacíe, <b class=\"tw\">sino</b> que se va gastando."}, {"word": "en cambio", "en": "on the other hand, whereas, instead", "rank": 1200, "es": "Delia, **en cambio**, lo piensa por los dos.", "en_sentence": "Delia, on the other hand, thinks about it for both of us.", "hook": "Literally 'in exchange'. It contrasts two subjects: yo me quedo; ella, en cambio, se fue. A cambio de = in exchange for, a different phrase.", "es_html": "Delia, <b class=\"tw\">en cambio</b>, lo piensa por los dos."}, {"word": "a pesar de", "en": "despite, in spite of", "rank": 600, "es": "Me llama todos los domingos, **a pesar de** que no tengo nada nuevo.", "en_sentence": "She calls me every Sunday, even though I have nothing new.", "hook": "Pesar = to weigh, and as a noun, sorrow. A pesar de = despite the weight of. Before a clause add que: a pesar de que llueve. A pesar de todo = all the same.", "es_html": "Me llama todos los domingos, <b class=\"tw\">a pesar de</b> que no tengo nada nuevo."}, {"word": "o sea", "en": "that is, I mean, in other words", "rank": 700, "es": "**O sea**, no es un golpe: es un desgaste.", "en_sentence": "I mean, it's not a blow: it's a wearing down.", "hook": "Literally 'or be it', the subjunctive of ser. The everyday rephrasing word, the filler of spoken Spanish. Es decir is the same thing in writing. Two words, never osea.", "es_html": "<b class=\"tw\">O sea</b>, no es un golpe: es un desgaste."}], "review": ["el enfoque", "el vínculo", "el alcance", "el riesgo", "harto", "el fracaso"], "cloze": [{"es": "Vinieron todos, ___ los primos de la capital.", "answer": "incluso", "en": "Everyone came, even the cousins from the capital.", "support": "el primo = cousin", "cue": "even; including", "lemma": "incluso", "options": ["en cambio", "a pesar de", "sino", "incluso"], "es_html": "Vinieron todos, <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> los primos de la capital."}, {"es": "___ me dio las gracias; cogió el paquete y se fue.", "answer": "ni siquiera", "en": "He didn't even thank me; he took the package and left.", "cue": "not even", "lemma": "ni siquiera", "options": ["o sea", "a pesar de", "ni siquiera", "en cambio"], "es_html": "<span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> me dio las gracias; cogió el paquete y se fue."}, {"es": "No quiero café, ___ té.", "answer": "sino", "en": "I don't want coffee, but tea.", "cue": "but rather, but (correcting a negative)", "lemma": "sino", "options": ["o sea", "a pesar de", "sino", "incluso"], "es_html": "No quiero café, <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> té."}, {"es": "Mi hermano cocina muy bien; yo, ___, ni sé freír un huevo.", "answer": "en cambio", "en": "My brother cooks very well; I, on the other hand, can't even fry an egg.", "support": "freír = to fry", "cue": "on the other hand, whereas, instead", "lemma": "en cambio", "options": ["en cambio", "incluso", "ni siquiera", "a pesar de"], "es_html": "Mi hermano cocina muy bien; yo, <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span>, ni sé freír un huevo."}, {"es": "___ la lluvia, el partido se jugó.", "answer": "a pesar de", "en": "Despite the rain, the match was played.", "cue": "despite, in spite of", "lemma": "a pesar de", "options": ["a pesar de", "sino", "en cambio", "incluso"], "es_html": "<span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> la lluvia, el partido se jugó."}, {"es": "Llegó a las nueve, ___, una hora tarde.", "answer": "o sea", "en": "He arrived at nine, that is, an hour late.", "cue": "that is, I mean, in other words", "lemma": "o sea", "options": ["a pesar de", "incluso", "sino", "o sea"], "es_html": "Llegó a las nueve, <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span>, una hora tarde."}], "review_cards": [{"word": "el enfoque", "en": "approach, angle, focus", "rank": 2100, "es": "El hombre habló del **enfoque** nuevo de la empresa.", "en_sentence": "The man talked about the company's new approach.", "hook": "Entered 0017. The angle you take on a problem. Ramón calls it a city word, which is the register it belongs to. · enfocar — to focus · un enfoque distinto — a different approach", "kind": "review", "box": 1, "es_html": "El hombre habló del <b class=\"tw\">enfoque</b> nuevo de la empresa."}, {"word": "el vínculo", "en": "link, tie, bond", "rank": 2000, "es": "Mantiene un **vínculo** con la gente que se fue.", "en_sentence": "He keeps a tie to the people who left.", "hook": "Sweep 0012: left blank, rated unknown. The one honest total blank. 0014 miss: blank, second time. Zero signal on this one. 0016 HIT: 'connection'. FIRST signal ever on this word after two blanks and one 'reminder'. The hyperlink hook took. · vincular — to link · el vinculo familiar — family tie", "kind": "review", "box": 2, "es_html": "Mantiene un <b class=\"tw\">vínculo</b> con la gente que se fue."}, {"word": "el alcance", "en": "reach, scope, extent", "rank": 1500, "es": "El problema es de mayor **alcance** de lo que parece.", "en_sentence": "The problem is of greater scope than it seems.", "hook": "Sweep 0012 miss: answered 'threat'. NOT a shape guess — 'threat' is la amenaza, a tracked word with 4 lapses. This is cross-word interference from inside the deck, a new error class. 0014 miss: blank. The 'threat' interference is gone — amenaza was answered correctly on the same page. 0016 HIT: 'rach' (reach, misspelled). Recognition credited, spelling is production and dormant — same call as 'longro' for lograr. · al alcance de — within reach of · alcanzar — to reach", "kind": "review", "box": 2, "es_html": "El problema es de mayor <b class=\"tw\">alcance</b> de lo que parece."}, {"word": "el riesgo", "en": "risk", "rank": 1500, "es": "No vale la pena correr ese **riesgo**.", "en_sentence": "That risk isn't worth taking.", "hook": "You 'run' a risk in Spanish, not 'take' it. Missed on first exposure in session 1, before the app separated introduction from review. Not a real lapse. · correr un riesgo — to take a risk · a riesgo de — at the risk of", "kind": "review", "box": 4, "es_html": "No vale la pena correr ese <b class=\"tw\">riesgo</b>."}, {"word": "harto", "en": "fed up (estar harto de)", "rank": 1900, "es": "Le pregunto si no está **harto**.", "en_sentence": "I ask him if he isn't fed up.", "hook": "Introducida en la lección 4. Estar harto de = to be sick of. Originally full to bursting, from hartar, to stuff with food. In some countries harto also means a lot: harta gente.", "kind": "review", "box": 0, "es_html": "Le pregunto si no está <b class=\"tw\">harto</b>."}, {"word": "el fracaso", "en": "failure", "rank": 2100, "es": "No es un **fracaso**, es un intento.", "en_sentence": "It's not a failure, it's an attempt.", "hook": "Introducida en la lección 7. The noun of fracasar, which you know and which has cost you slot errors: fracasó is the verb, el fracaso is the thing. The -o ending here is the noun, not a past tense.", "kind": "review", "box": 0, "es_html": "No es un <b class=\"tw\">fracaso</b>, es un intento."}], "passage_html": ["Es mi última noche. Ramón cierra la estación y nos sentamos fuera, con el termo. Le digo que en la capital hablan del pueblo como de un <i class=\"rw\">fracaso</i>. Él niega con la cabeza.", "—No es que el pueblo se vacíe, <b class=\"tw\">sino</b> que se va gastando. <b class=\"tw\">O sea</b>, no es un golpe: es un desgaste. <b class=\"tw\">Incluso</b> los que se quedan, como yo, estamos un poco menos cada año.", "Le pregunto por el <i class=\"rw\">riesgo</i> de quedarse solo. —<b class=\"tw\">Ni siquiera</b> lo pienso. Delia, <b class=\"tw\">en cambio</b>, lo piensa por los dos. Me llama todos los domingos, <b class=\"tw\">a pesar de</b> que no tengo nada nuevo que contarle. Ese es el <i class=\"rw\">vínculo</i>: llamar aunque no haya noticias.", "Antes de dormir reviso la grabadora. Tengo doce horas de voces. Ramón me pregunta cuál va a ser el <i class=\"rw\">enfoque</i> de la historia. Le digo que todavía no lo sé. —Mejor —dice—. Los que llegan sabiendo ya el enfoque son los que más daño hacen. El <i class=\"rw\">alcance</i> de lo que pasó aquí no cabe en una hora de radio."]}], "deck": {"title": "Todas las palabras nuevas", "cards": [{"word": "la entrevista", "en": "interview", "rank": 1400, "es": "Le pido una **entrevista** y él se ríe.", "en_sentence": "I ask him for an interview and he laughs.", "hook": "entre + vista: a seeing-between, two people facing each other. Entrevistar = to interview; el entrevistado = the person interviewed.", "lesson": 1, "kind": "new", "k": "d0", "es_html": "Le pido una <b class=\"tw\">entrevista</b> y él se ríe."}, {"word": "grabar", "en": "to record (audio, video); to engrave", "rank": 1500, "es": "Le pregunto si puedo **grabar**.", "en_sentence": "I ask if I can record.", "hook": "Not 'grab'. It first meant to engrave, cutting a mark into stone; a recording is the same idea on tape. La grabación = the recording.", "lesson": 1, "kind": "new", "k": "d1", "es_html": "Le pregunto si puedo <b class=\"tw\">grabar</b>."}, {"word": "el suceso", "en": "event, incident", "rank": 1800, "es": "El último **suceso** fue el cierre de la mina.", "en_sentence": "The last event was the mine closing.", "hook": "False friend: not success. A suceso is something that happens, often bad; the crime pages of a newspaper are called Sucesos. Success is el éxito.", "lesson": 1, "kind": "new", "k": "d2", "es_html": "El último <b class=\"tw\">suceso</b> fue el cierre de la mina."}, {"word": "el éxito", "en": "success, hit", "rank": 1000, "es": "La mina, mientras duró, fue un **éxito**.", "en_sentence": "The mine, while it lasted, was a success.", "hook": "False friend the other way: not exit. Tener éxito = to succeed; the exit is la salida. Keep éxito and suceso apart: neither means what it looks like.", "lesson": 1, "kind": "new", "k": "d3", "es_html": "La mina, mientras duró, fue un <b class=\"tw\">éxito</b>."}, {"word": "el testigo", "en": "witness", "rank": 2000, "es": "Yo fui **testigo** de cómo se llevaron las máquinas.", "en_sentence": "I witnessed how they took the machines away.", "hook": "Same root as testify and testimony. Ser testigo de = to witness. The form is the same for a woman: la testigo.", "lesson": 1, "kind": "new", "k": "d4", "es_html": "Yo fui <b class=\"tw\">testigo</b> de cómo se llevaron las máquinas."}, {"word": "el relato", "en": "account, story, narrative", "rank": 1800, "es": "Su **relato** no tiene principio ni final.", "en_sentence": "His account has no beginning or end.", "hook": "From relatar, to relate in the old English sense of telling. A relato is an account someone gives; el cuento is a tale that was made up.", "lesson": 1, "kind": "new", "k": "d5", "es_html": "Su <b class=\"tw\">relato</b> no tiene principio ni final."}, {"word": "el puesto", "en": "stall; post, position, job", "rank": 1000, "es": "Marisol tiene un **puesto** de comida junto a la terminal.", "en_sentence": "Marisol has a food stall next to the bus station.", "hook": "From poner: a thing that has been put somewhere. A market stall, a job position (puesto de trabajo), a place in a ranking (primer puesto). Always a spot that is held.", "lesson": 2, "kind": "new", "k": "d6", "es_html": "Marisol tiene un <b class=\"tw\">puesto</b> de comida junto a la terminal."}, {"word": "el empleo", "en": "employment, job; use", "rank": 1000, "es": "Este puesto es mi **empleo** y mi pensión.", "en_sentence": "This stall is my job and my pension.", "hook": "Emplear = to employ, and also to use (emplear el tiempo). El empleo is the fact of having work; el puesto is the particular slot you fill.", "lesson": 2, "kind": "new", "k": "d7", "es_html": "Este puesto es mi <b class=\"tw\">empleo</b> y mi pensión."}, {"word": "el desempleo", "en": "unemployment", "rank": 2100, "es": "Con el **desempleo** que hay, no voy a encontrar otra cosa.", "en_sentence": "With the unemployment there is, I'm not going to find anything else.", "hook": "des + empleo. Latin America says desempleo; Spain says el paro. Un desempleado = an unemployed person.", "lesson": 2, "kind": "new", "k": "d8", "es_html": "Con el <b class=\"tw\">desempleo</b> que hay, no voy a encontrar otra cosa."}, {"word": "el obrero", "en": "worker, labourer", "rank": 1700, "es": "Su marido fue **obrero** en la mina veinte años.", "en_sentence": "Her husband was a labourer in the mine for twenty years.", "hook": "From obra, work in the sense of a built thing. An obrero works with his hands; un trabajador is anyone who works. La clase obrera = the working class.", "lesson": 2, "kind": "new", "k": "d9", "es_html": "Su marido fue <b class=\"tw\">obrero</b> en la mina veinte años."}, {"word": "despedir", "en": "to fire, to dismiss; to see off (despedirse = to say goodbye)", "rank": 1500, "es": "Lo **despidieron** un martes, junto con doscientos más.", "en_sentence": "They fired him on a Tuesday, along with two hundred others.", "hook": "Two meanings, one gesture: sending someone away. Despedir a alguien = to fire them; despedirse de alguien = to say goodbye. Stem changes: despido, despidieron.", "lesson": 2, "kind": "new", "k": "d10", "es_html": "Lo <b class=\"tw\">despidieron</b> un martes, junto con doscientos más."}, {"word": "la jornada", "en": "working day; a day (of an event)", "rank": 1500, "es": "Una **jornada** de doce horas, y vuelve a casa cada quince días.", "en_sentence": "A twelve-hour day, and he comes home every two weeks.", "hook": "Not journal, not quite journey: a day's worth of something. Jornada laboral = working day; media jornada = part-time. Same root as the French journée.", "lesson": 2, "kind": "new", "k": "d11", "es_html": "Una <b class=\"tw\">jornada</b> de doce horas, y vuelve a casa cada quince días."}, {"word": "faltar", "en": "to be missing, to be lacking, to be needed", "rank": 700, "es": "Sobran latas y **falta** leche.", "en_sentence": "There are tins to spare and milk is missing.", "hook": "Backwards from English: the missing thing is the subject. Falta leche = milk is missing; me faltan dos = I'm two short; falta poco = not long now. The noun la falta, lack, is already yours.", "lesson": 3, "kind": "new", "k": "d12", "es_html": "Sobran latas y <b class=\"tw\">falta</b> leche."}, {"word": "sobrar", "en": "to be left over, to be more than enough", "rank": 2000, "es": "**Sobran** latas de sardinas.", "en_sentence": "There are too many tins of sardines.", "hook": "The mirror of faltar. Sobra pan = there's bread to spare; sobra tiempo = plenty of time. Las sobras = leftovers. Sobra decir que… = it goes without saying that…", "lesson": 3, "kind": "new", "k": "d13", "es_html": "<b class=\"tw\">Sobran</b> latas de sardinas."}, {"word": "bastar", "en": "to be enough", "rank": 1600, "es": "Con lo que vendo en un día, **basta** para pagar la luz.", "en_sentence": "What I sell in a day is enough to pay the electricity.", "hook": "¡Basta! = enough! is the same verb. Basta con + infinitive = it's enough to. Bastante, plenty or quite, grows out of it.", "lesson": 3, "kind": "new", "k": "d14", "es_html": "Con lo que vendo en un día, <b class=\"tw\">basta</b> para pagar la luz."}, {"word": "caber", "en": "to fit (inside something)", "rank": 1800, "es": "Las cajas no **caben** en el almacén.", "en_sentence": "The boxes don't fit in the storeroom.", "hook": "Irregular: quepo, cabe, cupo. About fitting into a space, never about clothes fitting a person (that is quedar bien). No cabe duda = there's no room for doubt.", "lesson": 3, "kind": "new", "k": "d15", "es_html": "Las cajas no <b class=\"tw\">caben</b> en el almacén."}, {"word": "el montón", "en": "pile, heap; a lot (un montón de)", "rank": 1500, "es": "Las deja en un **montón** que va creciendo.", "en_sentence": "He leaves them in a pile that keeps growing.", "hook": "From monte, a mountain: a small mountain of stuff. Un montón de gente = loads of people. Very common in speech.", "lesson": 3, "kind": "new", "k": "d16", "es_html": "Las deja en un <b class=\"tw\">montón</b> que va creciendo."}, {"word": "el par", "en": "pair; a couple of (un par de)", "rank": 1100, "es": "Cada semana le llega un **par** de cajas.", "en_sentence": "Every week a couple of boxes arrive.", "hook": "Un par de = a couple of, roughly two, not exactly. Also even numbers: número par vs impar. Sin par = matchless.", "lesson": 3, "kind": "new", "k": "d17", "es_html": "Cada semana le llega un <b class=\"tw\">par</b> de cajas."}, {"word": "soportar", "en": "to put up with, to bear, to stand", "rank": 1500, "es": "No **soporto** la ciudad.", "en_sentence": "I can't stand the city.", "hook": "False friend: not support. It means to bear a weight, so to endure. To support someone is apoyar, which you already have. No soporto a mi jefe = I can't stand my boss.", "lesson": 4, "kind": "new", "k": "d18", "es_html": "No <b class=\"tw\">soporto</b> la ciudad."}, {"word": "aguantar", "en": "to put up with, to hold (out), to withstand", "rank": 1600, "es": "No **aguanto** el ruido ni a la gente.", "en_sentence": "I can't bear the noise or the people.", "hook": "The everyday twin of soportar, a bit more physical: aguantar la respiración = hold your breath; aguanta un poco = hang on a bit. Aguantarse = to put up with it and say nothing.", "lesson": 4, "kind": "new", "k": "d19", "es_html": "No <b class=\"tw\">aguanto</b> el ruido ni a la gente."}, {"word": "rendirse", "en": "to give up, to surrender", "rank": 2000, "es": "Harto sí. Pero **rendirme**, no.", "en_sentence": "Fed up, yes. But giving up, no.", "hook": "Rendir alone = to yield or to perform (el motor rinde poco). With se it turns inward: me rindo = I give up. Stem changes: me rindo, se rindió.", "lesson": 4, "kind": "new", "k": "d20", "es_html": "Harto sí. Pero <b class=\"tw\">rendirme</b>, no."}, {"word": "harto", "en": "fed up (estar harto de)", "rank": 1900, "es": "Le pregunto si no está **harto**.", "en_sentence": "I ask him if he isn't fed up.", "hook": "Estar harto de = to be sick of. Originally full to bursting, from hartar, to stuff with food. In some countries harto also means a lot: harta gente.", "lesson": 4, "kind": "new", "k": "d21", "es_html": "Le pregunto si no está <b class=\"tw\">harto</b>."}, {"word": "el alivio", "en": "relief", "rank": 2300, "es": "Cuando pasa un coche, siento un **alivio** raro.", "en_sentence": "When a car goes by, I feel a strange relief.", "hook": "Aliviar = to lighten, to relieve; alleviate is its English cousin. ¡Qué alivio! = what a relief.", "lesson": 4, "kind": "new", "k": "d22", "es_html": "Cuando pasa un coche, siento un <b class=\"tw\">alivio</b> raro."}, {"word": "la costumbre", "en": "custom, habit", "rank": 1300, "es": "Es una **costumbre** de la época de la mina.", "en_sentence": "It's a habit from the days of the mine.", "hook": "Custom and costume share its Latin root, but costumbre is only the habit. Tener la costumbre de = to be in the habit of; como de costumbre = as usual.", "lesson": 4, "kind": "new", "k": "d23", "es_html": "Es una <b class=\"tw\">costumbre</b> de la época de la mina."}, {"word": "el orden", "en": "order (arrangement, sequence) — la orden = order (command)", "rank": 700, "es": "Es el **orden** de las cosas.", "en_sentence": "It's the order of things.", "hook": "Gender flips the meaning. El orden is arrangement: en orden, por orden alfabético. La orden is a command, or a religious order: dar una orden, cumplir una orden. Both appear in this lesson.", "lesson": 5, "kind": "new", "k": "d24", "es_html": "Es el <b class=\"tw\">orden</b> de las cosas."}, {"word": "la solicitud", "en": "application, request", "rank": 2100, "es": "Lleva la **solicitud** para que arreglen la línea eléctrica.", "en_sentence": "He carries the application to get the power line repaired.", "hook": "Solicitar = to apply for, to request. Any official form you fill in is a solicitud: de empleo, de beca. Solícito, the adjective, means attentive, a different thing.", "lesson": 5, "kind": "new", "k": "d25", "es_html": "Lleva la <b class=\"tw\">solicitud</b> para que arreglen la línea eléctrica."}, {"word": "el requisito", "en": "requirement", "rank": 2300, "es": "Falta un **requisito**: la firma del propietario.", "en_sentence": "A requirement is missing: the owner's signature.", "hook": "Requisite is rare in English; requisito is everyday bureaucracy in Spanish. Cumplir los requisitos = to meet the requirements. Requerir = to require.", "lesson": 5, "kind": "new", "k": "d26", "es_html": "Falta un <b class=\"tw\">requisito</b>: la firma del propietario."}, {"word": "el funcionario", "en": "civil servant, government employee", "rank": 1900, "es": "Un **funcionario** joven revisa los papeles sin levantar la vista.", "en_sentence": "A young civil servant checks the papers without looking up.", "hook": "Not a functionary in the sneering English sense; the neutral word for anyone who works for the state, from a clerk to a judge. La funcionaria for a woman.", "lesson": 5, "kind": "new", "k": "d27", "es_html": "Un <b class=\"tw\">funcionario</b> joven revisa los papeles sin levantar la vista."}, {"word": "la firma", "en": "signature; firm, company", "rank": 1900, "es": "La **firma** del propietario del terreno.", "en_sentence": "The landowner's signature.", "hook": "Firmar = to sign. In business prose la firma is also a company (una firma alemana). Both from firm, made solid: a signature makes a document firm.", "lesson": 5, "kind": "new", "k": "d28", "es_html": "La <b class=\"tw\">firma</b> del propietario del terreno."}, {"word": "cumplir", "en": "to fulfil, to carry out, to meet (a requirement); to turn (an age)", "rank": 700, "es": "Que **cumpla** con el procedimiento, señor.", "en_sentence": "That you comply with the procedure, sir.", "hook": "Cumplir una promesa = to keep a promise; cumplir con = to comply with; cumplir años = to have a birthday; cumplir treinta = to turn thirty. Incumplir = to breach.", "lesson": 5, "kind": "new", "k": "d29", "es_html": "Que <b class=\"tw\">cumpla</b> con el procedimiento, señor."}, {"word": "fingir", "en": "to pretend, to feign", "rank": 2000, "es": "**Finge** que no sabe que las galerías están inundadas.", "en_sentence": "He's pretending he doesn't know the tunnels are flooded.", "hook": "This is the real word for pretend. Pretender, which you have, is to intend or to claim: a false friend. Finge que duerme = he pretends to be asleep. Spelling: finjo, finge.", "lesson": 6, "kind": "new", "k": "d30", "es_html": "<b class=\"tw\">Finge</b> que no sabe que las galerías están inundadas."}, {"word": "engañar", "en": "to deceive, to cheat, to fool", "rank": 1700, "es": "Nadie sabe si quería **engañar** a alguien.", "en_sentence": "Nobody knows whether he wanted to cheat someone.", "hook": "El engaño = the deception. Engañarse = to fool yourself. Las apariencias engañan = appearances deceive. No relation to ganar.", "lesson": 6, "kind": "new", "k": "d31", "es_html": "Nadie sabe si quería <b class=\"tw\">engañar</b> a alguien."}, {"word": "ocultar", "en": "to hide, to conceal (something)", "rank": 1500, "es": "Solo **ocultaba** un negocio que no le salió.", "en_sentence": "He was just hiding a deal that didn't work out.", "hook": "Occult shares the root: hidden. Ocultar is the formal cousin of esconder, and it hides facts and feelings more than objects. Oculto = hidden.", "lesson": 6, "kind": "new", "k": "d32", "es_html": "Solo <b class=\"tw\">ocultaba</b> un negocio que no le salió."}, {"word": "la sospecha", "en": "suspicion", "rank": 2300, "es": "Queda la **sospecha**, que en este pueblo es lo que más dura.", "en_sentence": "The suspicion remains, which in this town is the thing that lasts longest.", "hook": "Sospechar = to suspect; sospechoso = suspicious, or a suspect. Bajo sospecha = under suspicion.", "lesson": 6, "kind": "new", "k": "d33", "es_html": "Queda la <b class=\"tw\">sospecha</b>, que en este pueblo es lo que más dura."}, {"word": "averiguar", "en": "to find out, to check (by looking into it)", "rank": 1800, "es": "Tomás lo **averiguó** en veinte minutos.", "en_sentence": "Tomás found it out in twenty minutes.", "hook": "Averiguar is active: you go and look. Contains verum, truth, as in verify. Voy a averiguarlo = I'll find out. Spelling: averigüé, with the two dots.", "lesson": 6, "kind": "new", "k": "d34", "es_html": "Tomás lo <b class=\"tw\">averiguó</b> en veinte minutos."}, {"word": "enterarse", "en": "to find out, to learn of (the news reaches you)", "rank": 1500, "es": "La gente se **entera** de que la empresa no existe.", "en_sentence": "People find out that the company doesn't exist.", "hook": "The passive twin of averiguar: the news arrives and you become aware. Me enteré ayer = I found out yesterday. ¿Te enteras? = do you get it? Always with de.", "lesson": 6, "kind": "new", "k": "d35", "es_html": "La gente se <b class=\"tw\">entera</b> de que la empresa no existe."}, {"word": "el fracaso", "en": "failure", "rank": 2100, "es": "No es un **fracaso**, es un intento.", "en_sentence": "It's not a failure, it's an attempt.", "hook": "The noun of fracasar, which you know and which has cost you slot errors: fracasó is the verb, el fracaso is the thing. The -o ending here is the noun, not a past tense.", "lesson": 7, "kind": "new", "k": "d36", "es_html": "No es un <b class=\"tw\">fracaso</b>, es un intento."}, {"word": "el logro", "en": "achievement", "rank": 2200, "es": "Que llame. Eso ya es un **logro**.", "en_sentence": "That she calls. That's already an achievement.", "hook": "Noun of lograr, to manage to. Un gran logro = a great achievement. Same slot logic as fracaso: lo logró is the verb, el logro is the result.", "lesson": 7, "kind": "new", "k": "d37", "es_html": "Que llame. Eso ya es un <b class=\"tw\">logro</b>."}, {"word": "el apoyo", "en": "support, backing", "rank": 900, "es": "El **apoyo** también es esto: contestar el domingo.", "en_sentence": "Support is also this: answering on Sunday.", "hook": "Noun of apoyar. Apoyo económico, apoyo moral; con el apoyo de = with the backing of. Not soportar, which is enduring.", "lesson": 7, "kind": "new", "k": "d38", "es_html": "El <b class=\"tw\">apoyo</b> también es esto: contestar el domingo."}, {"word": "la señal", "en": "sign, signal, mark", "rank": 1100, "es": "Vio en el periódico una **señal** de que las cosas mejoran.", "en_sentence": "She saw a sign in the paper that things are improving.", "hook": "Noun of señalar, to point out. A road sign, a phone signal (no hay señal), a sign that something is coming. Also a deposit when you buy something.", "lesson": 7, "kind": "new", "k": "d39", "es_html": "Vio en el periódico una <b class=\"tw\">señal</b> de que las cosas mejoran."}, {"word": "el intento", "en": "attempt, try", "rank": 1600, "es": "El segundo **intento** va mejor.", "en_sentence": "The second attempt is going better.", "hook": "Intentar = to try; el intento = the attempt. Al primer intento = at the first try. Not intent; intention is la intención.", "lesson": 7, "kind": "new", "k": "d40", "es_html": "El segundo <b class=\"tw\">intento</b> va mejor."}, {"word": "la pérdida", "en": "loss", "rank": 1000, "es": "La **pérdida** de un pueblo no sale en los periódicos.", "en_sentence": "The loss of a town doesn't make the papers.", "hook": "From perder. Note the accent on pér-. Pérdida de tiempo = waste of time; pérdidas y ganancias = losses and profits. Perdida without the accent means lost.", "lesson": 7, "kind": "new", "k": "d41", "es_html": "La <b class=\"tw\">pérdida</b> de un pueblo no sale en los periódicos."}, {"word": "la despedida", "en": "farewell, goodbye, send-off", "rank": 2000, "es": "La **despedida** es corta.", "en_sentence": "The farewell is short.", "hook": "Noun of despedirse, from lesson 2. Fiesta de despedida = leaving party; despedida de soltero = stag party. Despedir also fires you; that noun is el despido.", "lesson": 8, "kind": "new", "k": "d42", "es_html": "La <b class=\"tw\">despedida</b> es corta."}, {"word": "mudarse", "en": "to move house", "rank": 2000, "es": "**Mudarse** a la capital cuesta lo que cuesta un coche usado.", "en_sentence": "Moving to the capital costs what a second-hand car costs.", "hook": "Mudar alone = to change, to shed (a snake muda la piel). Mudarse de casa = to move house; la mudanza = the move, and the removals van. Not mover, which moves objects.", "lesson": 8, "kind": "new", "k": "d43", "es_html": "<b class=\"tw\">Mudarse</b> a la capital cuesta lo que cuesta un coche usado."}, {"word": "el regreso", "en": "return, coming back", "rank": 1700, "es": "Es el primer **regreso** que veo en tres semanas.", "en_sentence": "He is the first return I've seen in three weeks.", "hook": "Regresar = to go back, the everyday Latin American word where Spain says volver. Regress went sour in English; el regreso is neutral. De regreso = on the way back.", "lesson": 8, "kind": "new", "k": "d44", "es_html": "Es el primer <b class=\"tw\">regreso</b> que veo en tres semanas."}, {"word": "la vuelta", "en": "return; turn; lap; walk; change (money)", "rank": 800, "es": "Bienvenido de **vuelta**.", "en_sentence": "Welcome back.", "hook": "Noun of volver. Estar de vuelta = to be back; dar una vuelta = to go for a walk; ida y vuelta = round trip; la vuelta al mundo = around the world. One of the busiest nouns in the language.", "lesson": 8, "kind": "new", "k": "d45", "es_html": "Bienvenido de <b class=\"tw\">vuelta</b>."}, {"word": "la estancia", "en": "stay, period spent somewhere; ranch (Argentina)", "rank": 2200, "es": "Fue una **estancia** larga.", "en_sentence": "It was a long stay.", "hook": "From estar: the time you are somewhere. Estancia de tres noches = three-night stay. In Argentina and Uruguay an estancia is a big ranch. Not stance.", "lesson": 8, "kind": "new", "k": "d46", "es_html": "Fue una <b class=\"tw\">estancia</b> larga."}, {"word": "lejano", "en": "distant, far-off, remote", "rank": 1800, "es": "Una ciudad **lejana** cuyo nombre nadie sabe pronunciar.", "en_sentence": "A distant city whose name nobody can pronounce.", "hook": "Adjective of lejos. Alejar, which you know, pushes something away; lejano describes what is already far. Un pariente lejano = a distant relative; el Lejano Oeste = the Far West.", "lesson": 8, "kind": "new", "k": "d47", "es_html": "Una ciudad <b class=\"tw\">lejana</b> cuyo nombre nadie sabe pronunciar."}, {"word": "aprovechar", "en": "to make the most of, to take advantage of, to use well", "rank": 900, "es": "**Aprovecha** todo: las piezas viejas, las horas sin clientes.", "en_sentence": "He makes the most of everything: the old parts, the hours without customers.", "hook": "From provecho, benefit (¡buen provecho! = enjoy your meal). Aprovechar el tiempo = use your time well. Aprovecharse de alguien, with se, is the bad sense: to take advantage of someone.", "lesson": 9, "kind": "new", "k": "d48", "es_html": "<b class=\"tw\">Aprovecha</b> todo: las piezas viejas, las horas sin clientes."}, {"word": "valer", "en": "to be worth, to cost; to be valid", "rank": 900, "es": "Aquí no **vale** la pena poner un negocio.", "en_sentence": "It's not worth setting up a business here.", "hook": "Irregular: valgo, vale, valió. ¿Cuánto vale? = how much is it? Vale la pena = it's worth it. In Spain vale = OK. No vale = that doesn't count.", "lesson": 9, "kind": "new", "k": "d49", "es_html": "Aquí no <b class=\"tw\">vale</b> la pena poner un negocio."}, {"word": "merecer", "en": "to deserve", "rank": 1500, "es": "Este pueblo no **merece** que lo dejen morir.", "en_sentence": "This town doesn't deserve to be left to die.", "hook": "Merit is the cousin. Merecer la pena is Spain's version of valer la pena. Se lo merece = he deserves it. Spelling: merezco, merece.", "lesson": 9, "kind": "new", "k": "d50", "es_html": "Este pueblo no <b class=\"tw\">merece</b> que lo dejen morir."}, {"word": "la pena", "en": "pity, sorrow; trouble, effort; penalty", "rank": 1200, "es": "No vale la **pena**.", "en_sentence": "It's not worth the trouble.", "hook": "Three faces: qué pena = what a shame; vale la pena = it's worth the trouble; pena de muerte = death penalty. In much of Latin America me da pena = I'm embarrassed, not sad.", "lesson": 9, "kind": "new", "k": "d51", "es_html": "No vale la <b class=\"tw\">pena</b>."}, {"word": "el fondo", "en": "bottom, back, far end; background; fund", "rank": 700, "es": "En el **fondo** del cajón hay teléfonos de gente que ya no vive aquí.", "en_sentence": "At the bottom of the drawer there are phones belonging to people who don't live here any more.", "hook": "The far end of anything: el fondo del mar, al fondo del pasillo (at the end of the corridor). En el fondo = deep down. Los fondos = funds, money.", "lesson": 9, "kind": "new", "k": "d52", "es_html": "En el <b class=\"tw\">fondo</b> del cajón hay teléfonos de gente que ya no vive aquí."}, {"word": "el modo", "en": "way, manner, mode", "rank": 700, "es": "Él lo puso de todos **modos**.", "en_sentence": "He set it up anyway.", "hook": "De todos modos = anyway; de ningún modo = no way; de modo que = so that. Grammar's modo indicativo is the same word. Interchangeable with manera in most uses.", "lesson": 9, "kind": "new", "k": "d53", "es_html": "Él lo puso de todos <b class=\"tw\">modos</b>."}, {"word": "incluso", "en": "even; including", "rank": 500, "es": "**Incluso** los que se quedan estamos un poco menos cada año.", "en_sentence": "Even those of us who stay are a little less every year.", "hook": "The 'even' of surprise: incluso los niños lo saben = even the children know it. From incluir, so also 'including'. Aun (no accent) is the same 'even' in a more formal register.", "lesson": 10, "kind": "new", "k": "d54", "es_html": "<b class=\"tw\">Incluso</b> los que se quedan estamos un poco menos cada año."}, {"word": "ni siquiera", "en": "not even", "rank": 900, "es": "**Ni siquiera** lo pienso.", "en_sentence": "I don't even think about it.", "hook": "Siquiera alone = at least, in a wish (siquiera una vez). With ni it flips to not even. Ni siquiera me miró = he didn't even look at me. Keep the ni.", "lesson": 10, "kind": "new", "k": "d55", "es_html": "<b class=\"tw\">Ni siquiera</b> lo pienso."}, {"word": "sino", "en": "but rather, but (correcting a negative)", "rank": 300, "es": "No es que se vacíe, **sino** que se va gastando.", "en_sentence": "It's not that it's emptying, but that it's wearing away.", "hook": "Sino corrects a negative: no es rojo, sino verde. Pero adds; sino replaces. One word. Si no, two words, means if not. Before a conjugated verb it becomes sino que.", "lesson": 10, "kind": "new", "k": "d56", "es_html": "No es que se vacíe, <b class /* ---------- where am I running? ----------
   Inside the claude.ai Artifact viewer, window.claude.use exists and the
   page can reach the artifact's shared db, which Claude reads back with
   ArtifactData. The namespaces arrive asynchronously; the page renders
   without them and lights sync up when they resolve. */
const ART = !!(window.claude && typeof window.claude.use === 'function');
let DBN = null, DLS = null;
if(ART){
  window.claude.use('db').then(d=>{ DBN=d; syPaint(); if(DBN && SY.dirty) syPush(); }).catch(()=>{});
  window.claude.use('downloads').then(d=>{ DLS=d; }).catch(()=>{});
}
let DEV;   // one id per browser, so two devices never overwrite each other's doc
try{ DEV = localStorage.getItem('diez.dev');
     if(!DEV){ DEV = 'd-'+Math.random().toString(36).slice(2,10); localStorage.setItem('diez.dev', DEV); } }
catch(e){ DEV = 'd-anon'; }

/* ---------- state ---------- */

const blank = () => ({lessons:{}, days:[], reminder:null, notified:null, deck:deckBlank(), legacy_v1:null});
let S;
try { S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY)||"{}")); }
catch(e){ S = blank(); }
if(!S.deck) S.deck = deckBlank();
/* Whatever the first series left on this device rides along once, so the
   answers she typed into the old lessons are not lost to the rebuild. */
try{ if(S.legacy_v1==null && localStorage.getItem('diez.v1')){
       S.legacy_v1 = JSON.parse(localStorage.getItem('diez.v1')); } }catch(e){}

  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}

}

/* ---------- small UI helpers ----------
   The artifact viewer never shows alert()/confirm(), so the page carries
   its own toast and a two-tap confirmation. */
function toast(msg){
  let t=$('#toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'), 2200);
}
function armed(btn, label, fn){
  if(btn.dataset.armed){ delete btn.dataset.armed; fn(); return; }
  const orig=btn.textContent; btn.dataset.armed='1'; btn.textContent=label;
  setTimeout(()=>{ if(btn.dataset.armed){ delete btn.dataset.armed; btn.textContent=orig; } }, 4000);
}

/* ---------- sync ----------
   Every save marks the state dirty and a debounced push writes the whole
   snapshot somewhere Claude can read: the artifact db when running as an
   Artifact, else a file in the private repo through the GitHub contents API.
   localStorage stays the on-device source of truth, so a failed push loses
   nothing — the dirty flag is persisted and retried on the next open. */
const SKEY = "diez.sync";
const syBlank = () => ({token:"", repo:"olga-pyatokha/spanish-learning", branch:"main",
                        path:"state/phone/diez.json", sha:null, at:null, err:null, dirty:false});
let SY;
try { SY = Object.assign(syBlank(), JSON.parse(localStorage.getItem(SKEY)||"{}")); }
catch(e){ SY = syBlank(); }
function sySave(){ try{ localStorage.setItem(SKEY, JSON.stringify(SY)); }catch(e){} }

let syPhase = "idle";          // idle | pending | sending | ok | error
let syTimer = null, syBusy = false;

const backend = () => DBN ? 'db' : (SY.token ? 'gh' : null);
function syChip(){
  if(!backend())           return ART ? {t:"conectando…", c:"amber"} : {t:"sin conectar", c:""};
  if(syPhase==="sending")  return {t:"enviando…", c:"amber"};
  if(syPhase==="error")    return {t:SY.err || "error", c:"red"};
  if(SY.dirty)             return {t:"pendiente", c:"amber"};
  if(SY.at) return {t:"guardado " + new Date(SY.at).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}),
                    c:"green"};
  return {t: DBN ? "conectado a Claude" : "conectado", c:""};
}
function syPaint(){
  const c = syChip();
  document.querySelectorAll('[data-sy]').forEach(el=>{ el.textContent=c.t; el.className='sychip '+c.c; });
}
function markDirty(){
  if(!SY.dirty){ SY.dirty = true; sySave(); }
  if(!backend()){ syPaint(); return; }
  if(syPhase!=="sending") syPhase="pending";
  syPaint();
  if(syTimer) clearTimeout(syTimer);
  syTimer = setTimeout(()=>syPush(), 2500);
}
function syNow(){ if(syTimer) clearTimeout(syTimer); return syPush(); }

/* btoa over UTF-8, chunked — a spread of 60k args overflows the stack. */
function b64(s){
  const by = new TextEncoder().encode(s);
  let bin = "", CH = 0x8000;
  for(let i=0;i<by.length;i+=CH) bin += String.fromCharCode.apply(null, by.subarray(i,i+CH));
  return btoa(bin);
}
function syHead(){
  return {"Authorization":"Bearer "+SY.token, "Accept":"application/vnd.github+json",
          "X-GitHub-Api-Version":"2022-11-28"};
}
const syURL = () => `https://api.github.com/repos/${SY.repo}/contents/${SY.path}`;

async function syRemoteSha(){
  const r = await fetch(`${syURL()}?ref=${encodeURIComponent(SY.branch)}`, {headers:syHead()});
  if(r.status===404) return null;
  if(!r.ok) throw new Error("read "+r.status);
  return (await r.json()).sha;
}
function syBody(text, sha){
  const b = {message:`diez: progreso ${today()}`, content:b64(text), branch:SY.branch};
  if(sha) b.sha = sha;
  return b;
}
async function syPut(body, keepalive){
  return fetch(syURL(), {method:"PUT", keepalive:!!keepalive,
    headers:Object.assign({"Content-Type":"application/json"}, syHead()),
    body:JSON.stringify(body)});
}
async function syPush(keepalive){
  const be = backend();
  if(!be || syBusy || !SY.dirty) return;
  syBusy = true; syPhase = "sending"; syPaint();
  const snap = snapshot();
  if(be === 'db'){
    /* one document per device, replaced whole; one write in flight at a time */
    try{
      await DBN.doc('progress/' + DEV).set(snap);
      SY.at = new Date().toISOString(); SY.err = null; SY.dirty = false; syPhase = "ok";
    }catch(e){
      const code = e && e.code;
      SY.err = code==='quota_exceeded' ? "sin espacio"
             : code==='revoked' ? "acceso revocado"
             : code==='invalid_argument' ? "sin permiso de escritura"
             : "sin conexión";
      syPhase = "error";
    }
    sySave(); syBusy = false; syPaint();
    return;
  }
  const text = JSON.stringify(snap, null, 2);
  try{
    let r = await syPut(syBody(text, SY.sha), keepalive);
    /* a stale cached sha, or a file that appeared since — re-read and retry once */
    if(r.status===409 || r.status===422){
      r = await syPut(syBody(text, await syRemoteSha()), keepalive);
    }
    if(r.ok){
      const j = await r.json();
      SY.sha = j.content && j.content.sha;
      SY.at = new Date().toISOString();
      SY.err = null; SY.dirty = false; syPhase = "ok";
    } else {
      let d=""; try{ d = (await r.json()).message || ""; }catch(e){}
      SY.err = r.status===401 ? "token inválido"
             : r.status===403 ? "token sin permiso"
             : r.status===404 ? "repo o rama no encontrada"
             : `${r.status} ${d}`.slice(0,60);
      syPhase = "error";
    }
  }catch(e){
    SY.err = "sin conexión"; syPhase = "error";   /* stays dirty, retried later */
  }
  sySave(); syBusy = false; syPaint();
}
function L(n){ return S.lessons[n] || (S.lessons[n] = {words:false, read:false, cards:{}, cloze:{}, doneAt:null}); }
function touchDay(){ const d=today(); if(!S.days.includes(d)){ S.days.push(d); S.days=S.days.slice(-120); } save(); }

function cardsOf(l){
  return l.new_words.map((c,j)=>({...c,kind:'new',k:'n'+j}))
    .concat(l.review_cards.map((c,j)=>({...c,k:'r'+j})));
}
function lessonDone(n){
  const st=L(n), l=PKG.lessons[n-1];
  return st.words && st.read && Object.keys(st.cards).length>=cardsOf(l).length
      && Object.keys(st.cloze).length>=l.cloze.length;
}
function lessonStarted(n){
  const st=L(n);
  return st.words || st.read || Object.keys(st.cards).length || Object.keys(st.cloze).length;
}
function streak(){
  let n=0, d=new Date();
  for(;;){ const k=d.toLocaleDateString('en-CA');
    if(S.days.includes(k)){ n++; d.setDate(d.getDate()-1); }
    else if(n===0 && k===today()){ d.setDate(d.getDate()-1); }
    else break;
    if(n>200) break; }
  return n;
}
function wordsSeen(){
  let n=0;
  PKG.lessons.forEach((l,i)=>{ const st=L(i+1);
    l.new_words.forEach((c,j)=>{ if(st.cards['n'+j]) n++; }); });
  return n;
}

/* ---------- deck: every new word, one pass at a time ---------- */
function deckOrder(){
  const src=PKG.deck.cards, n=src.length, idx=[...Array(n).keys()];
  let s = (S.deck.seed>>>0) || 1;                 // xorshift32, seeded per pass
  const rnd=()=>{ s ^= s<<13; s ^= s>>>17; s ^= s<<5; s = s>>>0; return s/4294967296; };
  for(let i=n-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  return idx.map(i=>src[i]);
}
function deckCard(k){ return PKG.deck.cards.find(c=>c.k===k); }
function deckArchive(){
  const st=S.deck, cs=PKG.deck.cards;
  const rows=cs.map(c=>{const a=st.cards[c.k]||{}; return {word:c.word, lesson:c.lesson, en:a.en||null, rating:a.rating||null, at:a.at||null};})
                .filter(r=>r.en);
  st.history.push({pass:st.pass, seed:st.seed, finished:today(), cards:rows});
  st.history = st.history.slice(-10);
  st.pass += 1; st.seed = Math.floor(Math.random()*1e9)+1; st.cards = {};
  save();
}
function deckHTML(){
  const cs=deckOrder(), st=S.deck, done=Object.keys(st.cards).length;
  const head=`<header><h1>${esc(PKG.deck.title)}</h1><button data-nav="home" class="sub">cerrar ✕</button></header>
  <p class="sub">Las ${cs.length} palabras nuevas de las diez lecciones, en un orden distinto cada vuelta.
  Lee la palabra, dale la vuelta, marca si la sabías. Vuelta ${st.pass} · ${done}/${cs.length}</p>`;
  let i = cs.findIndex(c=>!st.cards[c.k]);
  if(view.forceCard!=null) i=view.forceCard;
  if(i<0){
    const marks=cs.map(c=>st.cards[c.k]||{}), si=marks.filter(a=>a.rating==='si').length;
    return head+`<div class="card"><h2>Vuelta ${st.pass} completa</h2>
      <p class="note"><b>${si}/${cs.length}</b> marcadas como sabidas. Las que no, abajo con un punto: tócalas para repetirlas.</p>
      <button class="btn" id="deckagain">Otra vuelta · nuevo orden</button>
      <button class="btn ghost" data-nav="home">Volver al índice</button></div>
      ${cs.map((c,j)=>{const a=st.cards[c.k]||{};
        return `<button class="lesson" data-recard="${j}"><span class="num">${a.rating==='si'?'✓':'·'}</span>
        <span class="t"><b>${esc(c.word)}</b><span>${markText(a)} · lección ${c.lesson}</span></span><span class="chev">›</span></button>`;}).join('')}`;
  }
  return head+cardMarkup(cs[i], i, cs.length, st.cards[cs[i].k]||{}, `lección ${cs[i].lesson}`);
}
function markText(a){ return a.rating==='si'?'la sabía':a.rating==='no'?'no la sabía':(a.en||'—'); }

    <h2>Y vuelven</h2>
    ${l.review_cards.map(c=>`<div class="rline">
      <b class="rw">${esc(c.word)}</b><span>${esc(c.en)}</span></div>`).join('')}
  </div>`:''}`;
}
function readHTML(l){
  // Translation sits under its own paragraph, collapsed. Close enough to check
  // yourself while it is fresh, hidden enough that the reading still happens.
  return `<div class="gloss" style="margin-bottom:12px"><b>Apoyo, no se registra:</b> ${l.glosses.map(esc).join(' · ')}</div>
  ${l.passage_html.map((par,i)=>`<div class="card passage">
    <p>${par}</p>
    <details class="tr-one"><summary>Traducción</summary>
      <p class="sub" style="font-size:15px;margin:8px 0 0">${esc(l.translation[i]||'')}</p></details>
  </div>`).join('')}
  <details><summary>Recordar las palabras</summary>
    ${l.new_words.map(w=>`<p class="sub" style="font-size:15px"><b class="tw">${esc(w.word)}</b> — ${esc(w.en)}</p>`).join('')}</details>`;
}
function cardHTML(l,cs){
  const st=L(view.n);
  let i = cs.findIndex((c,j)=>!st.cards[c.k]);
  if(view.forceCard!=null) i=view.forceCard;
  if(i<0){
    return `<div class="card"><h2>Tarjetas completas</h2>
      <p class="note">${cs.length} de ${cs.length}. Pasa a los huecos, o repite cualquiera desde la lista.</p>
      <button class="btn" data-step="cloze">Ir a los huecos</button>
      <button class="btn ghost" data-recard="0">Repetir desde el principio</button></div>
      ${cs.map((c,j)=>{const a=st.cards[c.k]||{};
        return `<button class="lesson" data-recard="${j}"><span class="num">${a.rating==='si'?'✓':'·'}</span>
        <span class="t"><b>${esc(c.word)}</b><span>${markText(a)}</span></span><span class="chev">›</span></button>`;}).join('')}`;
  }
  const c=cs[i];
  return cardMarkup(c, i, cs.length, st.cards[c.k]||{});
}
/* One flashcard, shared by the lesson step and the deck. Front: the word and
   its sentence. Tap to flip; the back carries meaning, translation and hook,
   then a self-mark. Nothing is typed — the mark is her own read, not a grade. */
function cardMarkup(c, i, total, prev, label){
  return `<div class="prog"><i style="width:${Math.round(i/total*100)}%"></i></div>
  <div class="card" id="cardbox" data-k="${c.k}" data-i="${i}">
    <span class="tag ${c.kind==='new'?'new':'rev'}">${label||(c.kind==='new'?'nueva':'repaso')} · ${i+1}/${total}</span>
    <p class="qes" style="font-size:28px;margin-bottom:6px"><b class="tw">${esc(c.word)}</b></p>
    <p class="sub" style="font-size:15.5px;margin:0 0 14px">${c.es_html}</p>
    <button class="btn" id="show">Dar la vuelta</button>
    <div id="rev" class="reveal hide">
      <div class="mean">${esc(c.word)} — ${esc(c.en)}</div>
      <div class="tr">${esc(c.en_sentence)}</div>
      <div class="hook">${esc(c.hook)}</div>
      <div class="mark">
        <button class="si" data-rate="si">La sabía</button>
        <button class="no" data-rate="no">No la sabía</button>
      </div>
    </div>
  </div>`;
}
function clozeHTML(l){
  const st=L(view.n);
  let i=l.cloze.findIndex((g,j)=>!st.cloze['c'+j]);
  if(view.forceGap!=null) i=view.forceGap;
  if(i<0){
    const marks=l.cloze.map((g,j)=>st.cloze['c'+j]||{});
    const right=marks.filter(a=>a.ok && !a.assisted).length;
    const helped=marks.filter(a=>a.ok && a.assisted).length;
    const done=lessonDone(view.n);
    if(done && L(view.n).doneAt!==today()){ L(view.n).doneAt=today(); touchDay(); }
    return `<div class="card"><h2>Huecos completos</h2>
      <p class="note"><b>${right}/${l.cloze.length}</b> sin ayuda${helped?`, ${helped} con opciones`:''}.</p>
      ${done?`<p class="note">Lección ${view.n} cerrada. ${view.n<PKG.lessons.length?'La siguiente te espera.':'Paquete terminado: queda el repaso de todas las palabras.'}</p>`:''}
      ${view.n<PKG.lessons.length?`<button class="btn" data-go="${view.n+1}">Lección ${view.n+1}</button>`
                                 :`<button class="btn" data-nav="deck">Repasar todas las palabras</button>`}
      <button class="btn ghost" data-nav="home">Volver al índice</button></div>
      ${l.cloze.map((g,j)=>{const a=st.cloze['c'+j]||{};
        return `<div class="card"><p class="qes" style="font-size:16px">${g.es_html.replace('<span class="gap">&nbsp;&nbsp;&nbsp;&nbsp;</span>','<b class="tw">'+esc(g.answer)+'</b>')}</p>
        <p class="sub">${esc(g.en)}</p>
        <p class="sub">Tu respuesta: <b class="${a.ok?'ok':'bad'}">${esc(a.en||'—')}</b></p></div>`;}).join('')}`;
  }
  const g=l.cloze[i];
  return `<div class="prog"><i style="width:${Math.round(i/l.cloze.length*100)}%"></i></div>
  <div class="card" id="gapbox" data-i="${i}">
    <span class="tag">hueco ${i+1}/${l.cloze.length}</span>
    <p class="qes">${g.es_html}</p>
    ${g.support?`<p class="sub">${esc(g.support)}</p>`:''}
    <div class="cue"><span>en inglés</span>${esc(g.cue)}</div>
    <input type="text" id="gap" placeholder="La palabra que falta…" autocomplete="off"
      autocorrect="off" autocapitalize="none" spellcheck="false">
    <button class="btn" id="check" disabled>Comprobar</button>
    <button class="btn ghost" id="opts">No me sale · ver opciones</button>
    <div id="optbox" class="opts hide">
      ${g.options.map(o=>`<button class="opt" data-opt="${esc(o)}">${esc(o)}</button>`).join('')}
    </div>
    <div id="grev" class="reveal hide">
      <div class="mean" id="verdict"></div>
      <div class="tr">${esc(g.en)}</div>
      <button class="btn ghost" id="nextgap">Siguiente</button>
    </div>
  </div>`;
}
function lessonBar(){
  const st=L(view.n), step=view.step||'words';
  if(step==='words') return `<button data-nav="home">Índice</button>
    <button class="primary" data-wordsdone="1">${st.words?'Seguir al texto':'Ya las vi · al texto'}</button>`;
  if(step==='read') return `<button data-step="words">Palabras</button>
    <button class="primary" data-readdone="1">${st.read?'Seguir con las tarjetas':'Leído · a las tarjetas'}</button>`;
  return `<button data-nav="home">Índice</button><button data-step="read">Volver al texto</button>`;
}
function backBar(){ return `<button class="primary" data-nav="home">Volver</button>`; }

/* ---------- reminders ---------- */
function remindHTML(){
  const perm = hasNotif() ? Notification.permission : 'unsupported';
  const state = {granted:'concedido', denied:'bloqueado', default:'sin pedir', unsupported:'no disponible'}[perm];
  return `<header><h1>Recordatorio</h1><button data-nav="home" class="sub">cerrar ✕</button></header>
  <div class="card">
    <h2>Hora</h2>
    <p class="note">A qué hora quieres el aviso.</p>
    <input type="time" id="rtime" value="${S.reminder||'08:00'}">
    <button class="btn" id="setr">Guardar hora</button>
  </div>
  <div class="card">
    <h2>Aviso en la app</h2>
    <p class="note">Permiso: <b>${state}</b>. Esto funciona <b>mientras la app está abierta o en segundo plano</b>.
    Si la cierras del todo, el sistema la congela y no salta nada.</p>
    <button class="btn ghost" id="askn">Permitir notificaciones</button>
    <button class="btn ghost" id="testn">Probar ahora</button>
  </div>
  <div class="card">
    <h2>Aviso de calendario</h2>
    <p class="note">Este es el que <b>sí suena con la app cerrada</b>. Baja el archivo, ábrelo y el móvil crea
    un evento diario de ${PKG.minutes_each} minutos con alarma a la hora que guardaste. Sin servidor, sin cuenta, sin caducidad.</p>
    ${ART ? `<p class="note">Esta versión no puede entregar archivos de calendario. Bájalo desde la copia de GitHub:
      <a href="https://olga-pyatokha.github.io/diez/" style="color:var(--blue)">olga-pyatokha.github.io/diez</a> → Recordatorio.</p>`
          : `<button class="btn" id="ics">Bajar recordatorio diario (.ics)</button>`}
  </div>
  <div class="card">
    <h2>Instalar en el móvil</h2>
    <p class="note"><b>iPhone:</b> Compartir → Añadir a pantalla de inicio.<br>
    <b>Android:</b> menú ⋮ → Instalar aplicación.<br>
    Queda como icono propio, a pantalla completa, y <b>funciona sin señal</b>: las diez
    lecciones se guardan en el móvil la primera vez que abres la página.</p>
    <p class="note" id="offl"></p>
  </div>
  ${ART ? `<div class="card">
    <h2>Sincronizar</h2>
    <p class="note">Cada respuesta se guarda sola en la base de datos de esta página, donde Claude la lee
    para corregirla y mover las cajas. Nada que pegar ni renovar. Estado: <span class="sychip" data-sy></span></p>
    <button class="btn ghost" id="synow">Sincronizar ahora</button>
    <p class="note" style="margin-top:9px">Este móvil se identifica como <b>${esc(DEV)}</b>. Si abres la página
    en otro aparato, ese guarda su propio progreso y Claude junta los dos.</p>
  </div>` : `<div class="card">
    <h2>Sincronizar</h2>
    <p class="note">Cada vez que terminas una parte, el progreso se guarda solo en
    <b>${esc(SY.repo)}</b> → <b>${esc(SY.path)}</b>. Estado: <span class="sychip" data-sy></span></p>
    <input type="password" id="ghtok" autocomplete="off" autocapitalize="off" spellcheck="false"
      placeholder="${SY.token?'Token guardado · escribe otro para cambiarlo':'Token de GitHub (github_pat_…)'}">
    <button class="btn" id="savetok">Guardar token</button>
    <button class="btn ghost" id="synow">Sincronizar ahora</button>
    ${SY.token?`<button class="btn ghost" id="forgettok" style="color:var(--red)">Olvidar token</button>`:''}
    <p class="note" style="margin-top:9px">El token es de alcance único: solo ese repositorio, solo
    <b>Contents: read and write</b>. Se queda en este móvil y nunca sale de aquí salvo hacia GitHub.</p>
  </div>`}
  <div class="card">
    <h2>Tus respuestas</h2>
    <p class="note">La sincronización ya manda esto sola. Este botón es el respaldo por si falla.</p>
    <button class="btn ghost" id="exp">Exportar respuestas (.json)</button>
    <button class="btn ghost" id="reset" style="color:var(--red)">Borrar todo el progreso</button>
  </div>`;
}
function icsFile(){
  const t=(S.reminder||'08:00').split(':');
  const d=new Date(); d.setHours(+t[0],+t[1],0,0);
  const p=n=>String(n).padStart(2,'0');
  const fmt=x=>`${x.getFullYear()}${p(x.getMonth()+1)}${p(x.getDate())}T${p(x.getHours())}${p(x.getMinutes())}00`;
  const end=new Date(d.getTime()+PKG.minutes_each*60000);
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//diez//spanish//ES","CALSCALE:GREGORIAN",
    "BEGIN:VEVENT","UID:diez-spanish-daily@local","DTSTAMP:"+fmt(new Date()),
    "DTSTART:"+fmt(d),"DTEND:"+fmt(end),"RRULE:FREQ=DAILY",
    "SUMMARY:Español · 10 minutos","DESCRIPTION:Una lección del paquete de diez.",
    "BEGIN:VALARM","TRIGGER:PT0M","ACTION:DISPLAY","DESCRIPTION:Español · 10 minutos","END:VALARM",
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
}
async function download(name, text, type){
  if(DLS){   /* the artifact viewer blocks page-started downloads; ask through the runtime */
    try{ await DLS.save({filename:name, data:text}); toast('Guardado'); }
    catch(e){ if(!(e && e.code==='declined')) toast('No se pudo guardar desde aquí'); }
    return;
  }
  const b=new Blob([text],{type:type||'text/plain;charset=utf-8'});
  const u=URL.createObjectURL(b), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},1500);
}
function exportPayload(){
  const out={package:PKG.package, exported:new Date().toISOString(), lessons:[]};
  PKG.lessons.forEach((l,i)=>{
    const st=L(i+1), cs=cardsOf(l);
    out.lessons.push({n:i+1, title:l.title, done:lessonDone(i+1), doneAt:st.doneAt||null,
      words:!!st.words, read:!!st.read,
      cards: cs.map((c,j)=>{const a=st.cards[c.k]||{};
        return {word:c.word, kind:c.kind, en:a.en||null, rating:a.rating||null, at:a.at||null};}),
      cloze: l.cloze.map((g,j)=>{const a=st.cloze['c'+j]||{};
        return {answer:g.answer, lemma:g.lemma, wrote:a.en||null, ok:a.ok??null,
                assisted:a.assisted??null, at:a.at||null};})});
  });
  const dk=S.deck, dcs=PKG.deck.cards;
  out.deck={pass:dk.pass, seed:dk.seed,
    cards: dcs.map(c=>{const a=dk.cards[c.k]||{}; return {word:c.word, lesson:c.lesson, en:a.en||null, rating:a.rating||null, at:a.at||null};}),
    history: dk.history};
  return out;
}
function exportAnswers(){
  download(`diez_respuestas_${today()}.json`, JSON.stringify(exportPayload(),null,2), 'application/json');
}
/* What the phone pushes: the graded answers plus the raw state, so a restore
   is possible from the same file the importer reads. */
function snapshot(){
  return {package:PKG.package, built:PKG.built, device:DEV, via:backend()||"none",
          pushed:new Date().toISOString(),
          days:S.days, streak:streak(), words_seen:wordsSeen(),
          answers:exportPayload(), state:S, legacy_v1:S.legacy_v1||null};
}
let timer=null;
function scheduleLocal(){
  if(timer) clearInterval(timer);
  timer=setInterval(()=>{
    if(!S.reminder || !hasNotif() || Notification.permission!=='granted') return;
    const now=new Date(), k=today();
    if(S.notified===k) return;
    const [h,m]=S.reminder.split(':').map(Number);
    if(now.getHours()>h || (now.getHours()===h && now.getMinutes()>=m)){
      if(S.days.includes(k)) return;
      S.notified=k; save();
      const n=PKG.lessons.findIndex((l,i)=>!lessonDone(i+1));
      try{ new Notification("Español · 10 minutos", {
        body: n<0?"Repaso libre.":`Lección ${n+1}: ${PKG.lessons[n].title}`,
        tag:"diez-daily"}); }catch(e){}
    }
  }, 30000);
}

/* ---------- events ---------- */
function wire(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go({name:'lesson',n:+b.dataset.go,step:'words'}));
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go({name:b.dataset.nav}));
  document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>go({name:'lesson',n:view.n,step:b.dataset.step}));
  document.querySelectorAll('[data-recard]').forEach(b=>b.onclick=()=> view.name==='deck'
    ? go({name:'deck',forceCard:+b.dataset.recard})
    : go({name:'lesson',n:view.n,step:'cards',forceCard:+b.dataset.recard}));
  const da=$('#deckagain');
  if(da) da.onclick=()=>armed(da, 'Toca otra vez para empezar una vuelta nueva', ()=>{ deckArchive(); syNow(); go({name:'deck'}); });
  const wd=$('[data-wordsdone]');
  if(wd) wd.onclick=()=>{ L(view.n).words=true; touchDay(); syNow(); go({name:'lesson',n:view.n,step:'read'}); };
  const rd=$('[data-readdone]');
  if(rd) rd.onclick=()=>{ L(view.n).read=true; touchDay(); syNow(); go({name:'lesson',n:view.n,step:'cards'}); };

  const box=$('#cardbox');
  if(box){
    const show=$('#show'), rev=$('#rev');
    const flip=()=>{ if(!show.classList.contains('hide')){ show.classList.add('hide'); rev.classList.remove('hide');
      rev.scrollIntoView({behavior:'smooth',block:'nearest'}); } };
    show.onclick=flip;
    // The whole front of the card flips it, so a tap anywhere works on the phone.
    box.onclick=e=>{ if(!e.target.closest('[data-rate]') && !e.target.closest('#rev')) flip(); };
    document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{
      const k=box.dataset.k, a={en:null, rating:b.dataset.rate, at:today()};
      if(view.name==='deck'){ const c=deckCard(k); if(c) a.lesson=c.lesson; S.deck.cards[k]=a; touchDay(); go({name:'deck'}); }
      else { L(view.n).cards[k]=a; touchDay(); go({name:'lesson',n:view.n,step:'cards'}); } });
  }
  const gbox=$('#gapbox');
  if(gbox){
    const g=PKG.lessons[view.n-1].cloze[+gbox.dataset.i];
    const inp=$('#gap'), chk=$('#check'), rev=$('#grev');
    const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim()
                   .replace(/^(el|la|los|las|un|una)\s+/,'');
    const sync=()=>{ chk.disabled=inp.value.trim().length===0; };
    inp.oninput=sync; sync(); setTimeout(()=>inp.focus(),80);
    inp.onkeydown=e=>{ if(e.key==='Enter' && !chk.disabled) chk.click(); };
    let assisted=false;
    const optsBtn=$('#opts'), optBox=$('#optbox');
    optsBtn.onclick=()=>{
      assisted=true; optsBtn.classList.add('hide'); optBox.classList.remove('hide');
      optBox.scrollIntoView({behavior:'smooth',block:'nearest'});
      document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{
        inp.value=b.dataset.opt; sync(); chk.click(); });
    };
    chk.onclick=()=>{
      const ok = [g.answer, ...(g.alt||[])].some(a=>norm(inp.value)===norm(a));
      chk.classList.add('hide'); optsBtn.classList.add('hide'); optBox.classList.add('hide');
      rev.classList.remove('hide'); inp.blur();
      $('#verdict').innerHTML = ok
        ? `<span class="ok">✓ ${esc(g.answer)}</span>${assisted?' <span class="sub">con opciones</span>':''}`
        : `<span class="bad">✗ ${esc(inp.value.trim())}</span> → <span class="ok">${esc(g.answer)}</span>`;
      L(view.n).cloze['c'+gbox.dataset.i]={en:inp.value.trim(), ok, assisted, at:today()};
      touchDay();
      $('#nextgap').onclick=()=>go({name:'lesson',n:view.n,step:'cloze'});
      rev.scrollIntoView({behavior:'smooth',block:'nearest'});
    };
  }
  const setr=$('#setr');
  if(setr){
    setr.onclick=()=>{ S.reminder=$('#rtime').value; S.notified=null; save(); scheduleLocal();
      setr.textContent='Guardado ✓'; setTimeout(()=>setr.textContent='Guardar hora',1400); };
    $('#askn').onclick=async()=>{
      if(!hasNotif()){ toast("Este navegador no ofrece notificaciones aquí. Usa el recordatorio de calendario."); return; }
      try{ await Notification.requestPermission(); }catch(e){} render(); };
    $('#testn').onclick=()=>{ if(hasNotif() && Notification.permission==='granted')
        new Notification("Español · 10 minutos",{body:"Así se va a ver.",tag:"diez-test"});
      else toast("Primero permite las notificaciones."); };
    const ics=$('#ics');
    if(ics) ics.onclick=()=>download('espanol_diario.ics', icsFile(), 'text/calendar;charset=utf-8');
    const off=$('#offl');
    if(off) off.innerHTML = ART ? 'Sin conexión: <b>no en esta versión</b>; la copia de GitHub sí funciona sin señal.'
      : ('serviceWorker' in navigator && location.protocol.startsWith('http'))
      ? (navigator.serviceWorker.controller ? 'Sin conexión: <b>listo</b>.' : 'Sin conexión: preparando…')
      : 'Sin conexión: <b>no disponible desde un archivo local</b>, abre la versión publicada.';
    $('#exp').onclick=exportAnswers;
    const rs=$('#reset');
    rs.onclick=()=>armed(rs, '¿Seguro? Toca otra vez para borrar', ()=>{ S=blank(); save(); go({name:'home'}); });

    const st=$('#savetok');
    if(st) st.onclick=async()=>{
      const v=$('#ghtok').value.trim();
      if(!v){ toast("Pega el token primero."); return; }
      SY.token=v; SY.sha=null; SY.err=null; SY.dirty=true; sySave();
      st.textContent='Comprobando…';
      await syNow();
      st.textContent = syPhase==='error' ? 'Falló · reintentar' : 'Guardado ✓';
      setTimeout(()=>render(), 900);
    };
    const sn=$('#synow');
    if(sn) sn.onclick=async()=>{
      if(!backend()){ toast(ART ? "Todavía conectando con Claude…" : "Guarda un token primero."); return; }
      SY.dirty=true; sySave(); await syNow(); syPaint();
    };
    const ft=$('#forgettok');
    if(ft) ft.onclick=()=>armed(ft, '¿Olvidar el token? Toca otra vez', ()=>{ SY=syBlank(); sySave(); render(); });
  }
  syPaint();
}

/* ---------- offline ---------- */
// Only meaningful when served over http(s); from file:// this is a no-op.
if (!ART && "serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js", {scope: "./"}).catch(()=>{});
  });
}

/* ---------- sync lifecycle ---------- */
/* Anything left dirty by a failed or interrupted push goes out on the next
   open, when the app is backgrounded, and whenever the phone regains signal. */
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) syPush(true); });
window.addEventListener("pagehide", ()=>syPush(true));
window.addEventListener("online", ()=>syPush());
setInterval(()=>{ if(SY.dirty && !syBusy) syPush(); }, 60000);

render();
scheduleLocal();
if(SY.dirty) syPush();
</script>
