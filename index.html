<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12100e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diez">
<title>Diez · segunda serie</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312100e'/%3E%3Ctext x='32' y='44' font-size='34' font-family='Georgia,serif' fill='%23e8a33d' text-anchor='middle'%3E10%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.json">
<style>
:root{
  --bg:#12100e; --panel:#1b1815; --panel2:#231f1b; --line:#332d27;
  --ink:#ece6df; --dim:#9b9186; --amber:#e8a33d; --green:#7fc08a;
  --red:#d9736b; --blue:#8fb3d9;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{
  font:17px/1.62 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:max(14px,env(safe-area-inset-top)) 14px calc(84px + env(safe-area-inset-bottom));
  max-width:680px;margin:0 auto;overscroll-behavior-y:contain;
}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:-.01em;margin:0}
h1{font-size:25px}
h2{font-size:20px;margin:0 0 4px}
.sub{color:var(--dim);font-size:13.5px;line-height:1.5}
.tw{color:var(--amber);font-weight:600}
.rw{color:var(--green);font-style:normal;border-bottom:1px dotted var(--green)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;margin:11px 0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.btn{display:block;width:100%;padding:14px;border-radius:12px;background:var(--amber);color:#1a1200;
  font-weight:700;font-size:16.5px;text-align:center;margin-top:12px}
.btn:disabled{opacity:.32}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line);font-weight:600}
.row{display:flex;gap:9px}.row>*{flex:1}
input[type=text],input[type=time]{width:100%;padding:13px 12px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel2);color:var(--ink);font:inherit;-webkit-appearance:none}
input:focus{outline:2px solid var(--amber);outline-offset:-1px}

/* header + streak */
header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.stat{display:flex;gap:16px;margin:12px 0 4px}
.stat div{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font:600 22px/1.2 Georgia,serif;color:var(--amber)}
.stat span{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}

/* lesson list */
.lesson{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;
  background:var(--panel);border:1px solid var(--line);border-radius:13px;margin:9px 0}
.lesson .num{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;
  font:600 14px Georgia,serif;background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
.lesson.done .num{background:var(--green);color:#10200f;border-color:var(--green)}
.lesson.part .num{border-color:var(--amber);color:var(--amber)}
.lesson .t{flex:1;min-width:0}
.lesson .t b{display:block;font-weight:600;font-size:16px}
.lesson .t span{font-size:12.5px;color:var(--dim)}
.lesson .chev{color:var(--dim)}

/* steps */
.steps{display:flex;gap:6px;margin:12px 0 4px}
.steps button{flex:1;padding:9px 4px;border-radius:10px;background:var(--panel);border:1px solid var(--line);
  font-size:13px;color:var(--dim)}
.steps button.on{background:var(--amber);color:#1a1200;border-color:var(--amber);font-weight:700}
.steps button.ok{color:var(--green);border-color:#33452f}

/* reading */
.passage p{margin:0 0 13px}
.gloss{background:var(--panel2);border-left:3px solid var(--line);border-radius:0 10px 10px 0;
  padding:11px 13px;font-size:14px;color:var(--dim)}
details{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.tr-one{margin-top:11px;padding-top:9px}
.tr-one summary{font-size:13.5px}
summary{cursor:pointer;color:var(--blue);font-size:14.5px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";}
details[open] summary::before{content:"▾ ";}

/* cards */
.prog{height:3px;background:var(--panel2);border-radius:2px;overflow:hidden;margin:2px 0 14px}
.prog i{display:block;height:100%;background:var(--amber);transition:width .25s}
.qes{font:19px/1.62 Georgia,serif;margin:6px 0 14px}
.gap{display:inline-block;min-width:70px;border-bottom:2px solid var(--amber);vertical-align:baseline}
.cue{background:var(--panel2);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:16px}
.cue span{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim);margin-bottom:2px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{padding:13px 8px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);
  font-size:15.5px;font-weight:600}
.reveal{margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.reveal .mean{font:600 20px Georgia,serif;color:var(--amber);margin-bottom:2px}
.reveal .tr{color:var(--dim);font-size:14.5px;margin-bottom:10px}
.hook{background:var(--panel2);border-radius:10px;padding:11px 12px;font-size:14px;color:#cfc6bb}
.rline{display:flex;gap:14px;align-items:baseline;justify-content:space-between;
  padding:8px 0;border-top:1px solid var(--line)}
.rline:first-of-type{border-top:0;padding-top:2px}
.rline b{font:600 16.5px Georgia,serif;flex:0 0 auto}
.rline span{color:var(--dim);font-size:14.5px;text-align:right}
.wline{display:flex;align-items:center;gap:9px;justify-content:space-between}
.wline b{font:600 21px Georgia,serif}
.wmean{color:var(--ink);font-size:15.5px;margin-top:2px}
.yours{font-size:13.5px;color:var(--dim);margin-top:10px}
.yours b{color:var(--ink);font-weight:600}
.mark{display:flex;gap:9px;margin-top:12px}
.mark button{flex:1;padding:12px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);font-weight:600}
.mark button.si{color:var(--green)}.mark button.no{color:var(--red)}
.ok{color:var(--green)}.bad{color:var(--red)}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.tag.new{color:var(--amber);border-color:#5a4423}
.tag.rev{color:var(--green);border-color:#33452f}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(18,16,14,.94);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:9px 14px calc(9px + env(safe-area-inset-bottom));
  display:flex;gap:9px;max-width:680px;margin:0 auto}
.bar button{flex:1;padding:12px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);
  font-size:14px;font-weight:600}
.bar button.primary{background:var(--amber);color:#1a1200}
.hide{display:none}
.note{font-size:13px;color:var(--dim);line-height:1.55}
.note b{color:var(--ink)}
.dots{display:flex;gap:5px;margin-top:8px}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--panel2);border:1px solid var(--line)}
.dots i.on{background:var(--green);border-color:var(--green)}

/* sync */
.sychip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;letter-spacing:.04em;
  padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.sychip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
.sychip.green{color:var(--green);border-color:#33452f}
.sychip.amber{color:var(--amber);border-color:#5a4423}
.sychip.red{color:var(--red);border-color:#5c2f2b}
.syline{display:flex;align-items:center;gap:8px;margin-top:9px}

/* toast: the artifact viewer swallows alert(), so the page says things itself */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));z-index:9;
  transform:translate(-50%,8px);background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  padding:9px 14px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;
  max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.lesson.deck .num{border-color:var(--amber);color:var(--amber);font-size:16px}
</style>
</head>

<script>
const PKG = {"package": "Diez · veinte lecciones", "subtitle": "Ramón · la estación · el pueblo que se vacía", "band": "2k", "built": "2026-10-09", "minutes_each": 10, "lessons": [{"n": 1, "title": "La grabación", "passage": ["Llego al pueblo con una grabadora vieja y una lista de nombres que me dio una *fuente* en la capital. El primero de la lista es Ramón. Le pido una **entrevista** y él se ríe: —Aquí nadie da entrevistas. Aquí se habla, y ya.", "Le pregunto si puedo **grabar**. *Señala* la grabadora con la barbilla y dice que sí, pero que no espere gran cosa. —En este pueblo no pasa nada. El último **suceso** fue el cierre de la mina, y de eso ya hace ocho años.", "Le digo que la mina, mientras duró, fue un **éxito**: las *cifras* de producción salían en los periódicos de la capital. —Un éxito para otros —contesta—. Yo fui **testigo** de cómo se llevaron las máquinas en camiones, de noche, sin decirle nada a nadie.", "Apago la grabadora y él sigue hablando. Su **relato** no tiene principio ni final: empieza por el día que cerraron y vuelve una y otra vez al mismo *hecho*. Lo escucho hasta que se hace de noche."], "glosses": ["la grabadora = recorder", "la barbilla = chin", "y ya = and that's it", "el camión = truck", "hacerse de noche = to get dark"], "translation": ["I arrive in the town with an old recorder and a list of names a source in the capital gave me. The first on the list is Ramón. I ask him for an interview and he laughs: \"Nobody here gives interviews. Here people talk, and that's it.\"", "I ask if I can record. He points at the recorder with his chin and says yes, but not to expect much. \"Nothing happens in this town. The last event was the mine closing, and that was eight years ago.\"", "I tell him the mine, while it lasted, was a success: the production figures appeared in the newspapers in the capital. \"A success for other people,\" he replies. \"I witnessed how they took the machines away in trucks, at night, without telling anyone.\"", "I switch the recorder off and he keeps talking. His account has no beginning or end: it starts with the day they closed and comes back again and again to the same fact. I listen until it gets dark."], "new_words": [{"word": "la entrevista", "en": "interview", "rank": 1400, "es": "Le pido una **entrevista** y él se ríe.", "en_sentence": "I ask him for an interview and he laughs.", "hook": "entre + vista: a seeing-between, two people facing each other. Entrevistar = to interview; el entrevistado = the person interviewed.", "es_html": "Le pido una <b class=\"tw\">entrevista</b> y él se ríe."}, {"word": "grabar", "en": "to record (audio, video); to engrave", "rank": 1500, "es": "Le pregunto si puedo **grabar**.", "en_sentence": "I ask if I can record.", "hook": "Not 'grab'. It first meant to engrave, cutting a mark into stone; a recording is the same idea on tape. La grabación = the recording.", "es_html": "Le pregunto si puedo <b class=\"tw\">grabar</b>."}, {"word": "el suceso", "en": "event, incident", "rank": 1800, "es": "El último **suceso** fue el cierre de la mina.", "en_sentence": "The last event was the mine closing.", "hook": "False friend: not success. A suceso is something that happens, often bad; the crime pages of a newspaper are called Sucesos. Success is el éxito.", "es_html": "El último <b class=\"tw\">suceso</b> fue el cierre de la mina."}, {"word": "el éxito", "en": "success, hit", "rank": 1000, "es": "La mina, mientras duró, fue un **éxito**.", "en_sentence": "The mine, while it lasted, was a success.", "hook": "False friend the other way: not exit. Tener éxito = to succeed; the exit is la salida. Keep éxito and suceso apart: neither means what it looks like.", "es_html": "La mina, mientras duró, fue un <b class=\"tw\">éxito</b>."}, {"word": "el testigo", "en": "witness", "rank": 2000, "es": "Yo fui **testigo** de cómo se llevaron las máquinas.", "en_sentence": "I witnessed how they took the machines away.", "hook": "Same root as testify and testimony. Ser testigo de = to witness. The form is the same for a woman: la testigo.", "es_html": "Yo fui <b class=\"tw\">testigo</b> de cómo se llevaron las máquinas."}, {"word": "el relato", "en": "account, story, narrative", "rank": 1800, "es": "Su **relato** no tiene principio ni final.", "en_sentence": "His account has no beginning or end.", "hook": "From relatar, to relate in the old English sense of telling. A relato is an account someone gives; el cuento is a tale that was made up.", "es_html": "Su <b class=\"tw\">relato</b> no tiene principio ni final."}], "review": ["la fuente", "señalar", "el hecho", "la cifra"], "cloze": [{"es": "La periodista pidió una ___ con el alcalde y se la negaron.", "answer": "entrevista", "en": "The journalist asked the mayor for an interview and was refused.", "support": "el alcalde = mayor", "cue": "interview", "lemma": "la entrevista", "options": ["testigo", "éxito", "relato", "entrevista"], "es_html": "La periodista pidió una <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> con el alcalde y se la negaron."}, {"es": "No hace falta ___ la conversación; con apuntes es suficiente.", "answer": "grabar", "en": "There's no need to record the conversation; notes are enough.", "support": "los apuntes = notes", "cue": "to record (audio, video); to engrave", "lemma": "grabar", "options": ["testigo", "éxito", "grabar", "entrevista"], "es_html": "No hace falta <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> la conversación; con apuntes es suficiente."}, {"es": "En la página de ___ del diario salió el incendio del taller.", "answer": "sucesos", "en": "The workshop fire appeared on the newspaper's incidents page.", "support": "el incendio = fire", "cue": "event, incident", "lemma": "el suceso", "options": ["relato", "grabar", "sucesos", "testigo"], "es_html": "En la página de <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> del diario salió el incendio del taller."}, {"es": "La canción fue un ___ en toda la región ese verano.", "answer": "éxito", "en": "The song was a hit across the whole region that summer.", "cue": "success, hit", "lemma": "el éxito", "options": ["testigo", "sucesos", "éxito", "entrevista"], "es_html": "La canción fue un <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> en toda la región ese verano."}, {"es": "Ningún ___ quiso declarar ante el juez.", "answer": "testigo", "en": "No witness was willing to testify before the judge.", "support": "declarar = to testify", "cue": "witness", "lemma": "el testigo", "options": ["grabar", "relato", "testigo", "entrevista"], "es_html": "Ningún <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> quiso declarar ante el juez."}, {"es": "Su ___ de aquella noche cambia cada vez que lo cuenta.", "answer": "relato", "en": "His account of that night changes every time he tells it.", "cue": "account, story, narrative", "lemma": "el relato", "options": ["sucesos", "relato", "grabar", "testigo"], "es_html": "Su <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> de aquella noche cambia cada vez que lo cuenta."}], "review_cards": [{"word": "la fuente", "en": "source, fountain", "rank": 1400, "es": "No da la **fuente** de sus números.", "en_sentence": "He doesn't give the source of his figures.", "hook": "Entered 0017. Shape trap flagged at entry: la fuente (source) vs fuerte (strong). In prose it is almost always 'source', not 'fountain'. · fuentes oficiales — official sources · de buena fuente — on good authority", "kind": "review", "box": 1, "es_html": "No da la <b class=\"tw\">fuente</b> de sus números."}, {"word": "señalar", "en": "to point out, to indicate, to point at", "rank": 1100, "es": "**Señaló** la carretera y dijo que por ahí se iban todos.", "en_sentence": "He pointed at the highway and said that's where everyone left by.", "hook": "Built on 'la señal'. Both physical pointing and stating. 2026-09-10: missed in cloze — answered 'la falta', a noun in a verb slot. Same noun/verb axis as the 09-09 contrast drill. Teach with 'la señal'. 0014: 'showed pointed' — correct, and the verb slot was read correctly this time. · la señal — sign, signal · señalar que — to point out that", "kind": "review", "box": 2, "es_html": "<b class=\"tw\">Señaló</b> la carretera y dijo que por ahí se iban todos."}, {"word": "el hecho", "en": "fact, deed", "rank": 400, "es": "El **hecho** de que no respondiera me preocupó.", "en_sentence": "The fact that he didn't answer worried me.", "hook": "Highest-frequency word you missed. 'de hecho' is everywhere in prose. 0014: 'deed, matter' — credited on 'deed'. Note 'el hecho es que' = the fact is; 'fact' was not produced. · de hecho — in fact · el hecho de que + subjunctive", "kind": "review", "box": 5, "es_html": "El <b class=\"tw\">hecho</b> de que no respondiera me preocupó."}, {"word": "la cifra", "en": "figure, number, digit", "rank": 2100, "es": "Las ventas alcanzaron una **cifra** récord.", "en_sentence": "Sales reached a record figure.", "hook": "Ubiquitous in news and reports. Missed on first exposure in session 1, before the app separated introduction from review. Not a real lapse. 0014: 'figure' — correct, box 5. · una cifra récord — a record figure · cifras oficiales — official figures", "kind": "review", "box": 5, "es_html": "Las ventas alcanzaron una <b class=\"tw\">cifra</b> récord."}], "passage_html": ["Llego al pueblo con una grabadora vieja y una lista de nombres que me dio una <i class=\"rw\">fuente</i> en la capital. El primero de la lista es Ramón. Le pido una <b class=\"tw\">entrevista</b> y él se ríe: —Aquí nadie da entrevistas. Aquí se habla, y ya.", "Le pregunto si puedo <b class=\"tw\">grabar</b>. <i class=\"rw\">Señala</i> la grabadora con la barbilla y dice que sí, pero que no espere gran cosa. —En este pueblo no pasa nada. El último <b class=\"tw\">suceso</b> fue el cierre de la mina, y de eso ya hace ocho años.", "Le digo que la mina, mientras duró, fue un <b class=\"tw\">éxito</b>: las <i class=\"rw\">cifras</i> de producción salían en los periódicos de la capital. —Un éxito para otros —contesta—. Yo fui <b class=\"tw\">testigo</b> de cómo se llevaron las máquinas en camiones, de noche, sin decirle nada a nadie.", "Apago la grabadora y él sigue hablando. Su <b class=\"tw\">relato</b> no tiene principio ni final: empieza por el día que cerraron y vuelve una y otra vez al mismo <i class=\"rw\">hecho</i>. Lo escucho hasta que se hace de noche."]}, {"n": 2, "title": "El puesto", "passage": ["Marisol tiene un **puesto** de comida junto a la terminal de autobuses. Vende café, pan y lo que haya. Abre a las seis, cuando pasa el único autobús, y cierra cuando se acaba el pan.", "—Este puesto es mi **empleo** y mi pensión —dice—. Con el **desempleo** que hay, no voy a encontrar otra cosa. Sus *ingresos* son *escasos*, pero son suyos, y eso, dice, ya es algo.", "Su marido fue **obrero** en la mina veinte años. Lo **despidieron** un martes, junto con doscientos más, con una carta de tres líneas. —Le dieron las gracias por el *esfuerzo* —dice Marisol, y no sonríe.", "Ahora él trabaja de guardia en una obra de la capital. Una **jornada** de doce horas, y vuelve a casa cada quince días. —Es una *etapa* —dice ella—. Llevamos ocho años en esta etapa."], "glosses": ["la terminal = bus station", "la pensión = pension", "el guardia = security guard", "la obra = building site", "cada quince días = every two weeks"], "translation": ["Marisol has a food stall next to the bus station. She sells coffee, bread and whatever there is. She opens at six, when the only bus goes by, and closes when the bread runs out.", "\"This stall is my job and my pension,\" she says. \"With the unemployment there is, I'm not going to find anything else.\" Her income is meagre, but it is hers, and that, she says, is already something.", "Her husband was a labourer in the mine for twenty years. They fired him on a Tuesday, along with two hundred others, with a three-line letter. \"They thanked him for the effort,\" Marisol says, and does not smile.", "Now he works as a guard on a building site in the capital. A twelve-hour day, and he comes home every two weeks. \"It's a stage,\" she says. \"We've been in this stage for eight years.\""], "new_words": [{"word": "el puesto", "en": "stall; post, position, job", "rank": 1000, "es": "Marisol tiene un **puesto** de comida junto a la terminal.", "en_sentence": "Marisol has a food stall next to the bus station.", "hook": "From poner: a thing that has been put somewhere. A market stall, a job position (puesto de trabajo), a place in a ranking (primer puesto). Always a spot that is held.", "es_html": "Marisol tiene un <b class=\"tw\">puesto</b> de comida junto a la terminal."}, {"word": "el empleo", "en": "employment, job; use", "rank": 1000, "es": "Este puesto es mi **empleo** y mi pensión.", "en_sentence": "This stall is my job and my pension.", "hook": "Emplear = to employ, and also to use (emplear el tiempo). El empleo is the fact of having work; el puesto is the particular slot you fill.", "es_html": "Este puesto es mi <b class=\"tw\">empleo</b> y mi pensión."}, {"word": "el desempleo", "en": "unemployment", "rank": 2100, "es": "Con el **desempleo** que hay, no voy a encontrar otra cosa.", "en_sentence": "With the unemployment there is, I'm not going to find anything else.", "hook": "des + empleo. Latin America says desempleo; Spain says el paro. Un desempleado = an unemployed person.", "es_html": "Con el <b class=\"tw\">desempleo</b> que hay, no voy a encontrar otra cosa."}, {"word": "el obrero", "en": "worker, labourer", "rank": 1700, "es": "Su marido fue **obrero** en la mina veinte años.", "en_sentence": "Her husband was a labourer in the mine for twenty years.", "hook": "From obra, work in the sense of a built thing. An obrero works with his hands; un trabajador is anyone who works. La clase obrera = the working class.", "es_html": "Su marido fue <b class=\"tw\">obrero</b> en la mina veinte años."}, {"word": "despedir", "en": "to fire, to dismiss; to see off (despedirse =  así que las deja detrás del mostrador, en un <b class=\"tw\">montón</b> que va creciendo. —Con lo que vendo en un día, <b class=\"tw\">basta</b> para pagar la luz. Para lo demás, no.", "Le pregunto por la <i class=\"rw\">falta</i> de clientes. Saca una libreta y me muestra los números: un <i class=\"rw\">aumento</i> pequeño en verano, cuando vuelven algunos, y nada el resto del año. —Esto es una <i class=\"rw\">muestra</i> —dice—, pero la muestra es el pueblo entero.", "Antes de irme, compra él mismo una lata de sardinas y la abre. —Para que no sobren tantas —dice."]}, {"n": 4, "title": "Aguantar", "passage": ["Don Aurelio tiene setenta y cuatro años y es el último de su calle. Las otras once casas están cerradas con tablas. —Me han dicho que me vaya con mi hija a la capital —dice—. No **soporto** la ciudad. No **aguanto** el ruido ni a la gente. Su hija ha *fracasado* tres veces en convencerlo.", "Cuando llueve, el techo gotea y él pone cubos. Cuando cortan la luz, enciende velas. Le pregunto si no está **harto**. —Harto sí. Pero **rendirme**, no. Eso es otra cosa.", "El municipio le ha mandado dos cartas con la *amenaza* de cortar el agua. Él las guarda en un cajón. *Sostiene* que la calle sigue siendo suya mientras él viva en ella, y nadie lo *apoya*, pero tampoco nadie viene a discutirlo.", "Por las tardes se sienta en la puerta a mirar la carretera. Es una **costumbre** de la época de la mina, cuando volvían los camiones. —Cuando pasa un coche, siento un **alivio** raro —dice—. Como si el pueblo todavía existiera."], "glosses": ["la tabla = board, plank", "gotear = to drip", "el cubo = bucket", "la vela = candle", "el cajón = drawer"], "translation": ["Don Aurelio is seventy-four and the last one on his street. The other eleven houses are boarded up. \"They've told me to go and live with my daughter in the capital,\" he says. \"I can't stand the city. I can't bear the noise or the people.\" His daughter has failed three times to persuade him.", "When it rains, the roof drips and he puts out buckets. When they cut the power, he lights candles. I ask him if he isn't fed up. \"Fed up, yes. But giving up, no. That's a different thing.\"", "The town hall has sent him two letters threatening to cut off the water. He keeps them in a drawer. He maintains that the street is still his as long as he lives on it, and nobody backs him, but nobody comes to argue about it either.", "In the afternoons he sits in the doorway watching the road. It's a habit from the days of the mine, when the trucks used to come back. \"When a car goes by, I feel a strange relief,\" he says. \"As if the town still existed.\""], "new_words": [{"word": "soportar", "en": "to put up with, to bear, to stand", "rank": 1500, "es": "No **soporto** la ciudad.", "en_sentence": "I can't stand the city.", "hook": "False friend: not support. It means to bear a weight, so to endure. To support someone is apoyar, which you already have. No soporto a mi jefe = I can't stand my boss.", "es_html": "No <b class=\"tw\">soporto</b> la ciudad."}, {"word": "aguantar", "en": "to put up with, to hold (out), to withstand", "rank": 1600, "es": "No **aguanto** el ruido ni a la gente.", "en_sentence": "I can't bear the noise or the people.", "hook": "The everyday twin of soportar, a bit more physical: aguantar la respiración = hold your breath; aguanta un poco = hang on a bit. Aguantarse = to put up with it and say nothing.", "es_html": "No <b class=\"tw\">aguanto</b> el ruido ni a la gente."}, {"word": "rendirse", "en": "to give up, to surrender", "rank": 2000, "es": "Harto sí. Pero **rendirme**, no.", "en_sentence": "Fed up, yes. But giving up, no.", "hook": "Rendir alone = to yield or to perform (el motor rinde poco). With se it turns inward: me rindo = I give up. Stem changes: me rindo, se rindió.", "es_html": "Harto sí. Pero <b class=\"tw\">rendirme</b>, no."}, {"word": "harto", "en": "fed up (estar harto de)", "rank": 1900, "es": "Le pregunto si no está **harto**.", "en_sentence": "I ask him if he isn't fed up.", "hook": "Estar harto de = to be sick of. Originally full to bursting, from hartar, to stuff with food. In some countries harto also means a lot: harta gente.", "es_html": "Le pregunto si no está <b class=\"tw\">harto</b>."}, {"word": "el alivio", "en": "relief", "rank": 2300, "es": "Cuando pasa un coche, siento un **alivio** raro.", "en_sentence": "When a car goes by, I feel a strange relief.", "hook": "Aliviar = to lighten, to relieve; alleviate is its English cousin. ¡Qué alivio! = what a relief.", "es_html": "Cuando pasa un coche, siento un <b class=\"tw\">alivio</b> raro."}, {"word": "la costumbre", "en": "custom, habit", "rank": 1300, "es": "Es una **costumbre** de la época de la mina.", "en_sentence": "It's a habit from the days of the mine.", "hook": "Custom and costume share its Latin root, but costumbre is only the habit. Tener la costumbre de = to be in the habit of; como de costumbre = as usual.", "es_html": "Es una <b class=\"tw\">costumbre</b> de la época de la mina."}], "review": ["apoyar", "fracasar", "la amenaza", "sostener"], "cloze": [{"es": "No ___ que me hablen mientras conduzco.", "answer": "soporto", "alt": ["aguanto"], "en": "I can't stand people talking to me while I'm driving.", "cue": "to put up with, to bear, to stand", "lemma": "soportar", "options": ["alivio", "soporto", "rendirse", "aguantó"], "es_html": "No <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> que me hablen mientras conduzco."}, {"es": "___ la respiración debajo del agua casi un minuto.", "answer": "aguantó", "en": "He held his breath underwater for almost a minute.", "support": "la respiración = breath", "cue": "to put up with, to hold (out), to withstand", "lemma": "aguantar", "options": ["harto", "aguantó", "soporto", "rendirse"], "es_html": "<span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> la respiración debajo del agua casi un minuto."}, {"es": "Es fácil ___ cuando nadie te ve intentarlo.", "answer": "rendirse", "en": "It's easy to give up when nobody sees you trying.", "cue": "to give up, to surrender", "lemma": "rendirse", "options": ["aguantó", "rendirse", "alivio", "soporto"], "es_html": "Es fácil <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> cuando nadie te ve intentarlo."}, {"es": "Estoy ___ de esperar cartas que nunca llegan.", "answer": "harto", "alt": ["harta"], "en": "I'm fed up with waiting for letters that never come.", "cue": "fed up (estar harto de)", "lemma": "harto", "options": ["costumbre", "soporto", "alivio", "harto"], "es_html": "Estoy <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> de esperar cartas que nunca llegan."}, {"es": "Cuando el médico dijo que no era grave, sintió un ___ enorme.", "answer": "alivio", "en": "When the doctor said it wasn't serious, she felt enormous relief.", "cue": "relief", "lemma": "el alivio", "options": ["costumbre", "aguantó", "alivio", "soporto"], "es_html": "Cuando el médico dijo que no era grave, sintió un <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> enorme."}, {"es": "Tiene la ___ de leer el periódico en la puerta, llueva o no.", "answer": "costumbre", "en": "He has the habit of reading the paper in the doorway, rain or shine.", "cue": "custom, habit", "lemma": "la costumbre", "options": ["aguantó", "soporto", "costumbre", "harto"], "es_html": "Tiene la <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> de leer el periódico en la puerta, llueva o no."}], "review_cards": [{"word": "apoyar", "en": "to support, to lean, to back", "rank": 1400, "es": "Mis padres siempre **apoyaron** mis decisiones.", "en_sentence": "My parents always supported my decisions.", "hook": "Both physical leaning and abstract backing. Missed on first exposure in session 1, before the app separated introduction from review. Not a real lapse. 0014: 'supported' — correct, box 3. · apoyarse en — to lean on · el apoyo — support (noun)", "kind": "review", "box": 3, "es_html": "Mis padres siempre <b class=\"tw\">apoyaron</b> mis decisiones."}, {"wor blas. —Me han dicho que me vaya con mi hija a la capital —dice—. No <b class=\"tw\">soporto</b> la ciudad. No <b class=\"tw\">aguanto</b> el ruido ni a la gente. Su hija ha <i class=\"rw\">fracasado</i> tres veces en convencerlo.", "Cuando llueve, el techo gotea y él pone cubos. Cuando cortan la luz, enciende velas. Le pregunto si no está <b class=\"tw\">harto</b>. —Harto sí. Pero <b class=\"tw\">rendirme</b>, no. Eso es otra cosa.", "El municipio le ha mandado dos cartas con la <i class=\"rw\">amenaza</i> de cortar el agua. Él las guarda en un cajón. <i class=\"rw\">Sostiene</i> que la calle sigue siendo suya mientras él viva en ella, y nadie lo <i class=\"rw\">apoya</i>, pero tampoco nadie viene a discutirlo.", "Por las tardes se sienta en la puerta a mirar la carretera. Es una <b class=\"tw\">costumbre</b> de la época de la mina, cuando volvían los camiones. —Cuando pasa un coche, siento un <b class=\"tw\">alivio</b> raro —dice—. Como si el pueblo todavía existiera."]}, {"n": 5, "title": "El orden y la orden", "passage": ["Acompaño a Ramón a la oficina regional, a dos horas en coche. Lleva una carpeta con la **solicitud** para que arreglen la línea eléctrica. Es la tercera vez que la presenta. Las dos anteriores se perdieron.", "En la ventanilla, un **funcionario** joven revisa los papeles sin levantar la vista. —Falta un **requisito** —dice—. La **firma** del propietario del terreno. —El propietario soy yo —dice Ramón. —Pues falta su firma en la página cuatro.", "Ramón firma. El funcionario mira el *plazo*: venció hace dos semanas. —Con este *retraso*, hay que empezar de nuevo. —Ustedes *exigen* papeles y yo los traigo. ¿Qué más quieren? —Que **cumpla** con el procedimiento, señor. Es el **orden** de las cosas.", "En el coche de vuelta, Ramón va callado. Al final dice: —Cuando el municipio quiere algo, manda una orden y hay que cumplirla en tres días. Cuando quieres tú algo, es otro *asunto*."], "glosses": ["la carpeta = folder", "la ventanilla = service counter", "el propietario = owner", "el terreno = plot of land", "el procedimiento = procedure"], "translation": ["I go with Ramón to the regional office, two hours away by car. He carries a folder with the application to get the power line repaired. It's the third time he has submitted it. The two previous ones got lost.", "At the counter, a young civil servant checks the papers without looking up. \"A requirement is missing,\" he says. \"The landowner's signature.\" \"I'm the owner,\" says Ramón. \"Then your signature is missing on page four.\"", "Ramón signs. The clerk looks at the deadline: it expired two weeks ago. \"With this delay, you have to start again.\" \"You people demand papers and I bring them. What more do you want?\" \"That you comply with the procedure, sir. It's the order of things.\"", "In the car on the way back, Ramón is quiet. Finally he says: \"When the town hall wants something, it sends an order and you have to carry it out in three days. When you want something, that's another matter.\""], "new_words": [{"word": "el orden", "en": "order (arrangement, sequence) — la orden = order (command)", "rank": 700, "es": "Es el **orden** de las cosas.", "en_sentence": "It's the order of things.", "hook": "Gender flips the meaning. El orden is arrangement: en orden, por orden alfabético. La orden is a command, or a religious order: dar una orden, cumplir una orden. Both appear in this lesson.", "es_html": "Es el <b class=\"tw\">orden</b> de las cosas."}, {"word": "la solicitud", "en": "application, request", "rank": 2100, "es": "Lleva la **solicitud** para que arreglen la línea eléctrica.", "en_sentence": "He carries the application to get the power line repaired.", "hook": "Solicitar = to apply for, to request. Any official form you fill in is a solicitud: de empleo, de beca. Solícito, the adjective, means attentive, a different thing.", "es_html": "Lleva la <b class=\"tw\">solicitud</b> para que arreglen la línea eléctrica."}, {"word": "el requisito", "en": "requirement", "rank": 2300, "es": "Falta un **requisito**: la firma del propietario.", "en_sentence": "A requirement is missing: the owner's signature.", "hook": "Requisite is rare in English; requisito is everyday bureaucracy in Spanish. Cumplir los requisitos = to meet the requirements. Requerir = to require.", "es_html": "Falta un <b class=\"tw\">requisito</b>: la firma del propietario."}, {"word": "el funcionario", "en": "civil servant, government employee", "rank": 1900, "es": "Un **funcionario** joven revisa los papeles sin levantar la vista.", "en_sentence": "A young civil servant checks the papers without looking up.", "hook": "Not a functionary in the sneering English sense; the neutral word for anyone who works for the state, from a clerk to a judge. La funcionaria for a woman.", "es_html": "Un <b class=\"tw\">funcionario</b> joven revisa los papeles sin levantar la vista."}, {"word": "la firma", "en": "signature; firm, company", "rank": 1900, "es": "La **firma** del propietario del terreno.", "en_sentence": "The landowner's signature.", "hook": "Firmar = to sign. In business prose la firma is also a company (una firma alemana). Both from firm, made solid: a signature makes a document firm.", "es_html": "La <b class=\"tw\">firma</b> del propietario del terreno."}, {"word": "cumplir", "en": "to fulfil, to carry out, to meet (a requirement); to turn (an age)", "rank": 700, "es": "Que **cumpla** con el procedimiento, señor.", "en_sentence": "That you comply with the procedure, sir.", "hook": "Cumplir una promesa = to keep a promise; cumplir con = to comply with; cumplir años = to have a birthday; cumplir treinta = to turn thirty. Incumplir = to breach.", "es_html": "Que <b class=\"tw\">cumpla</b> con el procedimiento, señor."}], "review": ["el plazo", "el retraso", "exigir", "el asunto"], "cloze": [{"es": "Puso los libros en ___ de tamaño, del más alto al más bajo.", "answer": "orden", "en": "She put the books in order of size, from tallest to shortest.", "cue": "order (arrangement, sequence) — la orden = order (command)", "lemma": "el orden", "options": ["funcionario", "orden", "firma", "cumple"], "es_html": "Puso los libros en <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> de tamaño, del más alto al más bajo."}, {"es": "Entregó la ___ de beca un día antes de que se cerrara el plazo.", "answer": "solicitud", "en": "He handed in the scholarship application a day before the deadline closed.", "support": "la beca = scholarship", "cue": "application, request", "lemma": "la solicitud", "options": ["firma", "cumple", "funcionario", "solicitud"], "es_html": "Entregó la <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> de beca un día antes de que se cerrara el plazo."}, {"es": "Hablar inglés es un ___ para el puesto.", "answer": "requisito", "en": "Speaking English is a requirement for the job.", "cue": "requirement", "lemma": "el requisito", "options": ["solicitud", "requisito", "orden", "cumple"], "es_html": "Hablar inglés es un <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> para el puesto."}, {"es": "Un ___ del registro civil me pidió el certificado de nacimiento.", "answer": "funcionario", "en": "A clerk at the civil registry asked me for my birth certificate.", "support": "el registro civil = civil registry", "cue": "civil servant, government employee", "lemma": "el funcionario", "options": ["funcionario", "solicitud", "requisito", "cumple"], "es_html": "Un <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> del registro civil me pidió el certificado de nacimiento."}, {"es": "El contrato no vale sin la ___ de las dos partes.", "answer": "firma", "en": "The contract isn't valid without both parties' signatures.", "cue": "signature; firm, company", "lemma": "la firma", "options": ["cumple", "firma", "requisito", "funcionario"], "es_html": "El contrato no vale sin la <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> de las dos partes."}, {"es": "Mi abuela ___ noventa años el mes que viene.", "answer": "cumple answer, supported retrieval. Next review should drop the contrast so the word stands alone. · exigir que + subjunctive · la exigencia — demand", "kind": "review", "box": 2, "es_html": "Los vecinos <b class=\"tw\">exigieron</b> una respuesta por escrito."}, {"word": "el asunto", "en": "matter, affair, business", "rank": 1300, "es": "Dijo que el **asunto** de la mina ya estaba cerrado.", "en_sentence": "He said the business with the mine was already closed.", "hook": "Abstract per rule 2. Neutral 'matter' — not a scandal unless context says so. 0014: 'matter' — correct on first graded review. · el asunto es que — the thing is that · meterse en asuntos ajenos — to meddle", "kind": "review", "box": 2, "es_html": "Dijo que el <b class=\"tw\">asunto</b> de la mina ya estaba cerrado."}], "passage_html": ["Acompaño a Ramón a la oficina regional, a dos horas en coche. Lleva una carpeta con la <b class=\"tw\">solicitud</b> para que arreglen la línea eléctrica. Es la tercera vez que la presenta. Las dos anteriores se perdieron.", "En la ventanilla, un <b class=\"tw\">funcionario</b> joven revisa los papeles sin levantar la vista. —Falta un <b class=\"tw\">requisito</b> —dice—. La <b class=\"tw\">firma</b> del propietario del terreno. —El propietario soy yo —dice Ramón. —Pues falta su firma en la página cuatro.", "Ramón firma. El funcionario mira el <i class=\"rw\">plazo</i>: venció hace dos semanas. —Con este <i class=\"rw\">retraso</i>, hay que empezar de nuevo. —Ustedes <i class=\"rw\">exigen</i> papeles y yo los traigo. ¿Qué más quieren? —Que <b class=\"tw\">cumpla</b> con el procedimiento, señor. Es el <b class=\"tw\">orden</b> de las cosas.", "En el coche de vuelta, Ramón va callado. Al final dice: —Cuando el municipio quiere algo, manda una orden y hay que cumplirla en tres días. Cuando quieres tú algo, es otro <i class=\"rw\">asunto</i>."]}, {"n": 6, "title": "Fingir", "passage": ["Un hombre de traje llega en un coche alquilado y dice que la mina va a volver a abrir. Se llama Ibáñez y *pretende* comprar las casas cerradas antes de que suba el precio. Reúne a la gente en el bar y *plantea* un plan con muchos números.", "Ramón lo escucha desde la barra y no dice nada. Después me dice: —**Finge** que no sabe que las galerías están inundadas. Y lo sabe.", "Marisol le pregunta a Ibáñez cuál es el *motivo* de tanta prisa. Él sonríe y no contesta. Al día siguiente, la gente se **entera** de que la empresa de Ibáñez no existe: Tomás, el chico que arregla teléfonos, lo **averiguó** en veinte minutos.", "Ibáñez se va antes del amanecer. Nadie sabe si quería **engañar** a alguien o si solo **ocultaba** un negocio que no le salió. Queda la **sospecha**, que en este pueblo es lo que más dura. Ramón me *advierte*: —Van a venir más."], "glosses": ["el traje = suit", "alquilado = rented", "la barra = bar counter", "la galería = mine tunnel", "inundado = flooded", "el amanecer = dawn"], "translation": ["A man in a suit arrives in a rented car and says the mine is going to reopen. His name is Ibáñez and he intends to buy the closed-up houses before the price goes up. He gathers people in the bar and puts forward a plan with a lot of numbers.", "Ramón listens from the bar counter and says nothing. Afterwards he tells me: \"He's pretending he doesn't know the tunnels are flooded. And he knows.\"", "Marisol asks Ibáñez what the reason for all the hurry is. He smiles and doesn't answer. The next day, people find out that Ibáñez's company doesn't exist: Tomás, the kid who fixes phones, found out in twenty minutes.", "Ibáñez leaves before dawn. Nobody knows whether he wanted to cheat someone or was just hiding a deal that didn't work out. The suspicion remains, which in this town is the thing that lasts longest. Ramón warns me: \"More will come.\""], "new_words": [{"word": "fingir", "en": "to pretend, to feign", "rank": 2000, "es": "**Finge** que no sabe que las galerías están inundadas.", "en_sentence": "He's pretending he doesn't know the tunnels are f b class=\"tw\">pérdida</b> de un pueblo no sale en los periódicos."]}, {"n": 8, "title": "La despedida", "passage": ["Hoy se va la familia Ortega. Han vendido lo que se podía vender y el resto lo dejan. **Mudarse** a la capital cuesta lo que cuesta un coche usado, y ellos no tienen coche. Van con seis *maletas* al autobús de las seis.", "La **despedida** es corta. Marisol les regala pan desde su *puesto* y no cobra. Ramón les llena un termo de café. Nadie llora; ya se ha ido demasiada gente para llorar por cada uno.", "En el mismo autobús llega un hombre de unos cincuenta años. Se llama Benito y es el primer **regreso** que veo en tres semanas. Estuvo ocho años en el norte, en una ciudad **lejana** cuyo nombre nadie aquí sabe pronunciar. —Fue una **estancia** larga —dice—. Demasiado.", "Le pregunto por qué volvió. Mira el *sendero* que sube a la mina y se encoge de hombros. —Allá todo era *ajeno*. Aquí por lo menos sé de quién es cada casa vacía. Ramón lo *aleja* del sol y le sirve café. —Bienvenido de **vuelta** —dice—. Aquí siempre hay alguien de vuelta. Es lo único que no se acaba."], "glosses": ["usado = second-hand", "cobrar = to charge (money)", "el termo = thermos flask", "pronunciar = to pronounce", "encogerse de hombros = to shrug"], "translation": ["Today the Ortega family leaves. They've sold what could be sold and the rest they leave behind. Moving to the capital costs what a second-hand car costs, and they don't have a car. They go to the six o'clock bus with six suitcases.", "The farewell is short. Marisol gives them bread from her stall and doesn't charge. Ramón fills a thermos of coffee for them. Nobody cries; too many people have already left to cry for each one.", "On the same bus a man of about fifty arrives. His name is Benito and he is the first return I've seen in three weeks. He spent eight years in the north, in a distant city whose name nobody here can pronounce. \"It was a long stay,\" he says. \"Too long.\"", "I ask him why he came back. He looks at the path that climbs to the mine and shrugs. \"Up there everything belonged to someone else. Here at least I know whose every empty house is.\" Ramón moves him out of the sun and pours him coffee. \"Welcome back,\" he says. \"There's always someone back here. It's the one thing that doesn't run out.\""], "new_words": [{"word": "la despedida", "en": "farewell, goodbye, send-off", "rank": 2000, "es": "La **despedida** es corta.", "en_sentence": "The farewell is short.", "hook": "Noun of despedirse, from lesson 2. Fiesta de despedida = leaving party; despedida de soltero = stag party. Despedir also fires you; that noun is el despido.", "es_html": "La <b class=\"tw\">despedida</b> es corta."}, {"word": "mudarse", "en": "to move house", "rank": 2000, "es": "**Mudarse** a la capital cuesta lo que cuesta un coche usado.", "en_sentence": "Moving to the capital costs what a second-hand car costs.", "hook": "Mudar alone = to change, to shed (a snake muda la piel). Mudarse de casa = to move house; la mudanza = the move, and the removals van. Not mover, which moves objects.", "es_html": "<b class=\"tw\">Mudarse</b> a la capital cuesta lo que cuesta un coche usado."}, {"word": "el regreso", "en": "return, coming back", "rank": 1700, "es": "Es el primer **regreso** que veo en tres semanas.", "en_sentence": "He is the first return I've seen in three weeks.", "hook": "Regresar = to go back, the everyday Latin American word where Spain says volver. Regress went sour in English; el regreso is neutral. De regreso = on the way back.", "es_html": "Es el primer <b class=\"tw\">regreso</b> que veo en tres semanas."}, {"word": "la vuelta", "en": "return; turn; lap; walk; change (money)", "rank": 800, "es": "Bienvenido de **vuelta**.", "en_sentence": "Welcome back.", "hook": "Noun of volver. Estar de vuelta = to be back; dar una vuelta = to go for a walk; ida y vuelta = round trip; la vuelta al mundo = around the world. One of the busiest nouns in the language.", "es_html": "Bienvenido de <b class=\"tw\">vuelta</b>."}, {"word": "la estancia", "en": "stay, period spent somewhere; ranch (Argentina)", "rank": 2200, "es": "Fue una **estancia** larga.", "en_sentence": "It was a long stay.", "hook": "From estar: the time you are somewhere. Estancia de tres noches = three-night stay. In Argentina and Uruguay an estancia is a big ranch. Not stance.", "es_html": "Fue una <b class=\"tw\">estancia</b> larga."}, {"word": "lejano", "en": "distant, far-off, remote", "rank": 1800, "es": "Una ciudad **lejana** cuyo nombre nadie sabe pronunciar.", "en_sentence": "A distant city whose name nobody can pronounce.", "hook": "Adjective of lejos. Alejar, which you know, pushes something away; lejano describes what is already far. Un pariente lejano = a distant relative; el Lejano Oeste = the Far West.", "es_html": "Una ciudad <b class=\"tw\">lejana</b> cuyo nombre nadie sabe pronunciar."}], "review": ["alejar", "la maleta", "el sendero", "ajeno", "el puesto"], "cloze": [{"es": "No hubo ___: el tren salía en cinco minutos y ella ya iba dentro.", "answer": "despedida", "en": "There was no farewell: the train was leaving in five minutes and she was already inside.", "cue": "farewell, goodbye, send-off", "lemma": "la despedida", "options": ["despedida", "estancia", "lejano", "vuelta"], "es_html": "No hubo <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span>: el tren salía en cinco minutos y ella ya iba dentro."}, {"es": "Cuando subió el alquiler, tuvieron que ___ a un barrio más barato.", "answer": "mudarse", "en": "When the rent went up, they had to move to a cheaper neighbourhood.", "support": "el barrio = neighbourhood", "cue": "to move house", "lemma": "mudarse", "options": ["despedida", "estancia", "lejano", "mudarse"], "es_html": "Cuando subió el alquiler, tuvieron que <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> a un barrio más barato."}, {"es": "Su ___ al pueblo sorprendió a todos; nadie vuelve.", "answer": "regreso", "alt": ["vuelta"], "en": "His return to the village surprised everyone; nobody comes back.", "cue": "return, coming back", "lemma": "el regreso", "options": ["despedida", "mudarse", "vuelta", "regreso"], "es_html": "Su <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> al pueblo sorprendió a todos; nadie vuelve."}, {"es": "Compró un billete de ida y ___.", "answer": "vuelta", "en": "He bought a round-trip ticket.", "support": "el billete = ticket", "cue": "return; turn; lap; walk; change (money)", "lemma": "la vuelta", "options": ["estancia", "lejano", "vuelta", "mudarse"], "es_html": "Compró un billete de ida y <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span>."}, {"es": "Durante su ___ en el hospital, nadie fue a verlo.", "answer": "estancia", "en": "During his stay in the hospital, nobody went to see him.", "cue": "stay, period spent somewhere; ranch (Argentina)", "lemma": "la estancia", "options": ["vuelta", "estancia", "regreso", "despedida"], "es_html": "Durante su <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> en el hospital, nadie fue a verlo."}, {"es": "Aquel ruido venía de un lugar ___, más allá de los cerros.", "answer": "lejano", "en": "That noise came from a distant place, beyond the hills.", "support": "el cerro = hill", "cue": "distant, far-off, remote", "lemma": "lejano", "options": ["lejano", "regreso", "vuelta", "despedida"], "es_html": "Aquel ruido venía de un lugar <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span>, más allá de los cerros."}], "review_cards": [{"word": "alejar", "en": "to move away, to distance", "rank": 2400, "es": "Se **alejó** del grupo sin decir nada.", "en_sentence": "She moved away from the group without saying anything.", "hook": "Built on 'lejos', which you know. Usually reflexive. Missed on first exposure in session 1, before the app separated introduction from review. Not a real lapse. · alejarse de — to move away from · lejos — far (root)", "kind": "review", "box": 4, "es_html": "Se <b class=\"tw\">alejó</b> del grupo sin decir nada."}, {"word" deja gratis. —Este pueblo no **merece** que lo dejen morir —dice—. Pero tampoco merece que lo salven por lástima.", "Le pregunto si nota alguna *mejora*. Se ríe. —En el **fondo** del cajón hay teléfonos de gente que ya no vive aquí. Los arreglé y no volvieron a buscarlos. Eso te dice cómo van las cosas."], "glosses": ["el local = premises", "el sindicato = union", "el soldador = soldering iron", "la competencia = competition", "la lástima = pity"], "translation": ["Tomás is twenty-three and fixes phones in the old union hall, which nobody has used since the closure. His only resource is a table, a soldering iron and an internet connection that drops twice a day.", "\"It's not worth setting up a business here,\" his father told him. He set it up anyway. The advantage, he says, is that he has no competition. And the purpose isn't to get rich: it's not having to leave.", "He makes the most of everything: the parts from old phones, the hours without customers for studying, the empty hall the union lets him have for free. \"This town doesn't deserve to be left to die,\" he says. \"But it doesn't deserve to be saved out of pity either.\"", "I ask him if he notices any improvement. He laughs. \"At the bottom of the drawer there are phones belonging to people who don't live here any more. I fixed them and they never came back for them. That tells you how things are going.\""], "new_words": [{"word": "aprovechar", "en": "to make the most of, to take advantage of, to use well", "rank": 900, "es": "**Aprovecha** todo: las piezas viejas, las horas sin clientes.", "en_sentence": "He makes the most of everything: the old parts, the hours without customers.", "hook": "From provecho, benefit (¡buen provecho! = enjoy your meal). Aprovechar el tiempo = use your time well. Aprovecharse de alguien, with se, is the bad sense: to take advantage of someone.", "es_html": "<b class=\"tw\">Aprovecha</b> todo: las piezas viejas, las horas sin clientes."}, {"word": "valer", "en": "to be worth, vieron a buscarlos. Eso te dice cómo van las cosas."]}, {"n": 10, "title": "Ni siquiera", "passage": ["Es mi última noche. Ramón cierra la estación y nos sentamos fuera, con el termo. Le digo que en la capital hablan del pueblo como de un *fracaso*. Él niega con la cabeza.", "—No es que el pueblo se vacíe, **sino** que se va gastando. **O sea**, no es un golpe: es un desgaste. **Incluso** los que se quedan, como yo, estamos un poco menos cada año.", "Le pregunto por el *riesgo* de quedarse solo. —**Ni siquiera** lo pienso. Delia, **en cambio**, lo piensa por los dos. Me llama todos los domingos, **a pesar de** que no tengo nada nuevo que contarle. Ese es el *vínculo*: llamar aunque no haya noticias.", "Antes de dormir reviso la grabadora. Tengo doce horas de voces. Ramón me pregunta cuál va a ser el *enfoque* de la historia. Le digo que todavía no lo sé. —Mejor —dice—. Los que llegan sabiendo ya el enfoque son los que más daño hacen. El *alcance* de lo que pasó aquí no cabe en una hora de radio."], "glosses": ["negar con la cabeza = to shake one's head", "gastarse = to wear out, to get used up", "el golpe = blow", "el desgaste = wearing down", "el daño = harm"], "translation": ["It's my last night. Ramón closes the station and we sit outside with the thermos. I tell him that in the capital they talk about the town as a failure. He shakes his head.", "\"It's not that the town is emptying, it's that it's wearing away. I mean, it's not a blow: it's a wearing down. Even those of us who stay, like me, are a little less every year.\"", "I ask him about the risk of ending up alone. \"I don't even think about it. Delia, on the other hand, thinks about it for both of us. She calls me every Sunday, even though I have nothing new to tell her. That's the bond: calling even when there's no news.\"", "Before sleeping I check the recorder. I have twelve hours of voices. Ramón asks me what the angle of the story is going to be. I tell him I don't know yet. \"Good,\" he says. \"The  **fracaso**, es un intento.", "en_sentence": "It's not a failure, it's an attempt.", "hook": "Introducida en la lección 7. The noun of fracasar, which you know and which has cost you slot errors: fracasó is the verb, el fracaso is the thing. The -o ending here is the noun, not a past tense.", "kind": "review", "box": 0, "es_html": "No es un <b class=\"tw\">fracaso</b>, es un intento."}], "passage_html": ["Es mi última noche. Ramón cierra la estación y nos sentamos fuera, con el termo. Le digo que en la capital hablan del pueblo como de un <i class=\"rw\">fracaso</i>. Él niega con la cabeza.", "—No es que el pueblo se vacíe, <b class=\"tw\">sino</b> que se va gastando. <b class=\"tw\">O sea</b>, no es un golpe: es un desgaste. <b class=\"tw\">Incluso</b> los que se quedan, como yo, estamos un poco menos cada año.", "Le pregunto por el <i class=\"rw\">riesgo</i> de quedarse solo. —<b class=\"tw\">Ni siquiera</b> lo pienso. Delia, <b class=\"tw\">en cambio</b>, lo piensa por los dos. Me llama todos los domingos, <b class=\"tw\">a pesar de</b> que no tengo nada nuevo que contarle. Ese es el <i class=\"rw\">vínculo</i>: llamar aunque no haya noticias.", "Antes de dormir reviso la grabadora. Tengo doce horas de voces. Ramón me pregunta cuál va a ser el <i class=\"rw\">enfoque</i> de la historia. Le digo que todavía no lo sé. —Mejor —dice—. Los que llegan sabiendo ya el enfoque son los que más daño hacen. El <i class=\"rw\">alcance</i> de lo que pasó aquí no cabe en una hora de radio."]}, {"n": 11, "title": "El turno de noche", "passage": ["Ramón trabaja el **turno** de noche en la estación: de diez a seis. A las tres de la **madrugada** pasa el camión del pan y, después, nadie. —Lo peor no es el sueño —dice—. Lo peor es que *sueles* pensar demasiado.", "Le pregunto cuánto **tarda** en acostumbrarse uno. —Veinte años en la mina, con una *jornada* de noche cada dos semanas. Ya no sé dormir de otra manera. Tiene media hora de **descanso**, que usa para fumar en la puerta y mirar la carretera vacía.", "A las cuatro y media aparece un coche con **prisa**: un hombre de traje que paga sin bajar la ventanilla y se va. —Ese *acude* a la capital a algo que no quiere contar —dice Ramón—. Aquí nadie tiene prisa a esta hora, salvo los que se escapan de algo.", "**De repente** se va la luz del surtidor. Ramón ni se mueve: —Pasa todas las noches a la misma hora. Vuelve sola. Esperamos. Vuelve. Me mira como diciendo que ese es todo el *empleo*: esperar a que las cosas vuelvan solas."], "glosses": ["el camión = truck", "acostumbrarse = to get used to it", "el traje = suit", "la ventanilla = car window", "salvo = except", "el surtidor = gas pump"], "translation": ["Ramón works the night shift at the station: ten to six. At three in the morning the bread truck comes by and, after that, nobody. \"The worst part isn't the sleepiness,\" he says. \"The worst part is that you tend to think too much.\"", "I ask how long it takes to get used to it. \"Twenty years in the mine, with a night shift every two weeks. I don't know how to sleep any other way now.\" He gets half an hour's break, which he uses to smoke in the doorway and look at the empty road.", "At half past four a car appears in a hurry: a man in a suit who pays without lowering the window and leaves. \"That one's going to the capital for something he doesn't want to talk about,\" Ramón says. \"Nobody here is in a hurry at this hour, except the ones running from something.\"", "Suddenly the pump's light goes out. Ramón doesn't even move: \"Happens every night at the same time. It comes back on its own.\" We wait. It comes back. He looks at me as if to say that's the whole job: waiting for things to come back on their own."], "new_words": [{"word": "el turno", "en": "shift; turn", "rank": 1800, "es": "Ramón trabaja el **turno** de noche en la estación.", "en_sentence": "Ramón works the night shift at the station.", "hook": "Same root as 'turn': your turn in a line is tu turno, and a work shift is t rase; nothing to do with repent. Repente on its own is never used. A synonym you will meet: de pronto.", "es_html": "<b class=\"tw\">De repente</b> se va la luz del surtidor."}], "review": ["la jornada", "el empleo", "soler", "acudir"], "cloze": [{"es": "Mi ___ empieza a las seis y acaba cuando llega el siguiente.", "answer": "turno", "en": "My shift starts at six and ends when the next person arrives.", "cue": "shift; turn", "lemma": "el turno", "options": ["turno", "tardó", "de repente", "prisa"], "es_html": "Mi <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> empieza a las seis y acaba cuando llega el siguiente."}, {"es": "El autobús salió de ___, antes de que abrieran el puesto.", "answer": "madrugada", "en": "The bus left in the small hours, before the stall opened.", "cue": "the early hours, the small hours (between midnight and dawn)", "lemma": "la madrugada", "options": ["madrugada", "descanso", "prisa", "tardó"], "es_html": "El autobús salió de <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span>, antes de que abrieran el puesto."}, {"es": "El tren ___ dos horas en llegar y nadie dijo nada.", "answer": "tardó", "en": "The train took two hours to arrive and nobody said a word.", "cue": "to take (time); to be slow, to be late", "lemma": "tardar", "options": ["tardó", "prisa", "de repente", "descanso"], "es_html": "El tren <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> dos horas en llegar y nadie dijo nada."}, {"es": "Después de cuatro horas sin ___, se sentó en el suelo.", "answer": "descanso", "en": "After four hours without a break, he sat down on the floor.", "cue": "rest, break", "lemma": "el descanso", "options": ["tardó", "prisa", "turno", "descanso"], "es_html": "Después de cuatro horas sin <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span>, se sentó en el suelo."}, {"es": "No tengo ___: el último autobús ya se fue.", "answer": "prisa", "en": "I'm in no hurry: the last bus already left.", "cue": "hurry, haste", "lemma": "la prisa", "options": [ ento</b> hay un cartel de hace diez años."}, {"word": "la fábrica", "en": "factory", "rank": 1700, "es": "«Aquí se construirá una **fábrica** de piezas para automóviles».", "en_sentence": "\"A car-parts factory will be built here.\"", "hook": "False friend: not fabric. Fabric is la tela. Fabricar = to manufacture; English fabricate once simply meant to build.", "es_html": "«Aquí se construirá una <b class=\"tw\">fábrica</b> de piezas para automóviles»."}, {"word": "el alcalde", "en": "mayor", "rank": 1600, "es": "El **alcalde**, don Aurelio, me recibe en un despacho con dos sillas.", "en_sentence": "The mayor, don Aurelio, receives me in an office with two chairs.", "hook": "From Arabic al-qadi, the judge. La alcaldesa for a woman. No relation to alcanzar, despite the look.", "es_html": "El <b class=\"tw\">alcalde</b>, don Aurelio, me recibe en un despacho con dos sillas."}, {"word": "la promesa", "en": "promise", "rank": 1500, "es": "—La **promesa** era de la empresa, no mía.", "en_sentence": "\"The promise was the company's, not mine.\"", "hook": "Prometer = to promise; cumplir una promesa = to keep one. Near-cognate, but the stress is pro-ME-sa, and it's the verb people fail to recognize.", "es_html": "—La <b class=\"tw\">promesa</b> era de la empresa, no mía."}, {"word": "el terreno", "en": "land, plot; ground, terrain", "rank": 1500, "es": "Nosotros cedimos el **terreno**.", "en_sentence": "We handed over the land.", "hook": "Wider than terrain: a plot you build on, the ground under your feet, and figuratively a field — en el terreno político. Un terreno = a piece of land for sale.", "es_html": "Nosotros cedimos el <b class=\"tw\">terreno</b>."}, {"word": "la vivienda", "en": "housing; dwelling, home", "rank": 1600, "es": "Revisa solicitudes de **vivienda**.", "en_sentence": "He goes through housing applications.", "hook": "From vivir. The administrative word for a home: la casa is the building, la vivienda is the place-you-live as a category. El problema de la vivienda = the housing problem.", "es_html": "Revisa solicitudes de <b class=\"tw\">vivienda</b>."}], "review": ["el funcionario", "la solicitud", "el plazo", "el propósito"], "cloze": [{"es": "Para pedir el certificado hay que ir al ___ antes de las dos.", "answer": "ayuntamiento", "en": "To request the certificate you have to go to the town hall before two.", "cue": "town hall; town council", "lemma": "el ayuntamiento", "options": ["vivienda", "ayuntamiento", "promesa", "terreno"], "es_html": "Para pedir el certificado hay que ir al <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> antes de las dos."}, {"es": "La ___ cerró y medio pueblo se quedó sin trabajo.", "answer": "fábrica", "en": "The factory closed and half the town was left without work.", "cue": "factory", "lemma": "la fábrica", "options": ["fábrica", "alcalde", "ayuntamiento", "promesa"], "es_html": "La <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> cerró y medio pueblo se quedó sin trabajo."}, {"es": "El ___ prometió una carretera nueva y después perdió las elecciones.", "answer": "alcalde", "en": "The mayor promised a new road and then lost the election.", "cue": "mayor", "lemma": "el alcalde", "options": ["terreno", "promesa", "ayuntamiento", "alcalde"], "es_html": "El <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> prometió una carretera nueva y después perdió las elecciones."}, {"es": "Me hizo una ___ y no la cumplió.", "answer": "promesa", "en": "He made me a promise and didn't keep it.", "cue": "promise", "lemma": "la promesa", "options": ["alcalde", "terreno", "vivienda", "promesa"], "es_html": "Me hizo una <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> y no la cumplió."}, {"es": "Compraron un ___ junto al río para construir una casa.", "answer": "terreno", "en": "They bought a plot by the river to build a house.", "cue": "land, plot; ground, terrain", "lemma": "el terreno", "options": ["ayuntamiento", "fábrica", "promesa", "terreno"], "es_html": "Compraron un <span class=\"gap
