=\"rw\">solicitudes</i> de <b class=\"tw\">vivienda</b>: veinte familias piden casa en un pueblo del que todos se van.", "Al salir, el terreno de la fábrica está detrás del ayuntamiento: un campo con una valla y un perro. El perro sí tiene trabajo."]}, {"n": 13, "title": "Comprobar", "passage": ["Antes de escribir nada quiero **comprobar** lo que me contó Ramón: que las máquinas salieron de noche, sin aviso. En el archivo del periódico de la capital busco la fecha.", "Encuentro una nota de tres líneas: «La empresa retira maquinaria por mantenimiento». Es la versión oficial. No **demuestra** nada, pero tampoco la *sospecha* de Ramón. Para *averiguar* más tendría que hablar con la empresa, y la empresa ya no existe.", "Llamo a un antiguo capataz. Al principio *finge* no acordarse. Después admite que lo supo tres días antes. —No **mentí** —dice—. Solo no lo dije. Le contesto que una **mentira** también puede ser un silencio, y cuelga.", "Vuelvo a la estación y se lo cuento a Ramón. Él escucha sin sorpresa. —Me **equivoqué** en una cosa —dice—. Pensé que nadie lo sabía. En lo demás, **acerté**: nos *engañaron* a todos, y lo hicieron con tiempo."], "glosses": ["el archivo = archive", "retirar = to withdraw, remove", "la maquinaria = machinery", "el mantenimiento = maintenance", "el capataz = foreman", "acordarse = to remember", "colgar = to hang up"], "translation": ["Before writing anything I want to check what Ramón told me: that the machines left at night, without notice. In the archive of the capital's newspaper I look for the date.", "I find a three-line item: \"Company withdraws machinery for maintenance.\" That's the official version. It proves nothing, but neither does Ramón's suspicion. To find out more I'd have to talk to the company, and the company no longer exists.", "I call a former foreman. At first he pretends not to remember. Then he admits he knew three days beforehand. \"I didn't lie,\" he says. \"I just didn't say it.\" I reply that a lie can also be a silence, and he hangs up.", "I go back to the station and tell Ramón. He listens without surprise. \"I was wrong about one thing,\" he says. \"I thought nobody knew. On the rest, I was right: they fooled all of us, and they did it with time to spare.\""], "new_words": [{"word": "comprobar", "en": "to check, to verify, to confirm", "rank": 1300, "es": "Antes de escribir nada quiero **comprobar** lo que me contó Ramón.", "en_sentence": "Before writing anything I want to check what Ramón told me.", "hook": "Com + probar: to put to the test. Checking that something is true — not proving it to others, which is demostrar. Averiguar is finding out what you don't yet know; comprobar is confirming what you were told.", "es_html": "Antes de escribir nada quiero <b class=\"tw\">comprobar</b> lo que me contó Ramón."}, {"word": "demostrar", "en": "to prove; to demonstrate, to show", "rank": 1000, "es": "No **demuestra** nada.", "en_sentence": "It proves nothing.", "hook": "Stem changes: demuestro, demuestra. Stronger than mostrar (to show): showing so that it is established. Una demostración is a proof or a product demo — a protest is una manifestación.", "es_html": "No <b class=\"tw\">demuestra</b> nada."}, {"word": "la mentira", "en": "lie", "rank": 1500, "es": "Una **mentira** también puede ser un silencio.", "en_sentence": "A lie can also be a silence.", "hook": "Parece mentira = it's hard to believe. Una mentira piadosa = a white lie. The person is un mentiroso.", "es_html": "Una <b class=\"tw\">mentira</b> también puede ser un silencio."}, {"word": "mentir", "en": "to lie (tell an untruth)", "rank": 1600, "es": "—No **mentí** —dice—. Solo no lo dije.", "en_sentence": "\"I didn't lie,\" he says. \"I just didn't say it.\"", "hook": "Stem changes: miento, mientes; preterite mentí, mintió. Only this sense — lying down is acostarse or estar tumbado. Compare engañar (to deceive, by any means) and fingir (to pretend).", "es_html": "—No <b class=\"tw\">mentí</b> —dice—. Solo no lo dije."}, {"word": "equivocarse", "en": "to be wrong, to make a mistake", "rank": 1800, "es": "Me **equivoqué** en una cosa.", "en_sentence": "I was wrong about one thing.", "hook": "Reflexive: me equivoco, te equivocas. Equivocarse de + noun = to get the wrong one: me equivoqué de autobús. The noun is una equivocación or, more often, un error.", "es_html": "Me <b class=\"tw\">equivoqué</b> en una cosa."}, {"word": "acertar", "en": "to get right, to guess right, to hit the mark", "rank": 2000, "es": "En lo demás, **acerté**.", "en_sentence": "On the rest, I was right.", "hook": "Stem changes: acierto, aciertas. The opposite of equivocarse. From cierto (certain). Un acierto = a good call; acertar con = to hit on the right one.", "es_html": "En lo demás, <b class=\"tw\">acerté</b>."}], "review": ["averiguar", "engañar", "fingir", "la sospecha"], "cloze": [{"es": "Antes de salir, ___ que la puerta estuviera cerrada.", "answer": "comprobé", "en": "Before leaving, I checked that the door was locked.", "cue": "to check, to verify, to confirm", "lemma": "comprobar", "options": ["equivocarse", "comprobé", "mientas", "mentira"], "es_html": "Antes de salir, <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> que la puerta estuviera cerrada."}, {"es": "Nadie pudo ___ que él estuviera allí esa noche.", "answer": "demostrar", "en": "Nobody could prove he was there that night.", "cue": "to prove; to demonstrate, to show", "lemma": "demostrar", "options": ["equivocarse", "mentira", "acertó", "demostrar"], "es_html": "Nadie pudo <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> que él estuviera allí esa noche."}, {"es": "Le dijo que estaba bien, pero era ___.", "answer": "mentira", "en": "She told him she was fine, but it was a lie.", "cue": "lie", "lemma": "la mentira", "options": ["demostrar", "acertó", "mientas", "mentira"], "es_html": "Le dijo que estaba bien, pero era <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span>."}, {"es": "Si te preguntan, no ___: di que no sabes.", "answer": "mientas", "en": "If they ask you, don't lie: say you don't know.", "cue": "to lie (tell an untruth)", "lemma": "mentir", "options": ["equivocarse", "mentira", "mientas", "comprobé"], "es_html": "Si te preguntan, no <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span>: di que no sabes."}, {"es": "Es fácil ___ de puerta: todas son iguales.", "answer": "equivocarse", "en": "It's easy to get the wrong door: they're all the same.", "cue": "to be wrong, to make a mistake", "lemma": "equivocarse", "options": ["equivocarse", "mentira", "mientas", "demostrar"], "es_html": "Es fácil <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> de puerta: todas son iguales."}, {"es": "No sabía la respuesta, pero ___ por casualidad.", "answer": "acertó", "en": "He didn't know the answer, but got it right by chance.", "support": "por casualidad = by chance", "cue": "to get right, to guess right, to hit the mark", "lemma": "acertar", "options": ["demostrar", "acertó", "equivocarse", "comprobé"], "es_html": "No sabía la respuesta, pero <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> por casualidad."}], "review_cards": [{"word": "averiguar", "en": "to find out, to check (by looking into it)", "rank": 1800, "es": "Tomás lo **averiguó** en veinte minutos.", "en_sentence": "Tomás found it out in twenty minutes.", "hook": "Introducida en la lección 6. Averiguar is active: you go and look. Contains verum, truth, as in verify. Voy a averiguarlo = I'll find out. Spelling: averigüé, with the two dots.", "kind": "review", "box": 0, "es_html": "Tomás lo <b class=\"tw\">averiguó</b> en veinte minutos."}, {"word": "engañar", "en": "to deceive, to cheat, to fool", "rank": 1700, "es": "Nadie sabe si quería **engañar** a alguien.", "en_sentence": "Nobody knows whether he wanted to cheat someone.", "hook": "Introducida en la lección 6. El engaño = the deception. Engañarse = to fool yourself. Las apariencias engañan = appearances deceive. No relation to ganar.", "kind": "review", "box": 0, "es_html": "Nadie sabe si quería <b class=\"tw\">engañar</b> a alguien."}, {"word": "fingir", "en": "to pretend, to feign", "rank": 2000, "es": "**Finge** que no sabe que las galerías están inundadas.", "en_sentence": "He's pretending he doesn't know the tunnels are flooded.", "hook": "Introducida en la lección 6. This is the real word for pretend. Pretender, which you have, is to intend or to claim: a false friend. Finge que duerme = he pretends to be asleep. Spelling: finjo, finge.", "kind": "review", "box": 0, "es_html": "<b class=\"tw\">Finge</b> que no sabe que las galerías están inundadas."}, {"word": "la sospecha", "en": "suspicion", "rank": 2300, "es": "Queda la **sospecha**, que en este pueblo es lo que más dura.", "en_sentence": "The suspicion remains, which in this town is the thing that lasts longest.", "hook": "Introducida en la lección 6. Sospechar = to suspect; sospechoso = suspicious, or a suspect. Bajo sospecha = under suspicion.", "kind": "review", "box": 0, "es_html": "Queda la <b class=\"tw\">sospecha</b>, que en este pueblo es lo que más dura."}], "passage_html": ["Antes de escribir nada quiero <b class=\"tw\">comprobar</b> lo que me contó Ramón: que las máquinas salieron de noche, sin aviso. En el archivo del periódico de la capital busco la fecha.", "Encuentro una nota de tres líneas: «La empresa retira maquinaria por mantenimiento». Es la versión oficial. No <b class=\"tw\">demuestra</b> nada, pero tampoco la <i class=\"rw\">sospecha</i> de Ramón. Para <i class=\"rw\">averiguar</i> más tendría que hablar con la empresa, y la empresa ya no existe.", "Llamo a un antiguo capataz. Al principio <i class=\"rw\">finge</i> no acordarse. Después admite que lo supo tres días antes. —No <b class=\"tw\">mentí</b> —dice—. Solo no lo dije. Le contesto que una <b class=\"tw\">mentira</b> también puede ser un silencio, y cuelga.", "Vuelvo a la estación y se lo cuento a Ramón. Él escucha sin sorpresa. —Me <b class=\"tw\">equivoqué</b> en una cosa —dice—. Pensé que nadie lo sabía. En lo demás, <b class=\"tw\">acerté</b>: nos <i class=\"rw\">engañaron</i> a todos, y lo hicieron con tiempo."]}, {"n": 14, "title": "La culpa", "passage": ["Doscientos mineros pusieron una **demanda** contra la empresa. Marisol guarda la copia en una caja de zapatos, con la *firma* de su marido en la última página. —El **juicio** duró tres años —dice—. Perdimos.", "El juez no **condenó** a nadie: la empresa había *cumplido* la ley, dijo, porque la ley no *exigía* avisar. —Entonces la **culpa** es de la ley —dice Marisol—. Y a la ley no se la puede llevar a juicio.", "Pregunto si alguien recibió **castigo**. Se ríe. —El castigo fue para nosotros: tres años esperando. Después de eso, nadie en el pueblo volvió a poner una **queja** por nada. Ni por el agua, ni por la luz.", "Un *testigo* del juicio, un ingeniero jubilado, me dice por teléfono que él declaró la verdad y que no sirvió de nada. —La verdad no era el asunto —dice—. El asunto era quién pagaba a los abogados."], "glosses": ["la caja de zapatos = shoebox", "jubilado = retired", "declarar = to testify", "el abogado = lawyer"], "translation": ["Two hundred miners filed a lawsuit against the company. Marisol keeps the copy in a shoebox, with her husband's signature on the last page. \"The trial lasted three years,\" she says. \"We lost.\"", "The judge convicted nobody: the company had complied with the law, he said, because the law didn't require giving notice. \"Then the law is to blame,\" Marisol says. \"And you can't take the law to court.\"", "I ask whether anyone was punished. She laughs. \"The punishment was ours: three years of waiting.\" After that, nobody in the town ever filed a complaint about anything again. Not about the water, not about the electricity.", "A witness from the trial, a retired engineer, tells me by phone that he testified to the truth and it did no good. \"The truth wasn't the issue,\" he says. \"The issue was who was paying the lawyers.\""], "new_words": [{"word": "la demanda", "en": "lawsuit; demand (for goods)", "rank": 1300, "es": "Doscientos mineros pusieron una **demanda** contra la empresa.", "en_sentence": "Two hundred miners filed a lawsuit against the company.", "hook": "Two senses, neither quite the English one: poner una demanda = to sue; la oferta y la demanda = supply and demand. A demand you make of someone is una exigencia, from exigir.", "es_html": "Doscientos mineros pusieron una <b class=\"tw\">demanda</b> contra la empresa."}, {"word": "el juicio", "en": "trial; judgment, (good) sense", "rank": 1200, "es": "El **juicio** duró tres años.", "en_sentence": "The trial lasted three years.", "hook": "Llevar a juicio = to take to court. Also judgment as a faculty: a mi juicio = in my judgment; perder el juicio = to lose one's mind. The judge is el juez.", "es_html": "El <b class=\"tw\">juicio</b> duró tres años."}, {"word": "condenar", "en": "to sentence, to convict; to condemn", "rank": 1700, "es": "El juez no **condenó** a nadie.", "en_sentence": "The judge convicted nobody.", "hook": "In court it is verdict and sentence in one: lo condenaron a tres años. Outside court, to condemn. Una condena = a sentence, the time served.", "es_html": "El juez no <b class=\"tw\">condenó</b> a nadie."}, {"word": "la culpa", "en": "fault, blame; guilt", "rank": 1300, "es": "Entonces la **culpa** es de la ley.", "en_sentence": "Then the law is to blame.", "hook": "Spanish treats blame as a possession: la culpa es mía = it's my fault; tener la culpa = to be to blame; echar la culpa a = to blame. Guilt the feeling is also culpa; the guilty one is el culpable.", "es_html": "Entonces la <b class=\"tw\">culpa</b> es de la ley."}, {"word": "el castigo", "en": "punishment", "rank": 2200, "es": "Pregunto si alguien recibió **castigo**.", "en_sentence": "I ask whether anyone was punished.", "hook": "Castigar = to punish; same root as chastise. Un castigo is also anything you have to put up with: este calor es un castigo.", "es_html": "Pregunto si alguien recibió <b class=\"tw\">castigo</b>."}, {"word": "la queja", "en": "complaint", "rank": 1800, "es": "Nadie en el pueblo volvió a poner una **queja** por nada.", "en_sentence": "Nobody in the town ever filed a complaint about anything again.", "hook": "Quejarse de = to complain about; poner una queja = to file one. The sound is one too: un quejido = a moan. No relation to querer.", "es_html": "Nadie en el pueblo volvió a poner una <b class=\"tw\">queja</b> por nada."}], "review": ["exigir", "la firma", "cumplir", "el testigo"], "cloze": [{"es": "El vecino presentó una ___ por el ruido y perdió.", "answer": "demanda", "en": "The neighbor filed a lawsuit over the noise and lost.", "support": "el ruido = noise", "cue": "lawsuit; demand (for goods)", "lemma": "la demanda", "options": ["juicio", "castigo", "demanda", "queja"], "es_html": "El vecino presentó una <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> por el ruido y perdió."}, {"es": "El ___ es el lunes y ella será la primera en declarar.", "answer": "juicio", "en": "The trial is on Monday and she'll be the first to testify.", "support": "declarar = to testify", "cue": "trial; judgment, (good) sense", "lemma": "el juicio", "options": ["condenaron", "juicio", "castigo", "queja"], "es_html": "El <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> es el lunes y ella será la primera en declarar."}, {"es": "Lo ___ a dos años por un robo que no cometió.", "answer": "condenaron", "en": "They sentenced him to two years for a robbery he didn't commit.", "support": "el robo = robbery", "cue": "to sentence, to convict; to condemn", "lemma": "condenar", "options": ["castigo", "queja", "demanda", "condenaron"], "es_html": "Lo <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> a dos años por un robo que no cometió."}, {"es": "No fue ___ tuya: el tren salió antes de hora.", "answer": "culpa", "en": "It wasn't your fault: the train left early.", "cue": "fault, blame; guilt", "lemma": "la culpa", "options": ["demanda", "culpa", "juicio", "castigo"], "es_html": "No fue <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> tuya: el tren salió antes de hora."}, {"es": "Como ___, el niño se quedó sin salir el sábado.", "answer": "castigo", "en": "As punishment, the boy wasn't allowed out on Saturday.", "cue": "punishment", "lemma": "el castigo", "options": ["culpa", "castigo", "queja", "condenaron"], "es_html": "Como <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span>, el niño se quedó sin salir el sábado."}, {"es": "Escribió una ___ y nunca le contestaron.", "answer": "queja", "en": "She wrote a complaint and they never answered her.", "cue": "complaint", "lemma": "la queja", "options": ["demanda", "queja", "culpa", "juicio"], "es_html": "Escribió una <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> y nunca le contestaron."}], "review_cards": [{"word": "exigir", "en": "to demand, to require", "rank": 1300, "es": "Los vecinos **exigieron** una respuesta por escrito.", "en_sentence": "The neighbors demanded an answer in writing.", "hook": "Sweep 0012 miss: answered 'made'. 0014 miss: 'stopped' — that is impedir, a KNOWN word. Second case of interference from inside the deck (after alcance→amenaza). Rule 8 says a contrast set: exigir/impedir. 0016 MISS: 'expects' — same answer as 0015. Stable wrong neighbour now, not interference from impedir. exigir is a demand with force behind it; esperar is expecting. 0017 HIT: 'demanded'. Hovered «espera», «nadie», «pague», «empresa» — leaned on the esperar clause. Right answer, supported retrieval. Next review should drop the contrast so the word stands alone. · exigir que + subjunctive · la exigencia — demand", "kind": "review", "box": 2, "es_html": "Los vecinos <b class=\"tw\">exigieron</b> una respuesta por escrito."}, {"word": "la firma", "en": "signature; firm, company", "rank": 1900, "es": "La **firma** del propietario del terreno.", "en_sentence": "The landowner's signature.", "hook": "Introducida en la lección 5. Firmar = to sign. In business prose la firma is also a company (una firma alemana). Both from firm, made solid: a signature makes a document firm.", "kind": "review", "box": 0, "es_html": "La <b class=\"tw\">firma</b> del propietario del terreno."}, {"word": "cumplir", "en": "to fulfil, to carry out, to meet (a requirement); to turn (an age)", "rank": 700, "es": "Que **cumpla** con el procedimiento, señor.", "en_sentence": "That you comply with the procedure, sir.", "hook": "Introducida en la lección 5. Cumplir una promesa = to keep a promise; cumplir con = to comply with; cumplir años = to have a birthday; cumplir treinta = to turn thirty. Incumplir = to breach.", "kind": "review", "box": 0, "es_html": "Que <b class=\"tw\">cumpla</b> con el procedimiento, señor."}, {"word": "el testigo", "en": "witness", "rank": 2000, "es": "Yo fui **testigo** de cómo se llevaron las máquinas.", "en_sentence": "I witnessed how they took the machines away.", "hook": "Introducida en la lección 1. Same root as testify and testimony. Ser testigo de = to witness. The form is the same for a woman: la testigo.", "kind": "review", "box": 0, "es_html": "Yo fui <b class=\"tw\">testigo</b> de cómo se llevaron las máquinas."}], "passage_html": ["Doscientos mineros pusieron una <b class=\"tw\">demanda</b> contra la empresa. Marisol guarda la copia en una caja de zapatos, con la <i class=\"rw\">firma</i> de su marido en la última página. —El <b class=\"tw\">juicio</b> duró tres años —dice—. Perdimos.", "El juez no <b class=\"tw\">condenó</b> a nadie: la empresa había <i class=\"rw\">cumplido</i> la ley, dijo, porque la ley no <i class=\"rw\">exigía</i> avisar. —Entonces la <b class=\"tw\">culpa</b> es de la ley —dice Marisol—. Y a la ley no se la puede llevar a juicio.", "Pregunto si alguien recibió <b class=\"tw\">castigo</b>. Se ríe. —El castigo fue para nosotros: tres años esperando. Después de eso, nadie en el pueblo volvió a poner una <b class=\"tw\">queja</b> por nada. Ni por el agua, ni por la luz.", "Un <i class=\"rw\">testigo</i> del juicio, un ingeniero jubilado, me dice por teléfono que él declaró la verdad y que no sirvió de nada. —La verdad no era el asunto —dice—. El asunto era quién pagaba a los abogados."]}, {"n": 15, "title": "La casa sin número", "passage": ["Hay un hombre en el pueblo del que nadie habla. Debe dinero a medio valle y vive en una casa sin número, al final de la cuesta. Me dicen que se **esconde**. Ramón lo corrige: —No se esconde. Se *oculta*. Esconderse es de niños.", "Subo. La puerta está abierta. El hombre, Benito, no **huye**: me ofrece café. —Ya nadie me **persigue** —dice—. Al principio venían, gritaban, dejaban cartas. Después se cansaron. La *amenaza* más grande era que no se cansaran nunca.", "Le pregunto por qué no se fue del pueblo, como Delia. —Para irse hay que **atreverse**, y yo nunca me atreví a nada. Por eso debo dinero: le **confié** mis ahorros a un amigo, y el amigo sí se atrevió.", "Al bajar me cruzo con una mujer que sube con una bolsa de pan. Me mira y mira la casa. Siento **vergüenza** sin saber de quién. En este pueblo todo el mundo se *entera* de todo, pero nadie dice nada: ese es el *riesgo* de que te conozcan."], "glosses": ["el valle = valley", "la cuesta = slope, hill", "gritar = to shout", "cansarse = to get tired", "los ahorros = savings", "cruzarse con = to run into"], "translation": ["There's a man in the town nobody talks about. He owes money to half the valley and lives in a house with no number, at the top of the hill. They tell me he's hiding. Ramón corrects it: \"He's not hiding. He's keeping out of sight. Hiding is for children.\"", "I walk up. The door is open. The man, Benito, doesn't run: he offers me coffee. \"Nobody chases me anymore,\" he says. \"At first they came, shouted, left letters. Then they got tired. The biggest threat was that they'd never get tired.\"", "I ask why he didn't leave town, like Delia. \"To leave you have to dare, and I never dared to do anything. That's why I owe money: I entrusted my savings to a friend, and the friend did dare.\"", "On the way down I run into a woman walking up with a bag of bread. She looks at me and looks at the house. I feel ashamed without knowing on whose behalf. In this town everybody finds out everything, but nobody says anything: that's the risk of being known."], "new_words": [{"word": "esconder", "en": "to hide (something, or oneself)", "rank": 1800, "es": "Me dicen que se **esconde**.", "en_sentence": "They tell me he's hiding.", "hook": "The everyday word: esconder las llaves, esconderse detrás de la puerta. Ocultar is the same act in a graver register — ocultar la verdad, ocultar pruebas. El escondite = hiding place, and the children's game.", "es_html": "Me dicen que se <b class=\"tw\">esconde</b>."}, {"word": "huir", "en": "to flee, to run away", "rank": 1600, "es": "Benito no **huye**: me ofrece café.", "en_sentence": "Benito doesn't run: he offers me coffee.", "hook": "Irregular: huyo, huyes, huye; preterite huyó. Huir de = to flee from. Same family as English 'fugitive'; la huida = the escape.", "es_html": "Benito no <b class=\"tw\">huye</b>: me ofrece café."}, {"word": "perseguir", "en": "to chase, to pursue; to persecute", "rank": 1800, "es": "—Ya nadie me **persigue**.", "en_sentence": "\"Nobody chases me anymore.\"", "hook": "Per + seguir: to follow all the way. Conjugates like seguir: persigo, persigue. Covers a dog after a car, a debt collector, and a state persecuting people. La persecución.", "es_html": "—Ya nadie me <b class=\"tw\">persigue</b>."}, {"word": "atreverse", "en": "to dare", "rank": 2000, "es": "Para irse hay que **atreverse**.", "en_sentence": "To leave you have to dare.", "hook": "Always reflexive: me atrevo, se atrevió. Atreverse a + infinitive. Atrevido = daring, cheeky. ¿Cómo te atreves? = how dare you.", "es_html": "Para irse hay que <b class=\"tw\">atreverse</b>."}, {"word": "confiar", "en": "to trust; to entrust; to be confident", "rank": 1300, "es": "Le **confié** mis ahorros a un amigo.", "en_sentence": "I entrusted my savings to a friend.", "hook": "Confiar en alguien = to trust someone; confiar algo a alguien = to entrust something to them. Accent on the i: confío, confías. La confianza = trust; de confianza = trusted.", "es_html": "Le <b class=\"tw\">confié</b> mis ahorros a un amigo."}, {"word": "la vergüenza", "en": "shame, embarrassment", "rank": 1700, "es": "Siento **vergüenza** sin saber de quién.", "en_sentence": "I feel ashamed without knowing on whose behalf.", "hook": "Tener vergüenza = to be embarrassed; dar vergüenza = to make someone embarrassed: me da vergüenza. ¡Qué vergüenza! = how embarrassing. The dots on the ü mean the u is sounded.", "es_html": "Siento <b class=\"tw\">vergüenza</b> sin saber de quién."}], "review": ["ocultar", "la amenaza", "el riesgo", "enterarse"], "cloze": [{"es": "El perro ___ los huesos debajo de la cama.", "answer": "esconde", "en": "The dog hides the bones under the bed.", "support": "el hueso = bone", "cue": "to hide (something, or oneself)", "lemma": "esconder", "options": ["esconde", "perseguir", "confíes", "huir"], "es_html": "El perro <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> los huesos debajo de la cama."}, {"es": "Pensó en ___, pero no tenía adónde.", "answer": "huir", "en": "He thought about running away, but had nowhere to go.", "cue": "to flee, to run away", "lemma": "huir", "options": ["huir", "confíes", "esconde", "atreverse"], "es_html": "Pensó en <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span>, pero no tenía adónde."}, {"es": "Dejaron de ___ al ladrón cuando cruzó el río.", "answer": "perseguir", "en": "They stopped chasing the thief when he crossed the river.", "support": "el ladrón = thief", "cue": "to chase, to pursue; to persecute", "lemma": "perseguir", "options": ["perseguir", "huir", "vergüenza", "esconde"], "es_html": "Dejaron de <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> al ladrón cuando cruzó el río."}, {"es": "Hay que ___ a preguntar, aunque dé miedo.", "answer": "atreverse", "en": "You have to dare to ask, even if it's scary.", "cue": "to dare", "lemma": "atreverse", "options": ["atreverse", "vergüenza", "esconde", "perseguir"], "es_html": "Hay que <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> a preguntar, aunque dé miedo."}, {"es": "No ___ en nadie que te pida dinero el primer día.", "answer": "confíes", "en": "Don't trust anyone who asks you for money on the first day.", "cue": "to trust; to entrust; to be confident", "lemma": "confiar", "options": ["perseguir", "esconde", "huir", "confíes"], "es_html": "No <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> en nadie que te pida dinero el primer día."}, {"es": "Me dio ___ pedirle dinero otra vez.", "answer": "vergüenza", "en": "I was embarrassed to ask him for money again.", "cue": "shame, embarrassment", "lemma": "la vergüenza", "options": ["esconde", "vergüenza", "huir", "perseguir"], "es_html": "Me dio <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> pedirle dinero otra vez."}], "review_cards": [{"word": "ocultar", "en": "to hide, to conceal (something)", "rank": 1500, "es": "Solo **ocultaba** un negocio que no le salió.", "en_sentence": "He was just hiding a deal that didn't work out.", "hook": "Introducida en la lección 6. Occult shares the root: hidden. Ocultar is the formal cousin of esconder, and it hides facts and feelings more than objects. Oculto = hidden.", "kind": "review", "box": 0, "es_html": "Solo <b class=\"tw\">ocultaba</b> un negocio que no le salió."}, {"word": "la amenaza", "en": "threat", "rank": 2200, "es": "La sequía es una **amenaza** para los cultivos.", "en_sentence": "The drought is a threat to the crops.", "hook": "Missed on first exposure in session 1, before the app separated introduction from review. Not a real lapse. 0014: 'threat' — correct, box 3 after four lapses. Also disambiguated from alcance on the same page. · amenazar con — to threaten to · bajo amenaza — under threat", "kind": "review", "box": 3, "es_html": "La sequía es una <b class=\"tw\">amenaza</b> para los cultivos."}, {"word": "el riesgo", "en": "risk", "rank": 1500, "es": "No vale la pena correr ese **riesgo**.", "en_sentence": "That risk isn't worth taking.", "hook": "You 'run' a risk in Spanish, not 'take' it. Missed on first exposure in session 1, before the app separated introduction from review. Not a real lapse. · correr un riesgo — to take a risk · a riesgo de — at the risk of", "kind": "review", "box": 4, "es_html": "No vale la pena correr ese <b class=\"tw\">riesgo</b>."}, {"word": "enterarse", "en": "to find out, to learn of (the news reaches you)", "rank": 1500, "es": "La gente se **entera** de que la empresa no existe.", "en_sentence": "People find out that the company doesn't exist.", "hook": "Introducida en la lección 6. The passive twin of averiguar: the news arrives and you become aware. Me enteré ayer = I found out yesterday. ¿Te enteras? = do you get it? Always with de.", "kind": "review", "box": 0, "es_html": "La gente se <b class=\"tw\">entera</b> de que la empresa no existe."}], "passage_html": ["Hay un hombre en el pueblo del que nadie habla. Debe dinero a medio valle y vive en una casa sin número, al final de la cuesta. Me dicen que se <b class=\"tw\">esconde</b>. Ramón lo corrige: —No se esconde. Se <i class=\"rw\">oculta</i>. Esconderse es de niños.", "Subo. La puerta está abierta. El hombre, Benito, no <b class=\"tw\">huye</b>: me ofrece café. —Ya nadie me <b class=\"tw\">persigue</b> —dice—. Al principio venían, gritaban, dejaban cartas. Después se cansaron. La <i class=\"rw\">amenaza</i> más grande era que no se cansaran nunca.", "Le pregunto por qué no se fue del pueblo, como Delia. —Para irse hay que <b class=\"tw\">atreverse</b>, y yo nunca me atreví a nada. Por eso debo dinero: le <b class=\"tw\">confié</b> mis ahorros a un amigo, y el amigo sí se atrevió.", "Al bajar me cruzo con una mujer que sube con una bolsa de pan. Me mira y mira la casa. Siento <b class=\"tw\">vergüenza</b> sin saber de quién. En este pueblo todo el mundo se <i class=\"rw\">entera</i> de todo, pero nadie dice nada: ese es el <i class=\"rw\">riesgo</i> de que te conozcan."]}, {"n": 16, "title": "El alquiler", "passage": ["Marisol paga **alquiler** por el *puesto*: ochenta al mes, al **dueño** de la terminal, que vive en la capital y no viene nunca. —Nos **cobra** como si esto fuera una ciudad —dice—. Y yo vendo café a gente que ya no viene.", "Sus *ingresos* son *escasos*, pero las cuentas no bajan: el alquiler, la luz y los **impuestos**, que se pagan aunque no haya **ganancia**. —El año pasado gané trescientos. El ayuntamiento quiso su parte igual.", "Durante un tiempo tuvo un **socio**: un primo que ponía la mitad del alquiler y venía los fines de semana. El primo se fue a trabajar al norte. —Ahora el socio soy yo —dice—. Y uno de los dos siempre *falta*.", "Le pregunto por qué sigue. Señala la terminal con la barbilla: el autobús de las seis, dos pasajeros, el chófer que compra un café sin hablar. —Porque si cierro, el que viene no tiene dónde esperar. Y porque el dueño, si no cobra, vende. Y si vende, esto lo tiran."], "glosses": ["la cuenta = bill", "la mitad = half", "la barbilla = chin", "el pasajero = passenger", "el chófer = driver", "tirar (aquí) = to tear down"], "translation": ["Marisol pays rent for the stall: eighty a month, to the owner of the terminal, who lives in the capital and never comes. \"He charges us as if this were a city,\" she says. \"And I sell coffee to people who don't come anymore.\"", "Her income is scant, but the bills don't shrink: the rent, the electricity and the taxes, which get paid even when there's no profit. \"Last year I made three hundred. The town hall wanted its share all the same.\"", "For a while she had a partner: a cousin who put up half the rent and came on weekends. The cousin went north to work. \"Now I'm the partner,\" she says. \"And one of the two is always missing.\"", "I ask why she keeps going. She points at the terminal with her chin: the six o'clock bus, two passengers, the driver buying a coffee without a word. \"Because if I close, whoever comes has nowhere to wait. And because if the owner doesn't collect, he sells. And if he sells, they tear this down.\""], "new_words": [{"word": "el alquiler", "en": "rent; rental", "rank": 2200, "es": "Marisol paga **alquiler** por el puesto.", "en_sentence": "Marisol pays rent for the stall.", "hook": "Alquilar = to rent, in both directions, landlord and tenant. Se alquila = for rent. Latin America often says la renta, rentar. From Arabic al-kirā', the hire.", "es_html": "Marisol paga <b class=\"tw\">alquiler</b> por el puesto."}, {"word": "el dueño", "en": "owner", "rank": 900, "es": "Al **dueño** de la terminal, que vive en la capital.", "en_sentence": "To the owner of the terminal, who lives in the capital.", "hook": "From Latin dominus, like 'domain'. La dueña for a woman. Ser dueño de = to own; dueño de sí mismo = in control of oneself. El propietario is the formal word.", "es_html": "Al <b class=\"tw\">dueño</b> de la terminal, que vive en la capital."}, {"word": "cobrar", "en": "to charge; to collect (money owed); to get paid", "rank": 1300, "es": "—Nos **cobra** como si esto fuera una ciudad.", "en_sentence": "\"He charges us as if this were a city.\"", "hook": "Money moving toward the speaker. ¿Cuánto cobras? = how much do you charge, or what do you earn. Cobrar un cheque = to cash it. The opposite direction is pagar.", "es_html": "—Nos <b class=\"tw\">cobra</b> como si esto fuera una ciudad."}, {"word": "el impuesto", "en": "tax", "rank": 1700, "es": "El alquiler, la luz y los **impuestos**.", "en_sentence": "The rent, the electricity and the taxes.", "hook": "Literally 'imposed': the past participle of imponer. Impuesto sobre la renta = income tax; libre de impuestos = tax-free.", "es_html": "El alquiler, la luz y los <b class=\"tw\">impuestos</b>."}, {"word": "la ganancia", "en": "profit, gain, earnings", "rank": 2300, "es": "Los impuestos se pagan aunque no haya **ganancia**.", "en_sentence": "Taxes get paid even when there's no profit.", "hook": "From ganar (to win, to earn). Ganancias y pérdidas = profits and losses. El beneficio is the accountant's word; ganancia is what the stall-holder calls it.", "es_html": "Los impuestos se pagan aunque no haya <b class=\"tw\">ganancia</b>."}, {"word": "el socio", "en": "partner (business); member (of a club)", "rank": 1900, "es": "Durante un tiempo tuvo un **socio**.", "en_sentence": "For a while she had a partner.", "hook": "A business partner or a club member: socio del club. Not a romantic partner — that is la pareja. Same root as sociedad and 'associate'.", "es_html": "Durante un tiempo tuvo un <b class=\"tw\">socio</b>."}], "review": ["el ingreso", "escaso", "el puesto", "faltar"], "cloze": [{"es": "El ___ sube cada enero y el sueldo no.", "answer": "alquiler", "en": "The rent goes up every January and wages don't.", "support": "el sueldo = wage", "cue": "rent; rental", "lemma": "el alquiler", "options": ["cobró", "alquiler", "impuestos", "socio"], "es_html": "El <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> sube cada enero y el sueldo no."}, {"es": "El ___ del bar cierra los lunes para descansar.", "answer": "dueño", "en": "The bar's owner closes on Mondays to rest.", "cue": "owner", "lemma": "el dueño", "options": ["ganancia", "alquiler", "socio", "dueño"], "es_html": "El <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> del bar cierra los lunes para descansar."}, {"es": "Por arreglar la puerta me ___ cincuenta, sin factura.", "answer": "cobró", "en": "For fixing the door he charged me fifty, no invoice.", "support": "la factura = invoice", "cue": "to charge; to collect (money owed); to get paid", "lemma": "cobrar", "options": ["socio", "cobró", "impuestos", "ganancia"], "es_html": "Por arreglar la puerta me <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> cincuenta, sin factura."}, {"es": "Los ___ se pagan en abril, haya trabajo o no.", "answer": "impuestos", "en": "Taxes are paid in April, work or no work.", "cue": "tax", "lemma": "el impuesto", "options": ["ganancia", "impuestos", "cobró", "dueño"], "es_html": "Los <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> se pagan en abril, haya trabajo o no."}, {"es": "Vendió la casa con una ___ pequeña y se fue.", "answer": "ganancia", "en": "He sold the house for a small profit and left.", "cue": "profit, gain, earnings", "lemma": "la ganancia", "options": ["cobró", "ganancia", "socio", "alquiler"], "es_html": "Vendió la casa con una <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> pequeña y se fue."}, {"es": "Su ___ puso el dinero; ella puso las horas.", "answer": "socio", "en": "Her partner put in the money; she put in the hours.", "cue": "partner (business); member (of a club)", "lemma": "el socio", "options": ["impuestos", "dueño", "alquiler", "socio"], "es_html": "Su <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> puso el dinero; ella puso las horas."}], "review_cards": [{"word": "el ingreso", "en": "income, entry, admission", "rank": 2000, "es": "Sus **ingresos** apenas cubren el alquiler.", "en_sentence": "Their income barely covers the rent.", "hook": "Plural for money, singular for entry/admission. Missed on first exposure in session 1, before the app separated introduction from review. Not a real lapse. 0014: 'incomes' — correct, box 3. · los ingresos — income, earnings (usually plural) · ingresar — to deposit, to enter", "kind": "review", "box": 3, "es_html": "Sus <b class=\"tw\">ingresos</b> apenas cubren el alquiler."}, {"word": "escaso", "en": "scarce, scant, barely any", "rank": 1900, "es": "El agua era **escasa** en aquella región.", "en_sentence": "Water was scarce in that region.", "hook": "Missed on first exposure in session 1, before the app separated introduction from review. Not a real lapse. 0014: 'scarce' — correct, box 3 after three lapses. · escasear — to be in short supply · i>.", "Le pregunto por qué sigue. Señala la terminal con la barbilla: el autobús de las seis, dos pasajeros, el chófer que compra un café sin hablar. —Porque si cierro, el que viene no tiene dónde esperar. Y porque el dueño, si no cobra, vende. Y si vende, esto lo tiran."]}, {"n": 17, "title": "El incendio", "passage": ["El **taller** de Tomás se **quemó** un martes de agosto. Lo cuenta él mismo, delante de lo que queda: cuatro paredes negras y un coche sin ruedas. —Fue un *suceso* —dice, con la palabra del periódico—. Así lo llamaron.", "El **incendio** empezó a las dos de la tarde. Primero *surgió* el **humo** por la ventana de atrás; después, la gente. —Vinieron a mirar, no a ayudar. A ayudar vino Ramón, con el extintor de la estación. Lo **apagamos** entre los dos, y los bomberos llegaron a las cuatro.", "El **daño** lo calcula en treinta mil. El seguro dice que le *advirtieron* de que la instalación eléctrica era vieja y que, por tanto, no pagan. —Me avisaron, sí. Y yo les dije que no tenía con qué cambiarla. Esa carta también la tengo.", "Le pregunto qué va a hacer. Mira el coche sin ruedas. —Este lo arreglo. Es de un cliente, y el cliente no sabía nada. Después, ya veremos. Es una *señal*, dice, pero todavía no sabe de qué."], "glosses": ["la rueda = wheel", "el extintor = fire extinguisher", "los bomberos = firefighters", "el seguro = insurance", "la instalación eléctrica = wiring", "arreglar = to fix"], "translation": ["Tomás's workshop burned down one Tuesday in August. He tells it himself, in front of what's left: four black walls and a car with no wheels. \"It was an incident,\" he says, using the newspaper's word. \"That's what they called it.\"", "The fire started at two in the afternoon. First the smoke came out of the back window; then the people. \"They came to watch, not to help. Ramón came to help, with the extinguisher from the station.\" The two of them put it out, and the firefighters arrived at four.", "He puts the damage at thirty thousand. The insurer says they warned him the wiring was old and that, therefore, they won't pay. \"They warned me, yes. And I told them I had nothing to replace it with. I've got that letter too.\"", "I ask what he's going to do. He looks at the car with no wheels. \"This one I'll fix. It belongs to a customer, and the customer knew nothing. After that, we'll see.\" It's a sign, he says, but he doesn't yet know of what."], "new_words": [{"word": "el taller", "en": "workshop; garage (mechanic's)", "rank": 1700, "es": "El **taller** de Tomás se quemó un martes de agosto.", "en_sentence": "Tomás's workshop burned down one Tuesday in August.", "hook": "Same word as French atelier. A mechanic's garage, a carpenter's shop and a training workshop are all un taller. The garage you park in is el garaje.", "es_html": "El <b class=\"tw\">taller</b> de Tomás se quemó un martes de agosto."}, {"word": "quemar", "en": "to burn", "rank": 1600, "es": "El taller de Tomás se **quemó**.", "en_sentence": "Tomás's workshop burned down.", "hook": "Quemar = to burn something; quemarse = to burn down, or to burn yourself. Una quemadura = a burn. Estar quemado = to be burned out.", "es_html": "El taller de Tomás se <b class=\"tw\">quemó</b>."}, {"word": "el incendio", "en": "fire (a blaze; a building or forest fire)", "rank": 1900, "es": "El **incendio** empezó a las dos de la tarde.", "en_sentence": "The fire started at two in the afternoon.", "hook": "Not fuego. El fuego is the element and a campfire; un incendio is a fire as an event, a building or hillside burning. Incendio forestal = wildfire. Same root as incendiary.", "es_html": "El <b class=\"tw\">incendio</b> empezó a las dos de la tarde."}, {"word": "el humo", "en": "smoke", "rank": 2000, "es": "Primero surgió el **humo** por la ventana de atrás.", "en_sentence": "First the smoke came out of the back window.", "hook": "Humo with an h, but fumar is to smoke a cigarette, and English 'fume' is the same root. Hay humo = there's smoke; echar humo = to fume, to be furious.", "es_html": "Primero surgió el <b class=\"tw\">humo</b> por la ventana de atrás."}, {"word": "apagar", "en": "to put out (a fire); to switch off", "rank": 1500, "es": "Lo **apagamos** entre los dos.", "en_sentence": "The two of us put it out.", "hook": "One verb for fire, lights, phones and engines: apagar la luz, apagar el móvil. The opposite is encender. Apagarse = to go out on its own: se apagó la luz.", "es_html": "Lo <b class=\"tw\">apagamos</b> entre los dos."}, {"word": "el daño", "en": "damage, harm", "rank": 1200, "es": "El **daño** lo calcula en treinta mil.", "en_sentence": "He puts the damage at thirty thousand.", "hook": "Hacer daño = to hurt: me hace daño el zapato. Daños y perjuicios = damages, in court. Dañar = to damage. Not danger — that is el peligro.", "es_html": "El <b class=\"tw\">daño</b> lo calcula en treinta mil."}], "review": ["el suceso", "surgir", "advertir", "la señal"], "cloze": [{"es": "Llevó la moto al ___ y le dijeron que no tenía arreglo.", "answer": "taller", "en": "He took the motorbike to the garage and they told him it couldn't be fixed.", "support": "tener arreglo = to be fixable", "cue": "workshop; garage (mechanic's)", "lemma": "el taller", "options": ["quemó", "taller", "humo", "daño"], "es_html": "Llevó la moto al <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> y le dijeron que no tenía arreglo."}, {"es": "Se me ___ la cena mientras hablaba por teléfono.", "answer": "quemó", "en": "My dinner burned while I was on the phone.", "cue": "to burn", "lemma": "quemar", "options": ["quemó", "apaga", "taller", "humo"], "es_html": "Se me <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> la cena mientras hablaba por teléfono."}, {"es": "El ___ del monte se vio desde la carretera.", "answer": "incendio", "en": "The fire on the hill could be seen from the road.", "support": "el monte = hill", "cue": "fire (a blaze; a building or forest fire)", "lemma": "el incendio", "options": ["incendio", "humo", "da —Vinieron a mirar, no a ayudar. A ayudar vino Ramón, con el extintor de la estación. Lo <b class=\"tw\">apagamos</b> entre los dos, y los bomberos llegaron a las cuatro.", "El <b class=\"tw\">daño</b> lo calcula en treinta mil. El seguro dice que le <i class=\"rw\">advirtieron</i> de que la instalación eléctrica era vieja y que, por tanto, no pagan. —Me avisaron, sí. Y yo les dije que no tenía con qué cambiarla. Esa carta también la tengo.", "Le pregunto qué va a hacer. Mira el coche sin ruedas. —Este lo arreglo. Es de un cliente, y el cliente no sabía nada. Después, ya veremos. Es una <i class=\"rw\">señal</i>, dice, pero todavía no sabe de qué."]}, {"n": 18, "title": "Fijarse", "passage": ["Un reportaje se hace **fijándose** en lo que la gente no mira. Me lo dijo un viejo redactor, y en este pueblo se cumple: nadie *destaca* nada porque todo lleva años igual.", "Entonces me fijo yo. En el **polvo** de la estación, que es gris y no marrón: polvo de mina, dice Ramón, que sigue bajando del cerro con el viento. En el **rincón** de la terminal donde Marisol guarda las sillas de los que ya no vienen. En el **vacío** de la calle principal a las cinco de la tarde.", "Y en los **gestos**. Ramón *señala* siempre con la barbilla, nunca con la mano: en la mina, dice, las manos estaban ocupadas. Marisol cuenta el cambio dos veces. Benito mira la puerta cada vez que oye un coche.", "Al **borde** del pueblo hay una *muestra* de lo que fue: la boca de la mina, cerrada con una reja. Alguien ha dejado flores de plástico. Nadie sabe quién. Es el único *rasgo* del lugar que no tiene explicación, y por eso es el que más me interesa."], "glosses": ["el reportaje = feature story", "el redactor = editor", "el cerro = hill", "el cambio (aquí) = change, coins", "la boca de la mina = the mine entrance", "la reja = iron grille"], "translation": ["A feature story is made by noticing what people don't look at. An old editor told me that, and in this town it holds: nobody points anything out because everything has been the same for years.", "So I do the noticing. The dust at the station, which is grey, not brown: mine dust, Ramón says, still blowing down off the hill with the wind. The corner of the terminal where Marisol keeps the chairs of the people who no longer come. The emptiness of the main street at five in the afternoon.", "And the gestures. Ramón always points with his chin, never with his hand: in the mine, he says, your hands were busy. Marisol counts the change twice. Benito looks at the door every time he hears a car.", "At the edge of the town there's a sample of what it was: the mouth of the mine, closed off with an iron grille. Someone has left plastic flowers. Nobody knows who. It's the only feature of the place with no explanation, and that's why it's the one that interests me most."], "new_words": [{"word": "fijarse", "en": "to notice, to pay attention, to look closely", "rank": 1700, "es": "Un reportaje se hace **fijándose** en lo que la gente no mira.", "en_sentence": "A feature story is made by noticing what people don't look at.", "hook": "Fijarse en = to notice, to look at closely. ¡Fíjate! = look at that, would you believe it. Non-reflexive fijar = to fix, to set: fijar una fecha. Darse cuenta is realizing; fijarse is looking.", "es_html": "Un reportaje se hace <b class=\"tw\">fijándose</b> en lo que la gente no mira."}, {"word": "el polvo", "en": "dust; powder", "rank": 1800, "es": "En el **polvo** de la estación, que es gris y no marrón.", "en_sentence": "The dust at the station, which is grey, not brown.", "hook": "Dust on a shelf and powder in a tin are both polvo. Hecho polvo = worn out, wrecked. Not pollo (chicken): one letter apart, and people do mix them up out loud.", "es_html": "En el <b class=\"tw\">polvo</b> de la estación, que es gris y no marrón."}, {"word": "el rincón", "en": "corner (inside a room), nook", "rank": 1800, "es": "En el **rincón** de la terminal donde Marisol guarda las sillas.", "en_sentence": "The c
