enos a la gente. El pueblo, no. Y la capital no es un lugar *lejano*, pero desde aquí lo parece.", "Le pregunto por el **ánimo**. Se ríe como Marisol, y entiendo de dónde viene esa risa. —Hay días. Pero tengo una **esperanza** con fecha: un título en dos años. Allí la esperanza era un autobús que se iba. —¿Te *mudarías* otra vez? —Ya me mudé una vez. Con eso basta.", "Antes de colgar le pregunto qué **recuerdo** se llevó. —El de la *despedida*. Ramón no fue a la terminal; me dejó una nota en la estación. Luego me pide un favor: que no escriba que se fue por **orgullo**. —Me fui por cansancio. El orgullo lo tengo ahora, que vuelvo con algo. Marisol guarda el teléfono en el delantal. Ese *regreso* es el tema de todos los domingos, y todavía no ocurre."], "glosses": ["el aparato = device (here, the phone)", "la risa = laughter", "el título = degree, diploma", "colgar = to hang up", "el cansancio = tiredness", "el delantal = apron"], "translation": ["Delia calls Marisol on Sundays. I'm at the stall when the phone rings and Marisol hands me the thing without asking: \"Talk to her. She's a journalist, she wants to know why you left.\"", "Delia lives in the capital, cleans offices at night and studies by day. \"It was Ramón who gave me the advice,\" she says. \"Go, there's nothing here, and don't come back until there is something.\" I ask whether she misses the town. \"I miss the people. The town, no. And the capital isn't a faraway place, but from here it looks like one.\"", "I ask how her spirits are. She laughs like Marisol, and I understand where that laugh comes from. \"There are days. But I have a hope with a date on it: a degree in two years. Back there, hope was a bus leaving.\" \"Would you move again?\" \"I already moved once. That's enough.\"", "Before hanging up I ask what memory she took with her. \"The goodbye. Ramón didn't come to the terminal; he left me a note at the station.\" Then she asks me a favor: not to write that she left out of pride. \"I left out of tiredness. The pride I have now, coming back with something.\" Marisol puts the phone away in her apron. That return is the subject every Sunday, and it still hasn't happened."], "new_words": [{"word": "el consejo", "en": "advice, a piece of advice; council", "rank": 1400, "es": "El **consejo** me lo dio Ramón.", "en_sentence": "It was Ramón who gave me the advice.", "hook": "Un consejo = one piece of advice; English advice has no plural, Spanish does: dar consejos. Aconsejar = to advise. Capitalized it's a council: el Consejo de Ministros.", "es_html": "El <b class=\"tw\">consejo</b> me lo dio Ramón."}, {"word": "echar de menos", "en": "to miss (someone, something)", "rank": 2000, "es": "Le pregunto si **echa de menos** el pueblo.", "en_sentence": "I ask whether she misses the town.", "hook": "Three words acting as one verb; only echar conjugates: echo de menos, echaba de menos. Takes a before people: echo de menos a mi hermana. Latin America says extrañar. Nothing to do with 'less' — it's feeling the lack.", "es_html": "Le pregunto si <b class=\"tw\">echa de menos</b> el pueblo."}, {"word": "el ánimo", "en": "spirits, mood; encouragement", "rank": 1700, "es": "Le pregunto por el **ánimo**.", "en_sentence": "I ask how her spirits are.", "hook": "Estado de ánimo = mood, state of mind. ¡Ánimo! = chin up, you can do it. Dar ánimos = to encourage. Same root as 'animate': the spirit that moves you.", "es_html": "Le pregunto por el <b class=\"tw\">ánimo</b>."}, {"word": "la esperanza", "en": "hope", "rank": 1200, "es": "Tengo una **esperanza** con fecha.", "en_sentence": "I have a hope with a date on it.", "hook": "Esperar is both to wait and to hope; the noun esperanza is only hope. Esperanza de vida = life expectancy. The waiting noun is la espera.", "es_html": "Tengo una <b class=\"tw\">esperanza</b> con fecha."}, {"word": "el recuerdo", "en": "memory (a specific one); souvenir; (pl.) regards", "rank": 1100, "es": "Le pregunto qué **recuerdo** se llevó.", "en_sentence": "I ask what memory she took with her.", "hook": "A memory you have, not the faculty — that is la memoria. Recordar = to remember. Also a souvenir, and in the plural, regards: recuerdos a tu madre.", "es_html": "Le pregunto qué <b class=\"tw\">recuerdo</b> se llevó."}, {"word": "el orgullo", "en": "pride", "rank": 1900, "es": "Que no escriba que se fue por **orgullo**.", "en_sentence": "That I shouldn't write she left out of pride.", "hook": "Orgulloso = proud, in both the good sense and the stubborn one: estoy orgulloso de ti; es demasiado orgulloso para pedir ayuda.", "es_html": "Que no escriba que se fue por <b class=\"tw\">orgullo</b>."}], "review": ["la despedida", "el regreso", "mudarse", "lejano"], "cloze": [{"es": "Te doy un ___: no firmes nada hoy.", "answer": "consejo", "en": "I'll give you a piece of advice: don't sign anything today.", "cue": "advice, a piece of advice; council", "lemma": "el consejo", "options": ["ánimo", "echo de menos", "consejo", "esperanza"], "es_html": "Te doy un <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span>: no firmes nada hoy."}, {"es": "___ los inviernos de allí, aunque eran duros.", "answer": "echo de menos", "en": "I miss the winters there, even though they were hard.", "cue": "to miss (someone, something)", "lemma": "echar de menos", "options": ["echo de menos", "orgullo", "recuerdo", "ánimo"], "es_html": "<span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> los inviernos de allí, aunque eran duros."}, {"es": "Después de la llamada se quedó sin ___ para seguir.", "answer": "ánimo", "en": "After the call she had no spirit left to carry on.", "cue": "spirits, mood; encouragement", "lemma": "el ánimo", "options": ["orgullo", "ánimo", "recuerdo", "esperanza"], "es_html": "Después de la llamada se quedó sin <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> para seguir."}, {"es": "La ___ de encontrar trabajo la trajo a la ciudad.", "answer": "esperanza", "en": "The hope of finding work brought her to the city.", "cue": "hope", "lemma": "la esperanza", "options": ["ánimo", "orgullo", "echo de menos", "esperanza"], "es_html": "La <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> de encontrar trabajo la trajo a la ciudad."}, {"es": "No tengo ningún ___ de mi abuelo; murió antes de que yo naciera.", "answer": "recuerdo", "en": "I have no memory of my grandfather; he died before I was born.", "cue": "memory (a specific one); souvenir; (pl.) regards", "lemma": "el recuerdo", "options": ["esperanza", "ánimo", "orgullo", "recuerdo"], "es_html": "No tengo ningún <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> de mi abuelo; murió antes de que yo naciera."}, {"es": "Por ___ no pidió ayuda, y así le fue.", "answer": "orgullo", "en": "Out of pride he didn't ask for help, and look where it got him.", "cue": "pride", "lemma": "el orgullo", "options": ["esperanza", "echo de menos", "orgullo", "consejo"], "es_html": "Por <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> no pidió ayuda, y así le fue."}], "review_cards": [{"word": "la despedida", "en": "farewell, goodbye, send-off", "rank": 2000, "es": "La **despedida** es corta.", "en_sentence": "The farewell is short.", "hook": "Introducida en la lección 8. Noun of despedirse, from lesson 2. Fiesta de despedida = leaving party; despedida de soltero = stag party. Despedir also fires you; that noun is el despido.", "kind": "review", "box": 0, "es_html": "La <b class=\"tw\">despedida</b> es corta."}, {"word": "el regreso", "en": "return, coming back", "rank": 1700, "es": "Es el primer **regreso** que veo en tres semanas.", "en_sentence": "He is the first return I've seen in three weeks.", "hook": "Introducida en la lección 8. Regresar = to go back, the everyday Latin American word where Spain says volver. Regress went sour in English; el regreso is neutral. De regreso = on the way back.", "kind": "review", "box": 0, "es_html": "Es el primer <b class=\"tw\">regreso</b> que veo en tres semanas."}, {"word": "mudarse", "en": "to move house", "rank": 2000, "es": "**Mudarse** a la capital cuesta lo que cuesta un coche usado.", "en_sentence": "Moving to the capital costs what a second-hand car costs.", "hook": "Introducida en la lección 8. Mudar alone = to change, to shed (a snake muda la piel). Mudarse de casa = to move house; la mudanza = the move, and the removals van. Not mover, which moves objects.", "kind": "review", "box": 0, "es_html": "<b class=\"tw\">Mudarse</b> a la capital cuesta lo que cuesta un coche usado."}, {"word": "lejano", "en": "distant, far-off, remote", "rank": 1800, "es": "Una ciudad **lejana** cuyo nombre nadie sabe pronunciar.", "en_sentence": "A distant city whose name nobody can pronounce.", "hook": "Introducida en la lección 8. Adjective of lejos. Alejar, which you know, pushes something away; lejano describes what is already far. Un pariente lejano = a distant relative; el Lejano Oeste = the Far West.", "kind": "review", "box": 0, "es_html": "Una ciudad <b class=\"tw\">lejana</b> cuyo nombre nadie sabe pronunciar."}], "passage_html": ["Delia llama a Marisol los domingos. Estoy en el puesto cuando suena el teléfono y Marisol me pasa el aparato sin preguntar: —Habla con ella. Es periodista, quiere saber por qué te fuiste.", "Delia vive en la capital, limpia oficinas de noche y estudia de día. —El <b class=\"tw\">consejo</b> me lo dio Ramón —dice—. Vete, aquí no hay nada, y no vuelvas hasta que haya algo. Le pregunto si <b class=\"tw\">echa de menos</b> el pueblo. —Echo de menos a la gente. El pueblo, no. Y la capital no es un lugar <i class=\"rw\">lejano</i>, pero desde aquí lo parece.", "Le pregunto por el <b class=\"tw\">ánimo</b>. Se ríe como Marisol, y entiendo de dónde viene esa risa. —Hay días. Pero tengo una <b class=\"tw\">esperanza</b> con fecha: un título en dos años. Allí la esperanza era un autobús que se iba. —¿Te <i class=\"rw\">mudarías</i> otra vez? —Ya me mudé una vez. Con eso basta.", "Antes de colgar le pregunto qué <b class=\"tw\">recuerdo</b> se llevó. —El de la <i class=\"rw\">despedida</i>. Ramón no fue a la terminal; me dejó una nota en la estación. Luego me pide un favor: que no escriba que se fue por <b class=\"tw\">orgullo</b>. —Me fui por cansancio. El orgullo lo tengo ahora, que vuelvo con algo. Marisol guarda el teléfono en el delantal. Ese <i class=\"rw\">regreso</i> es el tema de todos los domingos, y todavía no ocurre."]}, {"n": 20, "title": "Mientras tanto", "passage": ["**A lo largo de** tres semanas he hablado con doce personas. Todas dicen que el pueblo se acaba y ninguna se ha ido, salvo Delia. *Incluso* Benito, que tiene motivos, sigue en su casa sin número.", "Ramón lo explica con un ejemplo: —Un pueblo no se acaba de golpe. Se acaba **mientras tanto**: mientras uno espera el autobús, mientras otro arregla un coche. **De vez en cuando** cierra algo, y nadie lo nota hasta que necesita ese algo.", "Le pregunto si es triste. —**Más bien** es lento. Lo triste tiene final. Esto, *en cambio*, sigue. **A lo mejor** mañana abren la fábrica —dice, y se ríe: es la broma del pueblo desde hace diez años.", "Antes de irme, Marisol me da un café que no me cobra. —¿Vas a volver? —**Desde luego** —le digo, *o sea*, lo que dicen todos. *A pesar de* eso, me guarda la silla del rincón. Por si acaso."], "glosses": ["salvo = except", "de golpe = all at once", "la broma = joke", "por si acaso = just in case"], "translation": ["Over three weeks I've talked to twelve people. All of them say the town is finished and none of them has left, except Delia. Even Benito, who has reasons to, is still in his house with no number.", "Ramón explains it with an example: \"A town doesn't end all at once. It ends in the meantime: while one person waits for the bus, while another fixes a car. Now and then something closes, and nobody notices until they need that something.\"", "I ask if it's sad. \"It's more like slow. Sad things have an ending. This, on the other hand, goes on. Maybe tomorrow they'll open the factory,\" he says, and laughs: it's been the town's joke for ten years.", "Before I leave, Marisol gives me a coffee she doesn't charge me for. \"Are you coming back?\" \"Of course,\" I tell her, that is, what everyone says. In spite of that, she keeps the chair in the corner for me. Just in case."], "new_words": [{"word": "a lo largo de", "en": "throughout, over (a period); along", "rank": 1500, "es": "**A lo largo de** tres semanas he hablado con doce personas.", "en_sentence": "Over three weeks I've talked to twelve people.", "hook": "Largo = long, so 'along the length of': a lo largo del río (along the river), a lo largo del día (throughout the day). Largo is a false friend — large is grande.", "es_html": "<b class=\"tw\">A lo largo de</b> tres semanas he hablado con doce personas."}, {"word": "mientras tanto", "en": "meanwhile, in the meantime", "rank": 2000, "es": "Se acaba **mientras tanto**.", "en_sentence": "It ends in the meantime.", "hook": "Mientras alone = while, with a clause after it: mientras espero. Mientras tanto stands on its own at the start of a sentence, like 'meanwhile'. The tanto adds nothing you can translate.", "es_html": "Se acaba <b class=\"tw\">mientras tanto</b>."}, {"word": "de vez en cuando", "en": "from time to time, now and then", "rank": 2200, "es": "**De vez en cuando** cierra algo.", "en_sentence": "Now and then something closes.", "hook": "Literally 'from a time to when'. Fixed; don't swap the words. Its neighbors: a veces (sometimes), a menudo (often), cada vez que (every time that).", "es_html": "<b class=\"tw\">De vez en cuando</b> cierra algo."}, {"word": "más bien", "en": "rather, more like", "rank": 1800, "es": "—**Más bien** es lento.", "en_sentence": "\"It's more like slow.\"", "hook": "Corrects a description: no es triste, más bien es lento. Not 'better' — that is mejor. Think 'more rightly'.", "es_html": "—<b class=\"tw\">Más bien</b> es lento."}, {"word": "a lo mejor", "en": "maybe, perhaps", "rank": 1700, "es": "**A lo mejor** mañana abren la fábrica.", "en_sentence": "Maybe tomorrow they'll open the factory.", "hook": "Looks like 'at best' but means maybe, and it takes the indicative, unlike quizás and tal vez, which usually take the subjunctive. Spoken more than written.", "es_html": "<b class=\"tw\">A lo mejor</b> mañana abren la fábrica."}, {"word": "desde luego", "en": "of course, certainly", "rank": 2000, "es": "—**Desde luego** —le digo.", "en_sentence": "\"Of course,\" I tell her.", "hook": "Nothing to do with 'since then'; luego here keeps an old sense of 'at once'. A firm yes: ¿Vienes? Desde luego. Also used to agree with a complaint: desde luego, qué calor.", "es_html": "—<b class=\"tw\">Desde luego</b> —le digo."}], "review": ["incluso", "en cambio", "a pesar de", "o sea"], "cloze": [{"es": "___ aquel año perdió el trabajo, la casa y el coche, en ese orden.", "answer": "a lo largo de", "en": "Over that year he lost his job, his house and his car, in that order.", "cue": "throughout, over (a period); along", "lemma": "a lo largo de", "options": ["desde luego", "a lo mejor", "a lo largo de", "mientras tanto"], "es_html": "<span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> aquel año perdió el trabajo, la casa y el coche, en ese orden."}, {"es": "Ella estudia; ___, él cuida a los niños.", "answer": "mientras tanto", "en": "She studies; meanwhile, he looks after the kids.", "support": "cuidar = to look after", "cue": "meanwhile, in the meantime", "lemma": "mientras tanto", "options": ["a lo mejor", "desde luego", "a lo largo de", "mientras tanto"], "es_html": "Ella estudia; <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span>, él cuida a los niños."}, {"es": "___ viene un primo de la capital y trae periódicos.", "answer": "de vez en cuando", "en": "Now and then a cousin comes from the capital and brings newspapers.", "cue": "from time to time, now and then", "lemma": "de vez en cuando", "options": ["a lo largo de", "de vez en cuando", "desde luego", "a lo mejor"], "es_html": "<span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> viene un primo de la capital y trae periódicos."}, {"es": "No es que no quiera; ___ no puede.", "answer": "más bien", "en": "It's not that he doesn't want to; it's more that he can't.", "cue": "rather, more like", "lemma": "más bien", "options": ["más bien", "de vez en cuando", "a lo mejor", "a lo largo de"], "es_html": "No es que no quiera; <span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> no puede."}, {"es": "___ llueve esta tarde; el cielo está raro.", "answer": "a lo mejor", "en": "Maybe it'll rain this afternoon; the sky looks odd.", "cue": "maybe, perhaps", "lemma": "a lo mejor", "options": ["mientras tanto", "de vez en cuando", "a lo mejor", "más bien"], "es_html": "<span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span> llueve esta tarde; el cielo está raro."}, {"es": "—¿Me ayudas con las cajas? —___.", "answer": "desde luego", "en": "\"Will you help me with the boxes?\" \"Of course.\"", "cue": "of course, certainly", "lemma": "desde luego", "options": ["a lo largo de", "desde luego", "mientras tanto", "más bien"], "es_html": "—¿Me ayudas con las cajas? —<span class=\"gap\">&nbsp;&nbsp;&nbsp;&nbsp;</span>."}], "review_cards": [{"word": "incluso", "en": "even; including", "rank": 500, "es": "**Incluso** los que se quedan estamos un poco menos cada año.", "en_sentence": "Even those of us who stay are a little less every year.", "hook": "Introducida en la lección 10. The 'even' of surprise: incluso los niños lo saben = even the children know it. From incluir, so also 'including'. Aun (no accent) is the same 'even' in a more formal register.", "kind": "review", "box": 0, "es_html": "<b class=\"tw\">Incluso</b> los que se quedan estamos un poco menos cada año."}, {"word": "en cambio", "en": "on the other hand, whereas, instead", "rank": 1200, "es": "Delia, **en cambio**, lo piensa por los dos.", "en_sentence": "Delia, on the other hand, thinks about it for both of us.", "hook": "Introducida en la lección 10. Literally 'in exchange'. It contrasts two subjects: yo me quedo; ella, en cambio, se fue. A cambio de = in exchange for, a different phrase.", "kind": "review", "box": 0, "es_html": "Delia, <b class=\"tw\">en cambio</b>, lo piensa por los dos."}, {"word": "a pesar de", "en": "despite, in spite of", "rank": 600, "es": "Me llama todos los domingos, **a pesar de** que no tengo nada nuevo.", "en_sentence": "She calls me every Sunday, even though I have nothing new.", "hook": "Introducida en la lección 10. Pesar = to weigh, and as a noun, sorrow. A pesar de = despite the weight of. Before a clause add que: a pesar de que llueve. A pesar de todo = all the same.", "kind": "review", "box": 0, "es_html": "Me llama todos los domingos, <b class=\"tw\">a pesar de</b> que no tengo nada nuevo."}, {"word": "o sea", "en": "that is, I mean, in other words", "rank": 700, "es": "**O sea**, no es un golpe: es un desgaste.", "en_sentence": "I mean, it's not a blow: it's a wearing down.", "hook": "Introducida en la lección 10. Literally 'or be it', the subjunctive of ser. The everyday rephrasing word, the filler of spoken Spanish. Es decir is the same thing in writing. Two words, never osea.", "kind": "review", "box": 0, "es_html": "<b class=\"tw\">O sea</b>, no es un golpe: es un desgaste."}], "passage_html": ["<b class=\"tw\">A lo largo de</b> tres semanas he hablado con doce personas. Todas dicen que el pueblo se acaba y ninguna se ha ido, salvo Delia. <i class=\"rw\">Incluso</i> Benito, que tiene motivos, sigue en su casa sin número.", "Ramón lo explica con un ejemplo: —Un pueblo no se acaba de golpe. Se acaba <b class=\"tw\">mientras tanto</b>: mientras uno espera el autobús, mientras otro arregla un coche. <b class=\"tw\">De vez en cuando</b> cierra algo, y nadie lo nota hasta que necesita ese algo.", "Le pregunto si es triste. —<b class=\"tw\">Más bien</b> es lento. Lo triste tiene final. Esto, <i class=\"rw\">en cambio</i>, sigue. <b class=\"tw\">A lo mejor</b> mañana abren la fábrica —dice, y se ríe: es la broma del pueblo desde hace diez años.", "Antes de irme, Marisol me da un café que no me cobra. —¿Vas a volver? —<b class=\"tw\">Desde luego</b> —le digo, <i class=\"rw\">o sea</i>, lo que dicen todos. <i class=\"rw\">A pesar de</i> eso, me guarda la silla del rincón. Por si acaso."]}], "deck": {"title": "Todas las palabras nuevas", "cards": [{"word": "la entrevista", "en": "interview", "rank": 1400, "es": "Le pido una **entrevista** y él se ríe.", "en_sentence": "I ask him for an interview and he laughs.", "hook": "entre + vista: a seeing-between, two people facing each other. Entrevistar = to interview; el entrevistado = the person interviewed.", "lesson": 1, "kind": "new", "k": "d0", "es_html": "Le pido una <b class=\"tw\">entrevista</b> y él se ríe."}, {"word": "grabar", "en": "to record (audio, video); to engrave", "rank": 1500, "es": "Le pregunto si puedo **grabar**.", "en_sentence": "I ask if I can record.", "hook": "Not 'grab'. It first meant to engrave, cutting a mark into stone; a recording is the same idea on tape. La grabación = the recording.", "lesson": 1, "kind": "new", "k": "d1", "es_html": "Le pregunto si puedo <b class=\"tw\">grabar</b>."}, {"word": "el suceso", "en": "event, incident", "rank": 1800, "es": "El último **suceso** fue el cierre de la mina.", "en_sentence": "The last event was the mine closing.", "hook": "False friend: not success. A suceso is something that happens, often bad; the crime pages of a newspaper are called Sucesos. Success is el éxito.", "lesson": 1, "kind": "new", "k": "d2", "es_html": "El último <b class=\"tw\">suceso</b> fue el cierre de la mina."}, {"word": "el éxito", "en": "success, hit", "rank": 1000, "es": "La mina, mientras duró, fue un **éxito**.", "en_sentence": "The mine, while it lasted, was a success.", "hook": "False friend the other way: not exit. Tener éxito = to succeed; the exit is la salida. Keep éxito and suceso apart: neither means what it looks like.", "lesson": 1, "kind": "new", "k": "d3", "es_html": "La mina, mientras duró, fue un <b class=\"tw\">éxito</b>."}, {"word": "el testigo", "en": "witness", "rank": 2000, "es": "Yo fui **testigo** de cómo se llevaron las máquinas.", "en_sentence": "I witnessed how they took the machines away.", "hook": "Same root as testify and testimony. Ser testigo de = to witness. The form is the same for a woman: la testigo.", "lesson": 1, "kind": "new", "k": "d4", "es_html": "Yo fui <b class=\"tw\">testigo</b> de cómo se llevaron las máquinas."}, {"word": "el relato", "en": "account, story, narrative", "rank": 1800, "es": "Su **relato** no tiene principio ni final.", "en_sentence": "His account has no beginning or end.", "hook": "From relatar, to relate in the old English sense of telling. A relato is an account someone gives; el cuento is a tale that was made up.", "lesson": 1, "kind": "new", "k": "d5", "es_html": "Su <b class=\"tw\">relato</b> no tiene principio ni final."}, {"word": "el puesto", "en": "stall; post, position, job", "rank": 1000, "es": "Marisol tiene un **puesto** de comida junto a la terminal.", "en_sentence": "Marisol has a food stall next to the bus station.", "hook": "From poner: a thing that has been put somewhere. A market stall, a job position (puesto de trabajo), a place in a ranking (primer puesto). Always a spot that is held.", "lesson": 2, "kind": "new", "k": "d6", "es_html": "Marisol tiene un <b class=\"tw\">puesto</b> de comida junto a la terminal."}, {"word": "el empleo", "en": "employment, job; use", "rank": 1000, "es": "Este puesto es mi **empleo** y mi pensión.", "en_sentence": "This stall is my job and my pension.", "hook": "Emplear = to employ, and also to use (emplear el tiempo). El empleo is the fact of having work; el puesto is the particular slot you fill.", "lesson": 2, "kind": "new", "k": "d7", "es_html": "Este puesto es mi <b class=\"tw\">empleo</b> y mi pensión."}, {"word": "el desempleo", "en": "unemployment", "rank": 2100, "es": "Con el **desempleo** que hay, no voy a encontrar otra cosa.", "en_sentence": "With the unemployment there is, I'm not going to find anything else.", "hook": "des + empleo. Latin America says desempleo; Spain says el paro. Un desempleado = an unemployed person.", "lesson": 2, "kind": "new", "k": "d8", "es_html": "Con el <b class=\"tw\">desempleo</b> que hay, no voy a encontrar otra cosa."}, {"word": "el obrero", "en": "worker, labourer", "rank": 1700, "es": "Su marido fue **obrero** en la mina veinte años.", "en_sentence": "Her husband was a labourer in the mine for twenty years.", "hook": "From obra, work in the sense of a built thing. An obrero works with his hands; un trabajador is anyone who works. La clase obrera = the working class.", "lesson": 2, "kind": "new", "k": "d9", "es_html": "Su marido fue <b class=\"tw\">obrero</b> en la mina veinte años."}, {"word": "despedir", "en": "to fire, to dismiss; to see off (despedirse = to say goodbye)", "rank": 1500, "es": "Lo **despidieron** un martes, junto con doscientos más.", "en_sentence": "They fired him on a Tuesday, along with two hundred others.", "hook": "Two meanings, one gesture: sending someone away. Despedir a alguien = to fire them; despedirse de alguien = to say goodbye. Stem changes: despido, despidieron.", "lesson": 2, "kind": "new", "k": "d10", "es_html": "Lo <b class=\"tw\">despidieron</b> un martes, junto con doscientos más."}, {"word": "la jornada", "en": "working day; a day (of an event)", "rank": 1500, "es": "Una **jornada** de doce horas, y vuelve a casa cada quince días.", "en_sentence": "A twelve-hour day, and he comes home every two weeks.", "hook": "Not journal, not quite journey: a day's worth of something. Jornada laboral = working day; media jornada = part-time. Same root as the French journée.", "lesson": 2, "kind": "new", "k": "d11", "es_html": "Una <b class=\"tw\">jornada</b> de doce horas, y vuelve a casa cada quince días."}, {"word": "faltar", "en": "to be missing, to be lacking, to be needed", "rank": 700, "es": "Sobran latas y **falta** leche.", "en_sentence": "There are tins to spare and milk is missing.", "hook": "Backwards from English: the missing thing is the subject. Falta leche = milk is missing; me faltan dos = I'm two short; falta poco = not long now. The noun la falta, lack, is already yours.", "lesson": 3, "kind": "new", "k": "d12", "es_html": "Sobran latas y <b class=\"tw\">falta</b> leche."}, {"word": "sobrar", "en": "to be left over, to be more than enough", "rank": 2000, "es": "**Sobran** latas de sardinas.", "en_sentence": "There are too many tins of sardines.", "hook": "The mirror of faltar. Sobra pan = there's bread to spare; sobra tiempo = plenty of time. Las sobras = leftovers. Sobra decir que… = it goes without saying that…", "lesson": 3, "kind": "new", "k": "d13", "es_html": "<b class=\"tw\">Sobran</b> latas de sardinas."}, {"word": "bastar", "en": "to be enough", "rank": 1600, "es": "Con lo que vendo en un día, **basta** para pagar la luz.", "en_sentence": "What I sell in a day is enough to pay the electricity.", "hook": "¡Basta! = enough! is the same verb. Basta con + infinitive = it's enough to. Bastante, plenty or quite, grows out of it.", "lesson": 3, "kind": "new", "k": "d14", "es_html": "Con lo que vendo en un día, <b class=\"tw\">basta</b> para pagar la luz."}, {"word": "caber", "en": "to fit (inside something)", "rank": 1800, "es": "Las cajas no **caben** en el almacén.", "en_sentence": "The boxes don't fit in the storeroom.", "hook": "Irregular: quepo, cabe, cupo. About fitting into a space, never about clothes fitting a person (that is quedar bien). No cabe duda = there's no room for doubt.", "lesson": 3, "kind": "new", "k": "d15", "es_html": "Las cajas no <b class=\"tw\">caben</b> en el almacén."}, {"word": "el montón", "en": "pile, heap; a lot (un montón de)", "rank": 1500, "es": "Las deja en un **montón** que va creciendo.", "en_sentence": "He leaves them in a pile that keeps growing.", "hook": "From monte, a mountain: a small mountain of stuff. Un montón de gente = loads of people. Very common in speech.", "lesson": 3, "kind": "new", "k": "d16", "es_html": "Las deja en un <b class=\"tw\">montón</b> que va creciendo."}, {"word": "el par", "en": "pair; a couple of (un par de)", "rank": 1100, "es": "Cada semana le llega un **par** de cajas.", "en_sentence": "Every week a couple of boxes arrive.", "hook": "Un par de = a couple of, roughly two, not exactly. Also even numbers: número par vs impar. Sin par = matchless.", "lesson": 3, "kind": "new", "k": "d17", "es_html": "Cada semana le llega un <b class=\"tw\">par</b> de cajas."}, {"word": "soportar", "en": "to put up with, to bear, to stand", "rank": 1500, "es": "No **soporto** la ciudad.", "en_sentence": "I can't stand the city.", "hook": "False friend: not support. It means to bear a weight, so to endure. To support someone is apoyar, which you already have. No soporto a mi jefe = I can't stand my boss.", "lesson": 4, "kind": "new", "k": "d18", "es_html": "No <b class=\"tw\">soporto</b> la ciudad."}, {"word": "aguantar", "en": "to put up with, to hold (out), to withstand", "rank": 1600, "es": "No **aguanto** el ruido ni a la gente.", "en_sentence": "I can't bear the noise or the people.", "hook": "The everyday twin of soportar, a bit more physical: aguantar la respiración = hold your breath; aguanta un poco = hang on a bit. Aguantarse = to put up with it and say nothing.", "lesson": 4, "kind": "new", "k": "d19", "es_html": "No <b class=\"tw\">aguanto</b> el ruido ni a la gente."}, {"word": "rendirse", "en": "to give up, to surrender", "rank": 2000, "es": "Harto sí. Pero **rendirme**, no.", "en_sentence": "Fed up, yes. But giving up, no.", "hook": "Rendir alone = to yield or to perform (el motor rinde poco). With se it turns inward: me rindo = I give up. Stem changes: me rindo, se rindió.", "lesson": 4, "kind": "new", "k": "d20", "es_html": "Harto sí. Pero <b class=\"tw\">rendirme</b>, no."}, {"word": "harto", "en": "fed up (estar harto de)", "rank": 1900, "es": "Le pregunto si no está **harto**.", "en_sentence": "I ask him if he isn't fed up.", "hook": "Estar harto de = to be sick of. Originally full to bursting, from hartar, to stuff with food. In some countries harto also means a lot: harta gente.", "lesson": 4, "kind": "new", "k": "d21", "es_html": "Le pregunto si no está <b class=\"tw\">harto</b>."}, {"word": "el alivio", "en": "relief", "rank": 2300, "es": "Cuando pasa un coche, siento un **alivio** raro.", "en_sentence": "When a car goes by, I feel a strange relief.", "hook": "Aliviar = to lighten, to relieve; alleviate is its English cousin. ¡Qué alivio! = what a relief.", "lesson": 4, "kind": "new", "k": "d22", "es_html": "Cuando pasa un coche, siento un <b class=\"tw\">alivio</b> raro."}, {"word": "la costumbre", "en": "custom, habit", "rank": 1300, "es": "Es una **costumbre** de la época de la mina.", "en_sentence": "It's a habit from the days of the mine.", "hook": "Custom and costume share its Latin root, but costumbre is only the habit. Tener la costumbre de = to be in the habit of; como de costumbre = as usual.", "lesson": 4, "kind": "new", "k": "d23", "es_html": "Es una <b class=\"tw\">costumbre</b> de la época de la mina."}, {"word": "el orden", "en": "order (arrangement, sequence) — la orden = order (command)", "rank": 700, "es": "Es el **orden** de las cosas.", "en_sentence": "It's the order of things.", "hook": "Gender flips the meaning. El orden is arrangement: en orden, por orden alfabético. La orden is a command, or a religious order: dar una orden, cumplir una orden. Both appear in this lesson.", "lesson": 5, "kind": "new", "k": "d24", "es_html": "Es el <b class=\"tw\">orden</b> de las cosas."}, {"word": "la solicitud", "en": "application, request", "rank": 2100, "es": "Lleva la **solicitud** para que arreglen la línea eléctrica.", "en_sentence": "He carries the application to get the power line repaired.", "hook": "Solicitar = to apply for, to request. Any official form you fill in is a solicitud: de empleo, de beca. Solícito, the adjective, means attentive, a different thing.", "lesson": 5, "kind": "new", "k": "d25", "es_html": "Lleva la <b class=\"tw\">solicitud</b> para que arreglen la línea eléctrica."}, {"word": "el requisito", "en": "requirement", "rank": 2300, "es": "Falta un **requisito**: la firma del propietario.", "en_sentence": "A requirement is missing: the owner's signature.", "hook": "Requisite is rare in English; requisito is everyday bureaucracy in Spanish. Cumplir los requisitos = to meet the requirements. Requerir = to require.", "lesson": 5, "kind": "new", "k": "d26", "es_html": "Falta un <b class=\"tw\">requisito</b>: la firma del propietario."}, {"word": "el funcionario", "en": "civil servant, government employee", "rank": 1900, "es": "Un **funcionario** joven revisa los papeles sin levantar la vista.", "en_sentence": "A young civil servant checks the papers without looking up.", "hook": "Not a functionary in the sneering English sense; the neutral word for anyone who works for the state, from a clerk to a judge. La funcionaria for a woman.", "lesson": 5, "kind": "new", "k": "d27", "es_html": "Un <b class=\"tw\">funcionario</b> joven revisa los papeles sin levantar la vista."}, {"word": "la firma", "en": "signature; firm, company", "rank": 1900, "es": "La **firma** del propietario del terreno.", "en_sentence": "The landowner's signature.", "hook": "Firmar = to sign. In business prose la firma is also a company (una firma alemana). Both from firm, made solid: a signature makes a document firm.", "lesson": 5, "kind": "new", "k": "d28", "es_html": "La <b class=\"tw\">firma</b> del propietario del terreno."}, {"word": "cumplir", "en": "to fulfil, to carry out, to meet (a requirement); to turn (an age)", "rank": 700, "es": "Que **cumpla** con el procedimiento, señor.", "en_sentence": "That you comply with the procedure, sir.", "hook": "Cumplir una promesa = to keep a promise; cumplir con = to comply with; cumplir años = to have a birthday; cumplir treinta = to turn thirty. Incumplir = to breach.", "lesson": 5, "kind": "new", "k": "d29", "es_html": "Que <b class=\"tw\">cumpla</b> con el procedimiento, señor."}, {"word": "fingir", "en": "to pretend, to feign", "rank": 2000, "es": "**Finge** que no sabe que las galerías están inundadas.", "en_sentence": "He's pretending he doesn't know the tunnels are flooded.", "hook": "This is the real word for pretend. Pretender, which you have, is to intend or to claim: a false friend. Finge que duerme = he pretends to be asleep. Spelling: finjo, finge.", "lesson": 6, "kind": "new", "k": "d30", "es_html": "<b class=\"tw\">Finge</b> que no sabe que las galerías están inundadas."}, {"word": "engañar", "en": "to deceive, to cheat, to fool", "rank": 1700, "es": "Nadie sabe si quería **engañar** a alguien.", "en_sentence": "Nobody knows whether he wanted to cheat someone.", "hook": "El engaño = the deception. Engañarse = to fool yourself. Las apariencias engañan = appearances deceive. No relation to ganar.", "lesson": 6, "kind": "new", "k": "d31", "es_html": "Nadie sabe si quería <b class=\"tw\">engañar</b> a alguien."}, {"word": "ocultar", "en": "to hide, to conceal (something)", "rank": 1500, "es": "Solo **ocultaba** un negocio que no le salió.", "en_sentence": "He was just hiding a deal that didn't work out.", "hook": "Occult shares the root: hidden. Ocultar is the formal cousin of esconder, and it hides facts and feelings more than objects. Oculto = hidden.", "lesson": 6, "kind": "new", "k": "d32", "es_html": "Solo <b class=\"tw\">ocultaba</b> un negocio que no le salió."}, {"word": "la sospecha", "en": "suspicion", "rank": 2300, "es": "Queda la **sospecha**, que en este pueblo es lo que más dura.", "en_sentence": "The suspicion remains, which in this town is the thing that lasts longest.", "hook": "Sospechar = to suspect; sospechoso = suspicious, or a suspect. Bajo sospecha = under suspicion.", "lesson": 6, "kind": "new", "k": "d33", "es_html": "Queda la <b class=\"tw\">sospecha</b>, que en este pueblo es lo que más dura."}, {"word": "averiguar", "en": "to find out, to check (by looking into it)", "rank": 1800, "es": "Tomás lo **averiguó** en veinte minutos.", "en_sentence": "Tomás found it out in twenty minutes.", "hook": "Averiguar is active: you go and look. Contains verum, truth, as in verify. Voy a averiguarlo = I'll find out. Spelling: averigüé, with the two dots.", "lesson": 6, "kind": "new", "k": "d34", "es_html": "Tomás lo <b class=\"tw\">averiguó</b> en veinte minutos."}, {"word": "enterarse", "en": "to find out, to learn of (the news reaches you)", "rank": 1500, "es": "La gente se **entera** de que la empresa no existe.", "en_sentence": "People find out that the company doesn't exist.", "hook": "The passive twin of averiguar: the news arrives and you become aware. Me enteré ayer = I found out yesterday. ¿Te enteras? = do you get it? Always with de.", "lesson": 6, "kind": "new", "k": "d35", "es_html": "La gente se <b class=\"tw\">entera</b> de que la empresa no existe."}, {"word": "el fracaso", "en": "failure", "rank": 2100, "es": "No es un **fracaso**, es un intento.", "en_sentence": "It's not a failure, it's an attempt.", "hook": "The noun of fracasar, which you know and which has cost you slot errors: fracasó is the verb, el fracaso is the thing. The -o ending here is the noun, not a past tense.", "lesson": 7, "kind": "new", "k": "d36", "es_html": "No es un <b class=\"tw\">fracaso</b>, es un intento."}, {"word": "el logro", "en": "achievement", "rank": 2200, "es": "Que llame. Eso ya es un **logro**.", "en_sentence": "That she calls. That's already an achievement.", "hook": "Noun of lograr, to manage to. Un gran logro = a great achievement. Same slot logic as fracaso: lo logró is the verb, el logro is the result.", "lesson": 7, "kind": "new", "k": "d37", "es_html": "Que llame. Eso ya es un <b class=\"tw\">logro</b>."}, {"word": "el apoyo", "en": "support, backing", "rank": 900, "es": "El **apoyo** también es esto: contestar el domingo.", "en_sentence": "Support is also this: answering on Sunday.", "hook": "Noun of apoyar. Apoyo económico, apoyo moral; con el apoyo de = with the backing of. Not soportar, which is enduring.", "lesson": 7, "kind": "new", "k": "d38", "es_html": "El <b class=\"tw\">apoyo</b> también es esto: contestar el domingo."}, {"word": "la señal", "en": "sign, signal, mark", "rank": 1100, "es": "Vio en el periódico una **señal** de que las cosas mejoran.", "en_sentence": "She saw a sign in the paper that things are improving.", "hook": "Noun of señalar, to point out. A road sign, a phone signal (no hay señal), a sign that something is coming. Also a deposit when you buy something.", "lesson": 7, "kind": "new", "k": "d39", "es_html": "Vio en el periódico una <b class=\"tw\">señal</b> de que las cosas mejoran."}, {"word": "el intento", "en": "attempt, try", "rank": 1600, "es": "El segundo **intento** va mejor.", "en_sentence": "The second attempt is going better.", "hook": "Intentar = to try; el intento = the attempt. Al primer intento = at the first try. Not intent; intention is la intención.", "lesson": 7, "kind": "new", "k": "d40", "es_html": "El segundo <b class=\"tw\">intento</b> va mejor."}, {"word": "la pérdida", "en": "loss", "rank": 1000, "es": "La **pérdida** de un pueblo no sale en los periódicos.", "en_sentence": "The loss of a town doesn't make the papers.", "hook": "From perder. Note the accent on pér-. Pérdida de tiempo = waste of time; pérdidas y ganancias = losses and profits. Perdida without the accent means lost.", "lesson": 7, "kind": "new", "k": "d41", "es_html": "La <b class=\"tw\">pérdida</b> de un pueblo no sale en los periódicos."}, {"word": "la despedida", "en": "farewell, goodbye, send-off", "rank": 2000, "es": "La **despedida** es corta.", "en_sentence": "The farewell is short.", "hook": "Noun of despedirse, from lesson 2. Fiesta de despedida = leaving party; despedida de soltero = stag party. Despedir also fires you; that noun is el despido.", "lesson": 8, "kind": "new", "k": "d42", "es_html": "La <b class=\"tw\">despedida</b> es corta."}, {"word": "mudarse", "en": "to move house", "rank": 2000, "es": "**Mudarse** a la capital cuesta lo que cuesta un coche usado.", "en_sentence": "Moving to the capital costs what a second-hand car costs.", "hook": "Mudar alone = to change, to shed (a snake muda la piel). Mudarse de casa = to move house; la mudanza = the move, and the removals van. Not mover, which moves objects.", "lesson": 8, "kind": "new", "k": "d43", "es_html": "<b class=\"tw\">Mudarse</b> a la capital cuesta lo que cuesta un coche usado."}, {"word": "el regreso", "en": "return, coming back", "rank": 1700, "es": "Es el primer **regreso** que veo en tres semanas.", "en_sentence": "He is the first return I've seen in three weeks.", "hook": "Regresar = to go back, the everyday Latin American word where Spain says volver. Regress went sour in English; el regreso is neutral. De regreso = on the way back.", "lesson": 8, "kind": "new", "k": "d44", "es_html": "Es el primer <b class=\"tw\">regreso</b> que veo en tres semanas."}, {"word": "la vuelta", "en": "return; turn; lap; walk; change (money)", "rank": 800, "es": "Bienvenido de **vuelta**.", "en_sentence": "Welcome back.", "hook": "Noun of volver. Estar de vuelta = to be back; dar una vuelta = to go for a walk; ida y vuelta = round trip; la vuelta al mundo = around the world. One of the busiest nouns in the language.", "lesson": 8, "kind": "new", "k": "d45", "es_html": "Bienvenido de <b class=\"tw\">vuelta</b>."}, {"word": "la estancia", "en": "stay, period spent somewhere; ranch (Argentina)", "rank": 2200, "es": "Fue una **estancia** larga.", "en_sentence": "It was a long stay.", "hook": "From estar: the time you are somewhere. Estancia de tres noches = three-night stay. In Argentina and Uruguay an estancia is a big ranch. Not stance.", "lesson": 8, "kind": "new", "k": "d46", "es_html": "Fue una <b class=\"tw\">estancia</b> larga."}, {"word": "lejano", "en": "distant, far-off, remote", "rank": 1800, "es": "Una ciudad **lejana** cuyo nombre nadie sabe pronunciar.", "en_sentence": "A distant city whose name nobody can pronounce.", "hook": "Adjective of lejos. Alejar, which you know, pushes something away; lejano describes what is already far. Un pariente lejano = a distant relative; el Lejano Oeste = the Far West.", "lesson": 8, "kind": "new", "k": "d47", "es_html": "Una ciudad <b class=\"tw\">lejana</b> cuyo nombre nadie sabe pronunciar."}, {"word": "aprovechar", "en": "to make the most of, to take advantage of, to use well", "rank": 900, "es": "**Aprovecha** todo: las piezas viejas, las horas sin clientes.", "en_sentence": "He makes the most of everything: the old parts, the hours without customers.", "hook": "From provecho, benefit (¡buen provecho! = enjoy your meal). Aprovechar el tiempo = use your time well. Aprovecharse de alguien, with se, is the bad sense: to take advantage of someone.", "lesson": 9, "kind": "new", "k": "d48", "es_html": "<b class=\"tw\">Aprovecha</b> todo: las piezas viejas, las horas sin clientes."}, {"word": "valer", "en": "to be worth, to cost; to be valid", "rank": 900, "es": "Aquí no **vale** la pena poner un negocio.", "en_sentence": "It's not worth setting up a business here.", "hook": "Irregular: valgo, vale, valió. ¿Cuánto vale? = how much is it? Vale la pena = it's worth it. In Spain vale = OK. No vale = that doesn't count.", "lesson": 9, "kind": "new", "k": "d49", "es_html": "Aquí no <b class=\"tw\">vale</b> la pena poner un negocio."}, {"word": "merecer", "en": "to deserve", "rank": 1500, "es": "Este pueblo no **merece** que lo dejen morir.", "en_sentence": "This town doesn't deserve to be left to die.", "hook": "Merit is the cousin. Merecer la pena is Spain's version of valer la pena. Se lo merece = he deserves it. Spelling: merezco, merece.", "lesson": 9, "kind": "new", "k": "d50", "es_html": "Este pueblo no <b class=\"tw\">merece</b> que lo dejen morir."}, {"word": "la pena", "en": "pity, sorrow; trouble, effort; penalty", "rank": 1200, "es": "No vale la **pena**.", "en_sentence": "It's not worth the trouble.", "hook": "Three faces: qué pena = what a shame; vale la pena = it's worth the trouble; pena de muerte = death penalty. In much of Latin America me da pena = I'm embarrassed, not sad.", "lesson": 9, "kind": "new", "k": "d51", "es_html": "No vale la <b class=\"tw\">pena</b>."}, {"word": "el fondo", "en": "bottom, back, far end; background; fund", "rank": 700, "es": "En el **fondo** del cajón hay teléfonos de gente que ya no vive aquí.", "en_sentence": "At the bottom of the drawer there are phones belonging to people who don't live here any more.", "hook": "The far end of anything: el fondo del mar, al fondo del pasillo (at the end of the corridor). En el fondo = deep down. Los fondos = funds, money.", "lesson": 9, "kind": "new", "k": "d52", "es_html": "En el <b class=\"tw\">fondo</b> del cajón hay teléfonos de gente que ya no vive aquí."}, {"word": "el modo", "en": "way, manner, mode", "rank": 700, "es": "Él lo puso de todos **modos**.", "en_sentence": "He set it up anyway.", "hook": "De todos modos = anyway; de ningún modo = no way; de modo que = so that. Grammar's modo indicativo is the same word. Interchangeable with manera in most uses.", "lesson": 9, "kind": "new", "k": "d53", "es_html": "Él lo puso de todos <b class=\"tw\">modos</b>."}, {"word": "incluso", "en": "even; including", "rank": 500, "es": "**Incluso** los que se quedan estamos un poco menos cada año.", "en_sentence": "Even those of us who stay are a little less every year.", "hook": "The 'even' of surprise: incluso los niños lo saben = even the children know it. From incluir, so also 'including'. Aun (no accent) is the same 'even' in a more formal register.", "lesson": 10, "kind": "new", "k": "d54", "es_html": "<b class=\"tw\">Incluso</b> los que se quedan estamos un poco menos cada año."}, {"word": "ni siquiera", "en": "not even", "rank": 900, "es": "**Ni siquiera** lo pienso.", "en_sentence": "I don't even think about it.", "hook": "Siquiera alone = at least, in a wish (siquiera una vez). With ni it flips to not even. Ni siquiera me miró = he didn't even look at me. Keep the ni.", "lesson": 10, "kind": "new", "k": "d55", "es_html": "<b class=\"tw\">Ni siquiera</b> lo pienso."}, {"word": "sino", "en": "but rather, but (correcting a negative)", "rank": 300, "es": "No es que se vacíe, **sino** que se va gastando.", "en_sentence": "It's not that it's emptying, but that it's wearing away.", "hook": "Sino corrects a negative: no es rojo, sino verde. Pero adds; sino replaces. One word. Si no, two words, means if not. Before a conjugated verb it becomes sino que.", "lesson": 10, "kind": "new", "k": "d56", "es_html": "No es que se vacíe, <b class=\"tw\">sino</b> que se va gastando."}, {"word": "en cambio", "en": "on the other hand, whereas, instead", "rank": 1200, "es": "Delia, **en cambio**, lo piensa por los dos.", "en_sentence": "Delia, on the other hand, thinks about it for both of us.", "hook": "Literally 'in exchange'. It contrasts two subjects: yo me quedo; ella, en cambio, se fue. A cambio de = in exchange for, a different phrase.", "lesson": 10, "kind": "new", "k": "d57", "es_html": "Delia, <b class=\"tw\">en cambio</b>, lo piensa por los dos."}, {"word": "a pesar de", "en": "despite, in spite of", "rank": 600, "es": "Me llama todos los domingos, **a pesar de** que no tengo nada nuevo.", "en_sentence": "She calls me every Sunday, even though I have nothing new.", "hook": "Pesar = to weigh, and as a noun, sorrow. A pesar de = despite the weight of. Before a clause add que: a pesar de que llueve. A pesar de todo = all the same.", "lesson": 10, "kind": "new", "k": "d58", "es_html": "Me llama todos los domingos, <b class=\"tw\">a pesar de</b> que no tengo nada nuevo."}, {"word": "o sea", "en": "that is, I mean, in other words", "rank": 700, "es": "**O sea**, no es un golpe: es un desgaste.", "en_sentence": "I mean, it's not a blow: it's a wearing down.", "hook": "Literally 'or be it', the subjunctive of ser. The everyday rephrasing word, the filler of spoken Spanish. Es decir is the same thing in writing. Two words, never osea.", "lesson": 10, "kind": "new", "k": "d59", "es_html": "<b class=\"tw\">O sea</b>, no es un golpe: es un desgaste."}, {"word": "el turno", "en": "shift; turn", "rank": 1800, "es": "Ramón trabaja el **turno** de noche en la estación.", "en_sentence": "Ramón works the night shift at the station.", "hook": "Same root as 'turn': your turn in a line is tu turno, and a work shift is the turn you take. Es mi turno = it's my turn; turno de noche = night shift.", "lesson": 11, "kind": "new", "k": "d60", "es_html": "Ramón trabaja el <b class=\"tw\">turno</b> de noche en la estación."}, {"word": "la madrugada", "en": "the early hours, the small hours (between midnight and dawn)", "rank": 1800, "es": "A las tres de la **madrugada** pasa el camión del pan.", "en_sentence": "At three in the morning the bread truck comes by.", "hook": "English has no single word for it: the hours between midnight and dawn. De madrugada = in the small hours. Madrugar = to get up very early.", "lesson": 11, "kind": "new", "k": "d61", "es_html": "A las tres de la <b class=\"tw\">madrugada</b> pasa el camión del pan."}, {"word": "tardar", "en": "to take (time); to be slow, to be late", "rank": 1000, "es": "Le pregunto cuánto **tarda** en acostumbrarse uno.", "en_sentence": "I ask how long it takes to get used to it.", "hook": "From tarde (late, afternoon). Tardar en + infinitive = to take time to do something. No tardes = don't be long. Not the same as llegar tarde, which is just arriving late.", "lesson": 11, "kind": "new", "k": "d62", "es_html": "Le pregunto cuánto <b class=\"tw\">tarda</b> en acostumbrarse uno."}, {"word": "el descanso", "en": "rest, break", "rank": 1800, "es": "Tiene media hora de **descanso**.", "en_sentence": "He gets half an hour's break.", "hook": "Descansar = to rest; the noun is the break itself. Un descanso is also half-time in a match. En paz descanse = rest in peace.", "lesson": 11, "kind": "new", "k": "d63", "es_html": "Tiene media hora de <b class=\"tw\">descanso</b>."}, {"word": "la prisa", "en": "hurry, haste", "rank": 1700, "es": "Aparece un coche con **prisa**.", "en_sentence": "A car appears in a hurry.", "hook": "Tener prisa = to be in a hurry; darse prisa = to hurry up; de prisa = quickly. There is no plain verb: in Spanish you have a hurry rather than hurry.", "lesson": 11, "kind": "new", "k": "d64", "es_html": "Aparece un coche con <b class=\"tw\">prisa</b>."}, {"word": "de repente", "en": "suddenly", "rank": 1500, "es": "**De repente** se va la luz del surtidor.", "en_sentence": "Suddenly the pump's light goes out.", "hook": "Fixed phrase; nothing to do with repent. Repente on its own is never used. A synonym you will meet: de pronto.", "lesson": 11, "kind": "new", "k": "d65", "es_html": "<b class=\"tw\">De repente</b> se va la luz del surtidor."}, {"word": "el ayuntamiento", "en": "town hall; town council", "rank": 2200, "es": "En el **ayuntamiento** hay un cartel de hace diez años.", "en_sentence": "In the town hall there's a sign from ten years ago.", "hook": "From juntar, to join: the body where the town's people are joined together. Both the building and the local government. Latin America often says la alcaldía or el municipio.", "lesson": 12, "kind": "new", "k": "d66", "es_html": "En el <b class=\"tw\">ayuntamiento</b> hay un cartel de hace diez años."}, {"word": "la fábrica", "en": "factory", "rank": 1700, "es": "«Aquí se construirá una **fábrica** de piezas para automóviles».", "en_sentence": "\"A car-parts factory will be built here.\"", "hook": "False friend: not fabric. Fabric is la tela. Fabricar = to manufacture; English fabricate once simply meant to build.", "lesson": 12, "kind": "new", "k": "d67", "es_html": "«Aquí se construirá una <b class=\"tw\">fábrica</b> de piezas para automóviles»."}, {"word": "el alcalde", "en": "mayor", "rank": 1600, "es": "El **alcalde**, don Aurelio, me recibe en un despacho con dos sillas.", "en_sentence": "The mayor, don Aurelio, receives me in an office with two chairs.", "hook": "From Arabic al-qadi, the judge. La alcaldesa for a woman. No relation to alcanzar, despite the look.", "lesson": 12, "kind": "new", "k": "d68", "es_html": "El <b class=\"tw\">alcalde</b>, don Aurelio, me recibe en un despacho con dos sillas."}, {"word": "la promesa", "en": "promise", "rank": 1500, "es": "—La **promesa** era de la empresa, no mía.", "en_sentence": "\"The promise was the company's, not mine.\"", "hook": "Prometer = to promise; cumplir una promesa = to keep one. Near-cognate, but the stress is pro-ME-sa, and it's the verb people fail to recognize.", "lesson": 12, "kind": "new", "k": "d69", "es_html": "—La <b class=\"tw\">promesa</b> era de la empresa, no mía."}, {"word": "el terreno", "en": "land, plot; ground, terrain", "rank": 1500, "es": "Nosotros cedimos el **terreno**.", "en_sentence": "We handed over the land.", "hook": "Wider than terrain: a plot you build on, the ground under your feet, and figuratively a field — en el terreno político. Un terreno = a piece of land for sale.", "lesson": 12, "kind": "new", "k": "d70", "es_html": "Nosotros cedimos el <b class=\"tw\">terreno</b>."}, {"word": "la vivienda", "en": "housing; dwelling, home", "rank": 1600, "es": "Revisa solicitudes de **vivienda**.", "en_sentence": "He goes through housing applications.", "hook": "From vivir. The administrative word for a home: la casa is the building, la vivienda is the place-you-live as a category. El problema de la vivienda = the housing problem.", "lesson": 12, "kind": "new", "k": "d71", "es_html": "Revisa solicitudes de <b class=\"tw\">vivienda</b>."}, {"word": "comprobar", "en": "to check, to verify, to confirm", "rank": 1300, "es": "Antes de escribir nada quiero **comprobar** lo que me contó Ramón.", "en_sentence": "Before writing anything I want to check what Ramón told me.", "hook": "Com + probar: to put to the test. Checking that something is true — not proving it to others, which is demostrar. Averiguar is finding out what you don't yet know; comprobar is confirming what you were told.", "lesson": 13, "kind": "new", "k": "d72", "es_html": "Antes de escribir nada quiero <b class=\"tw\">comprobar</b> lo que me contó Ramón."}, {"word": "demostrar", "en": "to prove; to demonstrate, to show", "rank": 1000, "es": "No **demuestra** nada.", "en_sentence": "It proves nothing.", "hook": "Stem changes: demuestro, demuestra. Stronger than mostrar (to show): showing so that it is established. Una demostración is a proof or a product demo — a protest is una manifestación.", "lesson": 13, "kind": "new", "k": "d73", "es_html": "No <b class=\"tw\">demuestra</b> nada."}, {"word": "la mentira", "en": "lie", "rank": 1500, "es": "Una **mentira** también puede ser un silencio.", "en_sentence": "A lie can also be a silence.", "hook": "Parece mentira = it's hard to believe. Una mentira piadosa = a white lie. The person is un mentiroso.", "lesson": 13, "kind": "new", "k": "d74", "es_html": "Una <b class=\"tw\">mentira</b> también puede ser un silencio."}, {"word": "mentir", "en": "to lie (tell an untruth)", "rank": 1600, "es": "—No **mentí** —dice—. Solo no lo dije.", "en_sentence": "\"I didn't lie,\" he says. \"I just didn't say it.\"", "hook": "Stem changes: miento, mientes; preterite mentí, mintió. Only this sense — lying down is acostarse or estar tumbado. Compare engañar (to deceive, by any means) and fingir (to pretend).", "lesson": 13, "kind": "new", "k": "d75", "es_html": "—No <b class=\"tw\">mentí</b> —dice—. Solo no lo dije."}, {"word": "equivocarse", "en": "to be wrong, to make a mistake", "rank": 1800, "es": "Me **equivoqué** en una cosa.", "en_sentence": "I was wrong about one thing.", "hook": "Reflexive: me equivoco, te equivocas. Equivocarse de + noun = to get the wrong one: me equivoqué de autobús. The noun is una equivocación or, more often, un error.", "lesson": 13, "kind": "new", "k": "d76", "es_html": "Me <b class=\"tw\">equivoqué</b> en una cosa."}, {"word": "acertar", "en": "to get right, to guess right, to hit the mark", "rank": 2000, "es": "En lo demás, **acerté**.", "en_sentence": "On the rest, I was right.", "hook": "Stem changes: acierto, aciertas. The opposite of equivocarse. From cierto (certain). Un acierto = a good call; acertar con = to hit on the right one.", "lesson": 13, "kind": "new", "k": "d77", "es_html": "En lo demás, <b class=\"tw\">acerté</b>."}, {"word": "la demanda", "en": "lawsuit; demand (for goods)", "rank": 1300, "es": "Doscientos mineros pusieron una **demanda** contra la empresa.", "en_sentence": "Two hundred miners filed a lawsuit against the company.", "hook": "Two senses, neither quite the English one: poner una demanda = to sue; la oferta y la demanda = supply and demand. A demand you make of someone is una exigencia, from exigir.", "lesson": 14, "kind": "new", "k": "d78", "es_html": "Doscientos mineros pusieron una <b class=\"tw\">demanda</b> contra la empresa."}, {"word": "el juicio", "en": "trial; judgment, (good) sense", "rank": 1200, "es": "El **juicio** duró tres años.", "en_sentence": "The trial lasted three years.", "hook": "Llevar a juicio = to take to court. Also judgment as a faculty: a mi juicio = in my judgment; perder el juicio = to lose one's mind. The judge is el juez.", "lesson": 14, "kind": "new", "k": "d79", "es_html": "El <b class=\"tw\">juicio</b> duró tres años."}, {"word": "condenar", "en": "to sentence, to convict; to condemn", "rank": 1700, "es": "El juez no **condenó** a nadie.", "en_sentence": "The judge convicted nobody.", "hook": "In court it is verdict and sentence in one: lo condenaron a tres años. Outside court, to condemn. Una condena = a sentence, the time served.", "lesson": 14, "kind": "new", "k": "d80", "es_html": "El juez no <b class=\"tw\">condenó</b> a nadie."}, {"word": "la culpa", "en": "fault, blame; guilt", "rank": 1300, "es": "Entonces la **culpa** es de la ley.", "en_sentence": "Then the law is to blame.", "hook": "Spanish treats blame as a possession: la culpa es mía = it's my fault; tener la culpa = to be to blame; echar la culpa a = to blame. Guilt the feeling is also culpa; the guilty one is el culpable.", "lesson": 14, "kind": "new", "k": "d81", "es_html": "Entonces la <b class=\"tw\">culpa</b> es de la ley."}, {"word": "el castigo", "en": "punishment", "rank": 2200, "es": "Pregunto si alguien recibió **castigo**.", "en_sentence": "I ask whether anyone was punished.", "hook": "Castigar = to punish; same root as chastise. Un castigo is also anything you have to put up with: este calor es un castigo.", "lesson": 14, "kind": "new", "k": "d82", "es_html": "Pregunto si alguien recibió <b class=\"tw\">castigo</b>."}, {"word": "la queja", "en": "complaint", "rank": 1800, "es": "Nadie en el pueblo volvió a poner una **queja** por nada.", "en_sentence": "Nobody in the town ever filed a complaint about anything again.", "hook": "Quejarse de = to complain about; poner una queja = to file one. The sound is one too: un quejido = a moan. No relation to querer.", "lesson": 14, "kind": "new", "k": "d83", "es_html": "Nadie en el pueblo volvió a poner una <b class=\"tw\">queja</b> por nada."}, {"word": "esconder", "en": "to hide (something, or oneself)", "rank": 1800, "es": "Me dicen que se **esconde**.", "en_sentence": "They tell me he's hiding.", "hook": "The everyday word: esconder las llaves, esconderse detrás de la puerta. Ocultar is the same act in a graver register — ocultar la verdad, ocultar pruebas. El escondite = hiding place, and the children's game.", "lesson": 15, "kind": "new", "k": "d84", "es_html": "Me dicen que se <b class=\"tw\">esconde</b>."}, {"word": "huir", "en": "to flee, to run away", "rank": 1600, "es": "Benito no **huye**: me ofrece café.", "en_sentence": "Benito doesn't run: he offers me coffee.", "hook": "Irregular: huyo, huyes, huye; preterite huyó. Huir de = to flee from. Same family as English 'fugitive'; la huida = the escape.", "lesson": 15, "kind": "new", "k": "d85", "es_html": "Benito no <b class=\"tw\">huye</b>: me ofrece café."}, {"word": "perseguir", "en": "to chase, to pursue; to persecute", "rank": 1800, "es": "—Ya nadie me **persigue**.", "en_sentence": "\"Nobody chases me anymore.\"", "hook": "Per + seguir: to follow all the way. Conjugates like seguir: persigo, persigue. Covers a dog after a car, a debt collector, and a state persecuting people. La persecución.", "lesson": 15, "kind": "new", "k": "d86", "es_html": "—Ya nadie me <b class=\"tw\">persigue</b>."}, {"word": "atreverse", "en": "to dare", "rank": 2000, "es": "Para irse hay que **atreverse**.", "en_sentence": "To leave you have to dare.", "hook": "Always reflexive: me atrevo, se atrevió. Atreverse a + infinitive. Atrevido = daring, cheeky. ¿Cómo te atreves? = how dare you.", "lesson": 15, "kind": "new", "k": "d87", "es_html": "Para irse hay que <b class=\"tw\">atreverse</b>."}, {"word": "confiar", "en": "to trust; to entrust; to be confident", "rank": 1300, "es": "Le **confié** mis ahorros a un amigo.", "en_sentence": "I entrusted my savings to a friend.", "hook": "Confiar en alguien = to trust someone; confiar algo a alguien = to entrust something to them. Accent on the i: confío, confías. La confianza = trust; de confianza = trusted.", "lesson": 15, "kind": "new", "k": "d88", "es_html": "Le <b class=\"tw\">confié</b> mis ahorros a un amigo."}, {"word": "la vergüenza", "en": "shame, embarrassment", "rank": 1700, "es": "Siento **vergüenza** sin saber de quién.", "en_sentence": "I feel ashamed without knowing on whose behalf.", "hook": "Tener vergüenza = to be embarrassed; dar vergüenza = to make someone embarrassed: me da vergüenza. ¡Qué vergüenza! = how embarrassing. The dots on the ü mean the u is sounded.", "lesson": 15, "kind": "new", "k": "d89", "es_html": "Siento <b class=\"tw\">vergüenza</b> sin saber de quién."}, {"word": "el alquiler", "en": "rent; rental", "rank": 2200, "es": "Marisol paga **alquiler** por el puesto.", "en_sentence": "Marisol pays rent for the stall.", "hook": "Alquilar = to rent, in both directions, landlord and tenant. Se alquila = for rent. Latin America often says la renta, rentar. From Arabic al-kirā', the hire.", "lesson": 16, "kind": "new", "k": "d90", "es_html": "Marisol paga <b class=\"tw\">alquiler</b> por el puesto."}, {"word": "el dueño", "en": "owner", "rank": 900, "es": "Al **dueño** de la terminal, que vive en la capital.", "en_sentence": "To the owner of the terminal, who lives in the capital.", "hook": "From Latin dominus, like 'domain'. La dueña for a woman. Ser dueño de = to own; dueño de sí mismo = in control of oneself. El propietario is the formal word.", "lesson": 16, "kind": "new", "k": "d91", "es_html": "Al <b class=\"tw\">dueño</b> de la terminal, que vive en la capital."}, {"word": "cobrar", "en": "to charge; to collect (money owed); to get paid", "rank": 1300, "es": "—Nos **cobra** como si esto fuera una ciudad.", "en_sentence": "\"He charges us as if this were a city.\"", "hook": "Money moving toward the speaker. ¿Cuánto cobras? = how much do you charge, or what do you earn. Cobrar un cheque = to cash it. The opposite direction is pagar.", "lesson": 16, "kind": "new", "k": "d92", "es_html": "—Nos <b class=\"tw\">cobra</b> como si esto fuera una ciudad."}, {"word": "el impuesto", "en": "tax", "rank": 1700, "es": "El alquiler, la luz y los **impuestos**.", "en_sentence": "The rent, the electricity and the taxes.", "hook": "Literally 'imposed': the past participle of imponer. Impuesto sobre la renta = income tax; libre de impuestos = tax-free.", "lesson": 16, "kind": "new", "k": "d93", "es_html": "El alquiler, la luz y los <b class=\"tw\">impuestos</b>."}, {"word": "la ganancia", "en": "profit, gain, earnings", "rank": 2300, "es": "Los impuestos se pagan aunque no haya **ganancia**.", "en_sentence": "Taxes get paid even when there's no profit.", " n": "edge, rim, brink", "rank": 2000, "es": "Al **borde** del pueblo hay una muestra de lo que fue.", "en_sentence": "At the edge of the town there's a sample of what it was.", "hook": "The edge of a table, a road, a glass — and al borde de = on the verge of: al borde de las lágrimas. Same root as 'border', but it's the edge, not the frontier, which is la frontera.", "lesson": 18, "kind": "new", "k": "d107", "es_html": "Al <b class=\"tw\">borde</b> del pueblo hay una muestra de lo que fue."}, {"word": "el consejo", "en": "advice, a piece of advice; council", "rank": 1400, "es": "El **consejo** me lo dio Ramón.", "en_sentence": "It was Ramón who gave me the advice.", "hook": "Un consejo = one piece of advice; English advice has no plural, Spanish does: dar consejos. Aconsejar = to advise. Capitalized it's a council: el Consejo de Ministros.", "lesson": 19, "kind": "new", "k": "d108", "es_html": "El <b class=\"tw\">consejo</b> me lo dio Ramón."}, {"word": "echar de menos", "en": "to miss (someone, something)", "rank": 2000, "es": "Le pregunto si **echa de menos** el pueblo.", "en_sentence": "I ask whether she misses the town.", "hook": "Three words acting as one verb; only echar conjugates: echo de menos, echaba de menos. Takes a before people: echo de menos a mi hermana. Latin America says extrañar. Nothing to do with 'less' — it's feeling the lack.", "lesson": 19, "kind": "new", "k": "d109", "es_html": "Le pregunto si <b class=\"tw\">echa de menos</b> el pueblo."}, {"word": "el ánimo", "en": "spirits, mood; encouragement", "rank": 1700, "es": "Le pregunto por el **ánimo**.", "en_sentence": "I ask how her spirits are.", "hook": "Estado de ánimo = mood, state of mind. ¡Ánimo! = chin up, you can do it. Dar ánimos = to encourage. Same root as 'animate': the spirit that moves you.", "lesson": 19, "kind": "new", "k": "d110", "es_html": "Le pregunto por el <b class=\"tw\">ánimo</b>."}, {"word": "la esperanza", "en": "hope", "rank": 1200, "es": "Tengo una **esperanza** con const KEY = "diez.v2";          // second series; v1 state is captured once as legacy
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const today = () => new Date().toLocaleDateString('en-CA');
const hasNotif = () => typeof Notification !== 'undefined' && typeof Notification.requestPermission === 'function';

/* ---------- where am I running? ----------
   Inside the claude.ai Artifact viewer, window.claude.use exists and the
   page can reach the artifact's shared db, which Claude reads back with
   ArtifactData. The namespaces arrive asynchronously; the page renders
   without them and lights sync up when they resolve. */
const ART = !!(window.claude && typeof window.claude.use === 'function');
let DBN = null, DLS = null;
if(ART){
  window.claude.use('db').then(d=>{ DBN=d; syPaint(); if(DBN && SY.dirty) syPush(); }).catch(()=>{});
  window.claude.use('downloads').then(d=>{ DLS=d; }).catch(()=>{});
}
let DEV;   // one id per browser, so two devices never overwrite each other's doc
try{ DEV = localStorage.getItem('diez.dev');
     if(!DEV){ DEV = 'd-'+Math.random().toString(36).slice(2,10); localStorage.setItem('diez.dev', DEV); } }
catch(e){ DEV = 'd-anon'; }

/* ---------- state ---------- */
const deckBlank = () => ({pass:1, seed:Math.floor(Math.random()*1e9)+1, cards:{}, history:[]});
const blank = () => ({lessons:{}, days:[], reminder:null, notified:null, deck:deckBlank(), legacy_v1:null});
let S;
try { S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY)||"{}")); }
catch(e){ S = blank(); }
if(!S.deck) S.deck = deckBlank();
/* Whatever the first series left on this device rides along once, so the
   answers she typed into the old lessons are not lost to the rebuild. */
try{ if(S.legacy_v1==null && localStorage.getItem('diez.v1')){
       S.legacy_v1 = JSON.parse(localStorage.getItem('diez.v1')); } }catch(e){}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  markDirty();
}

/* ---------- small UI helpers ----------
   The artifact viewer never shows alert()/confirm(), so the page carries
   its own toast and a two-tap confirmation. */
function toast(msg){
  let t=$('#toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'), 2200);
}
function armed(btn, label, fn){
  if(btn.dataset.armed){ delete btn.dataset.armed; fn(); return; }
  const orig=btn.textContent; btn.dataset.armed='1'; btn.textContent=label;
  setTimeout(()=>{ if(btn.dataset.armed){ delete btn.dataset.armed; btn.textContent=orig; } }, 4000);
}

/* ---------- sync ----------
   Every save marks the state dirty and a debounced push writes the whole
   snapshot somewhere Claude can read: the artifact db when running as an
   Artifact, else a file in the private repo through the GitHub contents API.
   localStorage stays the on-device source of truth, so a failed push loses
   nothing — the dirty flag is persisted and retried on the next open. */
const SKEY = "diez.sync";
const syBlank = () => ({token:"", repo:"olga-pyatokha/spanish-learning", branch:"main",
                        path:"state/phone/diez.json", sha:null, at:null, err:null, dirty:false});
let SY;
try { SY = Object.assign(syBlank(), JSON.parse(localStorage.getItem(SKEY)||"{}")); }
catch(e){ SY = syBlank(); }
function sySave(){ try{ localStorage.setItem(SKEY, JSON.stringify(SY)); }catch(e){} }

let syPhase = "idle";          // idle | pending | sending | ok | error
let syTimer = null, syBusy = false;

const backend = () => DBN ? 'db' : (SY.token ? 'gh' : null);
function syChip(){
  if(!backend())           return ART ? {t:"conectando…", c:"amber"} : {t:"sin conectar", c:""};
  if(syPhase==="sending")  return {t:"enviando…", c:"amber"};
  if(syPhase==="error")    return {t:SY.err || "error", c:"red"};
  if(SY.dirty)             return {t:"pendiente", c:"amber"};
  if(SY.at) return {t:"guardado " + new Date(SY.at).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}),
                    c:"green"};
  return {t: DBN ? "conectado a Claude" : "conectado", c:""};
}
function syPaint(){
  const c = syChip();
  document.querySelectorAll('[data-sy]').forEach(el=>{ el.textContent=c.t; el.className='sychip '+c.c; });
}
function markDirty(){
  if(!SY.dirty){ SY.dirty = true; sySave(); }
  if(!backend()){ syPaint(); return; }
  if(syPhase!=="sending") syPhase="pending";
  syPaint();
  if(syTimer) clearTimeout(syTimer);
  syTimer = setTimeout(()=>syPush(), 2500);
}
function syNow(){ if(syTimer) clearTimeout(syTimer); return syPush(); }

/* btoa over UTF-8, chunked — a spread of 60k args overflows the stack. */
function b64(s){
  const by = new TextEncoder().encode(s);
  let bin = "", CH = 0x8000;
  for(let i=0;i<by.length;i+=CH) bin += String.fromCharCode.apply(null, by.subarray(i,i+CH));
  return btoa(bin);
}
function syHead(){
  return {"Authorization":"Bearer "+SY.token, "Accept":"application/vnd.github+json",
          "X-GitHub-Api-Version":"2022-11-28"};
}
const syURL = () => `https://api.github.com/repos/${SY.repo}/contents/${SY.path}`;

async function syRemoteSha(){
  const r = await fetch(`${syURL()}?ref=${encodeURIComponent(SY.branch)}`, {headers:syHead()});
  if(r.status===404) return null;
  if(!r.ok) throw new Error("read "+r.status);
  return (await r.json()).sha;
}
function syBody(text, sha){
  const b = {message:`diez: progreso ${today()}`, content:b64(text), branch:SY.branch};
  if(sha) b.sha = sha;
  return b;
}
async function syPut(body, keepalive){
  return fetch(syURL(), {method:"PUT", keepalive:!!keepalive,
    headers:Object.assign({"Content-Type":"application/json"}, syHead()),
    body:JSON.stringify(body)});
}
async function syPush(keepalive){
  const be = backend();
  if(!be || syBusy || !SY.dirty) return;
  syBusy = true; syPhase = "sending"; syPaint();
  const snap = snapshot();
  if(be === 'db'){
    /* one document per device, replaced whole; one write in flight at a time */
    try{
      await DBN.doc('progress/' + DEV).set(snap);
      SY.at = new Date().toISOString(); SY.err = null; SY.dirty = false; syPhase = "ok";
    }catch(e){
      const code = e && e.code;
      SY.err = code==='quota_exceeded' ? "sin espacio"
             : code==='revoked' ? "acceso revocado"
             : code==='invalid_argument' ? "sin permiso de escritura"
             : "sin conexión";
      syPhase = "error";
    }
    sySave(); syBusy = false; syPaint();
    return;
  }
  const text = JSON.stringify(snap, null, 2);
  try{
    let r = await syPut(syBody(text, SY.sha), keepalive);
    /* a stale cached sha, or a file that appeared since — re-read and retry once */
    if(r.status===409 || r.status===422){
      r = await syPut(syBody(text, await syRemoteSha()), keepalive);
    }
    if(r.ok){
      const j = await r.json();
      SY.sha = j.content && j.content.sha;
      SY.at = new Date().toISOString();
      SY.err = null; SY.dirty = false; syPhase = "ok";
    } else {
      let d=""; try{ d = (await r.json()).message || ""; }catch(e){}
      SY.err = r.status===401 ? "token inválido"
             : r.status===403 ? "token sin permiso"
             : r.status===404 ? "repo o rama no encontrada"
             : `${r.status} ${d}`.slice(0,60);
      syPhase = "error";
    }
  }catch(e){
    SY.err = "sin conexión"; syPhase = "error";   /* stays dirty, retried later */
  }
  sySave(); syBusy = false; syPaint();
}
function L(n){ return S.lessons[n] || (S.lessons[n] = {words:false, read:false, cards:{}, cloze:{}, doneAt:null}); }
function touchDay(){ const d=today(); if(!S.days.includes(d)){ S.days.push(d); S.days=S.days.slice(-120); } save(); }

function cardsOf(l){
  return l.new_words.map((c,j)=>({...c,kind:'new',k:'n'+j}))
    .concat(l.review_cards.map((c,j)=>({...c,k:'r'+j})));
}
function lessonDone(n){
  const st=L(n), l=PKG.lessons[n-1];
  return st.words && st.read && Object.keys(st.cards).length>=cardsOf(l).length
      && Object.keys(st.cloze).length>=l.cloze.length;
}
function lessonStarted(n){
  const st=L(n);
  return st.words || st.read || Object.keys(st.cards).length || Object.keys(st.cloze).length;
}
function streak(){
  let n=0, d=new Date();
  for(;;){ const k=d.toLocaleDateString('en-CA');
    if(S.days.includes(k)){ n++; d.setDate(d.getDate()-1); }
    else if(n===0 && k===today()){ d.setDate(d.getDate()-1); }
    else break;
    if(n>200) break; }
  return n;
}
function wordsSeen(){
  let n=0;
  PKG.lessons.forEach((l,i)=>{ const st=L(i+1);
    l.new_words.forEach((c,j)=>{ if(st.cards['n'+j]) n++; }); });
  return n;
}

/* ---------- deck: every new word, one pass at a time ---------- */
function deckOrder(){
  const src=PKG.deck.cards, n=src.length, idx=[...Array(n).keys()];
  let s = (S.deck.seed>>>0) || 1;                 // xorshift32, seeded per pass
  const rnd=()=>{ s ^= s<<13; s ^= s>>>17; s ^= s<<5; s = s>>>0; return s/4294967296; };
  for(let i=n-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  return idx.map(i=>src[i]);
}
function deckCard(k){ return PKG.deck.cards.find(c=>c.k===k); }
function deckArchive(){
  const st=S.deck, cs=PKG.deck.cards;
  const rows=cs.map(c=>{const a=st.cards[c.k]||{}; return {word:c.word, lesson:c.lesson, en:a.en||null, rating:a.rating||null, at:a.at||null};})
                .filter(r=>r.en);
  st.history.push({pass:st.pass, seed:st.seed, finished:today(), cards:rows});
  st.history = st.history.slice(-10);
  st.pass += 1; st.seed = Math.floor(Math.random()*1e9)+1; st.cards = {};
  save();
}
function deckHTML(){
  const cs=deckOrder(), st=S.deck, done=Object.keys(st.cards).length;
  const head=`<header><h1>${esc(PKG.deck.title)}</h1><button data-nav="home" class="sub">cerrar ✕</button></header>
  <p class="sub">Las ${cs.length} palabras nuevas de las diez lecciones, en un orden distinto cada vuelta.
  Lee la palabra, dale la vuelta, marca si la sabías. Vuelta ${st.pass} · ${done}/${cs.length}</p>`;
  let i = cs.findIndex(c=>!st.cards[c.k]);
  if(view.forceCard!=null) i=view.forceCard;
  if(i<0){
    const marks=cs.map(c=>st.cards[c.k]||{}), si=marks.filter(a=>a.rating==='si').length;
    return head+`<div class="card"><h2>Vuelta ${st.pass} completa</h2>
      <p class="note"><b>${si}/${cs.length}</b> marcadas como sabidas. Las que no, abajo con un punto: tócalas para repetirlas.</p>
      <button class="btn" id="deckagain">Otra vuelta · nuevo orden</button>
      <button class="btn ghost" data-nav="home">Volver al índice</button></div>
      ${cs.map((c,j)=>{const a=st.cards[c.k]||{};
        return `<button class="lesson" data-recard="${j}"><span class="num">${a.rating==='si'?'✓':'·'}</span>
        <span class="t"><b>${esc(c.word)}</b><span>${markText(a)} · lección ${c.lesson}</span></span><span class="chev">›</span></button>`;}).join('')}`;
  }
  return head+cardMarkup(cs[i], i, cs.length, st.cards[cs[i].k]||{}, `lección ${cs[i].lesson}`);
}
function markText(a){ return a.rating==='si'?'la sabía':a.rating==='no'?'no la sabía':(a.en||'—'); }
